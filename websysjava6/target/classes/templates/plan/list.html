<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/layout :: head('生产计划')">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <a class="navbar-brand" href="/dashboard"><i class="fas fa-industry"></i> 生产管理系统</a>
</nav>
<div class="container-fluid">
    <div class="row">
        <div class="col-md-2 sidebar">
            <ul class="nav flex-column mt-3">
                <li class="nav-item"><a class="nav-link" href="/dashboard"><i class="fas fa-tachometer-alt"></i> 仪表盘</a></li>
                <li class="nav-item"><a class="nav-link" href="/products"><i class="fas fa-box"></i> 产品管理</a></li>
                <li class="nav-item"><a class="nav-link active" href="/plans"><i class="fas fa-calendar-alt"></i> 生产计划</a></li>
                <li class="nav-item"><a class="nav-link" href="/plans/schedule"><i class="fas fa-project-diagram"></i> 可视化排产</a></li>
                <li class="nav-item"><a class="nav-link" href="/processing"><i class="fas fa-cogs"></i> 加工流程</a></li>
                <li class="nav-item"><a class="nav-link" href="/parameters"><i class="fas fa-sliders-h"></i> 工艺参数</a></li>
                <li class="nav-item"><a class="nav-link" href="/equipment"><i class="fas fa-tools"></i> 设备管理</a></li>
                <li class="nav-item"><a class="nav-link" href="/equipment-records"><i class="fas fa-database"></i> 设备数据</a></li>
                <li class="nav-item"><a class="nav-link" href="/test-data"><i class="fas fa-flask"></i> 测试数据</a></li>
            </ul>
        </div>
        <div class="col-md-10 content-wrapper">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2><i class="fas fa-calendar-alt"></i> 生产计划</h2>
                <div>
                    <a href="/plans/schedule" class="btn btn-info mr-2">
                        <i class="fas fa-calendar"></i> 可视化排产
                    </a>
                    <a href="/plans/add" class="btn btn-primary">
                        <i class="fas fa-plus"></i> 新增计划
                    </a>
                </div>
            </div>
            
            <div th:if="${success}" class="alert alert-success alert-flash" th:text="${success}"></div>
            <div th:if="${error}" class="alert alert-danger alert-flash" th:text="${error}"></div>
            
            <div class="card mb-3">
                <div class="card-body">
                    <form class="form-inline">
                        <label class="mr-2">状态筛选：</label>
                        <select name="status" class="form-control mr-2" th:value="${currentStatus}">
                            <option value="">全部</option>
                            <option value="DRAFT">草稿</option>
                            <option value="PENDING">待执行</option>
                            <option value="RUNNING">执行中</option>
                            <option value="PAUSED">暂停</option>
                            <option value="COMPLETED">已完成</option>
                            <option value="CANCELLED">已取消</option>
                        </select>
                        <button type="submit" class="btn btn-primary">筛选</button>
                    </form>
                </div>
            </div>
            
            <div class="card">
                <div class="card-body">
                    <table class="table table-striped table-hover">
                        <thead class="thead-dark">
                            <tr>
                                <th>计划编号</th>
                                <th>计划名称</th>
                                <th>产品</th>
                                <th>批次号</th>
                                <th>计划数量</th>
                                <th>生产线</th>
                                <th>优先级</th>
                                <th>计划时间</th>
                                <th>状态</th>
                                <th class="table-action">操作</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:if="${plans.isEmpty()}">
                                <td colspan="10" class="text-center text-muted">暂无数据</td>
                            </tr>
                            <tr th:each="plan : ${plans}">
                                <td th:text="${plan.planCode}"></td>
                                <td th:text="${plan.planName}"></td>
                                <td th:text="${plan.product?.productName}"></td>
                                <td th:text="${plan.batchNumber}"></td>
                                <td th:text="${plan.planQuantity} + ' ' + ${plan.product?.unit}"></td>
                                <td th:text="${plan.productionLine ?: '-'}"></td>
                                <td>
                                    <span class="badge" 
                                          th:class="${plan.priority == 'HIGH' ? 'badge-danger' : (plan.priority == 'MEDIUM' ? 'badge-warning' : 'badge-secondary')}">
                                        <span th:text="${plan.priority == 'HIGH' ? '高' : (plan.priority == 'MEDIUM' ? '中' : '低')}"></span>
                                    </span>
                                </td>
                                <td th:text="${#temporals.format(plan.planStartDate, 'MM-dd')} + ' ~ ' + ${#temporals.format(plan.planEndDate, 'MM-dd')}"></td>
                                <td>
                                    <span class="badge status-badge" 
                                          th:class="${plan.status == 'COMPLETED' ? 'badge-success' : (plan.status == 'RUNNING' ? 'badge-primary' : (plan.status == 'PAUSED' ? 'badge-warning' : (plan.status == 'CANCELLED' ? 'badge-danger' : 'badge-secondary')))}"
                                          th:text="${plan.status == 'DRAFT' ? '草稿' : (plan.status == 'PENDING' ? '待执行' : (plan.status == 'RUNNING' ? '执行中' : (plan.status == 'PAUSED' ? '暂停' : (plan.status == 'COMPLETED' ? '已完成' : '已取消'))))}">
                                    </span>
                                </td>
                                <td class="table-action">
                                    <a th:href="@{/plans/edit/{id}(id=${plan.id})}" class="btn btn-sm btn-info btn-action">
                                        <i class="fas fa-edit"></i>
                                    </a>
                                    <a th:href="@{/processing/add(planId=${plan.id})}" class="btn btn-sm btn-success btn-action" title="新增加工">
                                        <i class="fas fa-plus-circle"></i>
                                    </a>
                                    <div class="btn-group" role="group">
                                        <button type="button" class="btn btn-sm btn-secondary dropdown-toggle" data-toggle="dropdown">
                                            <i class="fas fa-cog"></i>
                                        </button>
                                        <div class="dropdown-menu">
                                            <a th:href="@{/plans/status/{id}/PENDING(id=${plan.id})}" class="dropdown-item">设为待执行</a>
                                            <a th:href="@{/plans/status/{id}/RUNNING(id=${plan.id})}" class="dropdown-item">开始执行</a>
                                            <a th:href="@{/plans/status/{id}/PAUSED(id=${plan.id})}" class="dropdown-item">暂停</a>
                                            <a th:href="@{/plans/status/{id}/COMPLETED(id=${plan.id})}" class="dropdown-item">完成</a>
                                            <div class="dropdown-divider"></div>
                                            <a th:href="@{/plans/status/{id}/CANCELLED(id=${plan.id})}" class="dropdown-item text-danger">取消</a>
                                        </div>
                                    </div>
                                    <a th:href="@{/plans/delete/{id}(id=${plan.id})}" 
                                       class="btn btn-sm btn-danger" 
                                       onclick="return confirm('确认删除？')">
                                        <i class="fas fa-trash"></i>
                                    </a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                    <div th:if="${totalPages > 1}" class="d-flex justify-content-between align-items-center mt-3">
                        <div class="text-muted">
                            共 <span th:text="${totalElements}">0</span> 条记录，第 <span th:text="${currentPage + 1}">1</span>/<span th:text="${totalPages}">1</span> 页
                        </div>
                        <nav>
                            <ul class="pagination mb-0">
                                <li class="page-item" th:class="${currentPage == 0} ? 'disabled'">
                                    <a class="page-link" th:href="@{/plans(status=${currentStatus}, page=0, size=${pageSize})}">首页</a>
                                </li>
                                <li class="page-item" th:class="${currentPage == 0} ? 'disabled'">
                                    <a class="page-link" th:href="@{/plans(status=${currentStatus}, page=${currentPage - 1}, size=${pageSize})}">上一页</a>
                                </li>
                                <li class="page-item" th:class="${currentPage + 1 >= totalPages} ? 'disabled'">
                                    <a class="page-link" th:href="@{/plans(status=${currentStatus}, page=${currentPage + 1}, size=${pageSize})}">下一页</a>
                                </li>
                                <li class="page-item" th:class="${currentPage + 1 >= totalPages} ? 'disabled'">
                                    <a class="page-link" th:href="@{/plans(status=${currentStatus}, page=${totalPages - 1}, size=${pageSize})}">末页</a>
                                </li>
                            </ul>
                        </nav>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/jquery@3.6.4/dist/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
