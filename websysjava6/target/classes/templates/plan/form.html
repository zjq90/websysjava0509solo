<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/layout :: head(${plan.id == null} ? '新增生产计划' : '编辑生产计划')">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <a class="navbar-brand" href="/dashboard"><i class="fas fa-industry"></i> 生产管理系统</a>
</nav>
<div class="container-fluid">
    <div class="row">
        <div class="col-md-2 sidebar">
            <ul class="nav flex-column mt-3">
                <li class="nav-item"><a class="nav-link" href="/dashboard"><i class="fas fa-tachometer-alt"></i> 仪表盘</a></li>
                <li class="nav-item"><a class="nav-link" href="/products"><i class="fas fa-box"></i> 产品管理</a></li>
                <li class="nav-item"><a class="nav-link active" href="/plans"><i class="fas fa-calendar-alt"></i> 生产计划</a></li>
                <li class="nav-item"><a class="nav-link" href="/plans/schedule"><i class="fas fa-project-diagram"></i> 可视化排产</a></li>
                <li class="nav-item"><a class="nav-link" href="/processing"><i class="fas fa-cogs"></i> 加工流程</a></li>
                <li class="nav-item"><a class="nav-link" href="/parameters"><i class="fas fa-sliders-h"></i> 工艺参数</a></li>
                <li class="nav-item"><a class="nav-link" href="/equipment"><i class="fas fa-tools"></i> 设备管理</a></li>
                <li class="nav-item"><a class="nav-link" href="/equipment-records"><i class="fas fa-database"></i> 设备数据</a></li>
                <li class="nav-item"><a class="nav-link" href="/test-data"><i class="fas fa-flask"></i> 测试数据</a></li>
            </ul>
        </div>
        <div class="col-md-10 content-wrapper">
            <h2 class="mb-4" th:text="${plan.id == null} ? '新增生产计划' : '编辑生产计划'">
                <i class="fas fa-plus"></i> 新增生产计划
            </h2>
            
            <div class="card">
                <div class="card-body">
                    <form th:action="@{/plans/save}" method="post" th:object="${plan}">
                        <input type="hidden" th:field="*{id}" />
                        
                        <div class="row">
                            <div class="col-md-4">
                                <div class="form-group">
                                    <label>计划编号 <span class="text-danger">*</span></label>
                                    <input type="text" th:field="*{planCode}" class="form-control" required="required" placeholder="如：PLAN20240101001" />
                                </div>
                            </div>
                            <div class="col-md-4">
                                <div class="form-group">
                                    <label>批次号 <span class="text-danger">*</span></label>
                                    <input type="text" th:field="*{batchNumber}" class="form-control" required="required" placeholder="如：B2024010101" />
                                </div>
                            </div>
                            <div class="col-md-4">
                                <div class="form-group">
                                    <label>产品 <span class="text-danger">*</span></label>
                                    <select name="productId" class="form-control" required="required">
                                        <option value="">请选择产品</option>
                                        <option th:each="product : ${products}" 
                                                th:value="${product.id}" 
                                                th:text="${product.productCode + ' - ' + product.productName}"
                                                th:selected="${plan.product?.id == product.id}">
                                        </option>
                                    </select>
                                </div>
                            </div>
                        </div>
                        
                        <div class="form-group">
                            <label>计划名称 <span class="text-danger">*</span></label>
                            <input type="text" th:field="*{planName}" class="form-control" required="required" placeholder="如：2024年春季玉米种子生产计划" />
                        </div>
                        
                        <div class="row">
                            <div class="col-md-4">
                                <div class="form-group">
                                    <label>计划数量 <span class="text-danger">*</span></label>
                                    <input type="number" th:field="*{planQuantity}" class="form-control" required="required" step="0.01" />
                                </div>
                            </div>
                            <div class="col-md-4">
                                <div class="form-group">
                                    <label>生产线</label>
                                    <select th:field="*{productionLine}" class="form-control">
                                        <option value="">请选择</option>
                                        <option value="A线">A线</option>
                                        <option value="B线">B线</option>
                                        <option value="C线">C线</option>
                                    </select>
                                </div>
                            </div>
                            <div class="col-md-4">
                                <div class="form-group">
                                    <label>优先级</label>
                                    <select th:field="*{priority}" class="form-control">
                                        <option value="LOW">低</option>
                                        <option value="MEDIUM">中</option>
                                        <option value="HIGH">高</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                        
                        <div class="row">
                            <div class="col-md-4">
                                <div class="form-group">
                                    <label>计划开始日期 <span class="text-danger">*</span></label>
                                    <input type="date" th:field="*{planStartDate}" class="form-control" required="required" />
                                </div>
                            </div>
                            <div class="col-md-4">
                                <div class="form-group">
                                    <label>计划完成日期 <span class="text-danger">*</span></label>
                                    <input type="date" th:field="*{planEndDate}" class="form-control" required="required" />
                                </div>
                            </div>
                            <div class="col-md-4">
                                <div class="form-group">
                                    <label>负责人</label>
                                    <input type="text" th:field="*{responsiblePerson}" class="form-control" />
                                </div>
                            </div>
                        </div>
                        
                        <div class="form-group">
                            <label>状态</label>
                            <select th:field="*{status}" class="form-control">
                                <option value="DRAFT">草稿</option>
                                <option value="PENDING">待执行</option>
                                <option value="RUNNING">执行中</option>
                                <option value="PAUSED">暂停</option>
                                <option value="COMPLETED">已完成</option>
                                <option value="CANCELLED">已取消</option>
                            </select>
                        </div>
                        
                        <div class="form-group">
                            <label>备注</label>
                            <textarea th:field="*{remarks}" class="form-control" rows="3"></textarea>
                        </div>
                        
                        <div class="form-group">
                            <button type="submit" class="btn btn-primary">
                                <i class="fas fa-save"></i> 保存
                            </button>
                            <a href="/plans" class="btn btn-secondary">
                                <i class="fas fa-arrow-left"></i> 返回
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/jquery@3.6.4/dist/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
