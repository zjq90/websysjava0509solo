<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/layout :: head('可视化排产')">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <a class="navbar-brand" href="/dashboard"><i class="fas fa-industry"></i> 生产管理系统</a>
</nav>
<div class="container-fluid">
    <div class="row">
        <div class="col-md-2 sidebar">
            <ul class="nav flex-column mt-3">
                <li class="nav-item"><a class="nav-link" href="/dashboard"><i class="fas fa-tachometer-alt"></i> 仪表盘</a></li>
                <li class="nav-item"><a class="nav-link" href="/products"><i class="fas fa-box"></i> 产品管理</a></li>
                <li class="nav-item"><a class="nav-link" href="/plans"><i class="fas fa-calendar-alt"></i> 生产计划</a></li>
                <li class="nav-item"><a class="nav-link active" href="/plans/schedule"><i class="fas fa-project-diagram"></i> 可视化排产</a></li>
                <li class="nav-item"><a class="nav-link" href="/processing"><i class="fas fa-cogs"></i> 加工流程</a></li>
                <li class="nav-item"><a class="nav-link" href="/parameters"><i class="fas fa-sliders-h"></i> 工艺参数</a></li>
                <li class="nav-item"><a class="nav-link" href="/equipment"><i class="fas fa-tools"></i> 设备管理</a></li>
                <li class="nav-item"><a class="nav-link" href="/equipment-records"><i class="fas fa-database"></i> 设备数据</a></li>
                <li class="nav-item"><a class="nav-link" href="/test-data"><i class="fas fa-flask"></i> 测试数据</a></li>
            </ul>
        </div>
        <div class="col-md-10 content-wrapper">
            <h2 class="mb-4">
                <i class="fas fa-project-diagram"></i> 可视化排产
            </h2>
            
            <div class="card mb-4">
                <div class="card-header">
                    <h5 class="card-title mb-0"><i class="fas fa-calendar-day"></i> 排产说明</h5>
                </div>
                <div class="card-body">
                    <p class="text-muted">可视化排产功能用于展示各生产线的生产计划安排。</p>
                    <div class="row">
                        <div class="col-md-3">
                            <span class="badge badge-primary p-2 mr-2">RUNNING</span> 执行中
                        </div>
                        <div class="col-md-3">
                            <span class="badge badge-success p-2 mr-2">COMPLETED</span> 已完成
                        </div>
                        <div class="col-md-3">
                            <span class="badge badge-warning p-2 mr-2">PAUSED</span> 暂停
                        </div>
                        <div class="col-md-3">
                            <span class="badge badge-secondary p-2 mr-2">PENDING</span> 待执行
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="card">
                <div class="card-header">
                    <h5 class="card-title mb-0"><i class="fas fa-list"></i> 当前排产计划</h5>
                </div>
                <div class="card-body">
                    <table class="table table-striped">
                        <thead class="thead-dark">
                            <tr>
                                <th>计划编号</th>
                                <th>计划名称</th>
                                <th>产品</th>
                                <th>批次</th>
                                <th>生产线</th>
                                <th>计划时间</th>
                                <th>进度</th>
                                <th>状态</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:if="${plans.isEmpty()}">
                                <td colspan="9" class="text-center text-muted">暂无活跃计划</td>
                            </tr>
                            <tr th:each="plan : ${plans}">
                                <td th:text="${plan.planCode}"></td>
                                <td th:text="${plan.planName}"></td>
                                <td th:text="${plan.product?.productName}"></td>
                                <td th:text="${plan.batchNumber}"></td>
                                <td th:text="${plan.productionLine ?: '-'}"></td>
                                <td th:text="${#temporals.format(plan.planStartDate, 'MM-dd')} + ' ~ ' + ${#temporals.format(plan.planEndDate, 'MM-dd')}"></td>
                                <td>
                                    <div class="progress" style="height: 20px;">
                                        <div class="progress-bar" 
                                             th:class="${plan.status == 'COMPLETED'} ? 'progress-bar-success' : 'progress-bar-info'"
                                             role="progressbar" 
                                             th:style="'width: ' + ${plan.progressPercent} + '%'"
                                             th:text="${plan.progressText}">
                                        </div>
                                    </div>
                                </td>
                                <td>
                                    <span class="badge" 
                                          th:class="${plan.status == 'RUNNING' ? 'badge-primary' : (plan.status == 'COMPLETED' ? 'badge-success' : (plan.status == 'PAUSED' ? 'badge-warning' : 'badge-secondary'))}">
                                        <span th:text="${plan.status == 'PENDING' ? '待执行' : (plan.status == 'RUNNING' ? '执行中' : (plan.status == 'PAUSED' ? '暂停' : '已完成'))}">
                                        </span>
                                    </span>
                                </td>
                                <td>
                                    <a th:href="@{/plans/edit/{id}(id=${plan.id})}" class="btn btn-sm btn-info">
                                        <i class="fas fa-edit"></i>
                                    </a>
                                    <a th:href="@{/processing/add(planId=${plan.id})}" class="btn btn-sm btn-success" title="新增加工">
                                        <i class="fas fa-plus-circle"></i>
                                    </a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/jquery@3.6.4/dist/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
