<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/layout :: head('加工流程')">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <a class="navbar-brand" href="/dashboard"><i class="fas fa-industry"></i> 生产管理系统</a>
</nav>
<div class="container-fluid">
    <div class="row">
        <div class="col-md-2 sidebar">
            <ul class="nav flex-column mt-3">
                <li class="nav-item"><a class="nav-link" href="/dashboard"><i class="fas fa-tachometer-alt"></i> 仪表盘</a></li>
                <li class="nav-item"><a class="nav-link" href="/products"><i class="fas fa-box"></i> 产品管理</a></li>
                <li class="nav-item"><a class="nav-link" href="/plans"><i class="fas fa-calendar-alt"></i> 生产计划</a></li>
                <li class="nav-item"><a class="nav-link" href="/plans/schedule"><i class="fas fa-project-diagram"></i> 可视化排产</a></li>
                <li class="nav-item"><a class="nav-link active" href="/processing"><i class="fas fa-cogs"></i> 加工流程</a></li>
                <li class="nav-item"><a class="nav-link" href="/parameters"><i class="fas fa-sliders-h"></i> 工艺参数</a></li>
                <li class="nav-item"><a class="nav-link" href="/equipment"><i class="fas fa-tools"></i> 设备管理</a></li>
                <li class="nav-item"><a class="nav-link" href="/equipment-records"><i class="fas fa-database"></i> 设备数据</a></li>
                <li class="nav-item"><a class="nav-link" href="/test-data"><i class="fas fa-flask"></i> 测试数据</a></li>
            </ul>
        </div>
        <div class="col-md-10 content-wrapper">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2><i class="fas fa-cogs"></i> 加工流程</h2>
                <a href="/processing/add" class="btn btn-primary">
                    <i class="fas fa-plus"></i> 新增加工
                </a>
            </div>
            
            <div th:if="${success}" class="alert alert-success alert-flash" th:text="${success}"></div>
            <div th:if="${error}" class="alert alert-danger alert-flash" th:text="${error}"></div>
            
            <div class="card mb-3">
                <div class="card-body">
                    <form class="form-inline">
                        <label class="mr-2">生产计划：</label>
                        <select name="planId" class="form-control mr-2" th:value="${currentPlanId}">
                            <option value="">全部计划</option>
                            <option th:each="plan : ${plans}" 
                                    th:value="${plan.id}" 
                                    th:text="${plan.planCode + ' - ' + plan.planName}">
                            </option>
                        </select>
                        <button type="submit" class="btn btn-primary">筛选</button>
                    </form>
                </div>
            </div>
            
            <div class="card">
                <div class="card-body">
                    <table class="table table-striped table-hover">
                        <thead class="thead-dark">
                            <tr>
                                <th>记录编号</th>
                                <th>生产计划</th>
                                <th>工序类型</th>
                                <th>工序名称</th>
                                <th>加工数量</th>
                                <th>操作人</th>
                                <th>使用设备</th>
                                <th>开工时间</th>
                                <th>状态</th>
                                <th class="table-action">操作</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:if="${records.isEmpty()}">
                                <td colspan="10" class="text-center text-muted">暂无数据</td>
                            </tr>
                            <tr th:each="record : ${records}">
                                <td th:text="${record.recordCode}"></td>
                                <td th:text="${record.productionPlan?.planCode}"></td>
                                <td>
                                    <span class="badge" 
                                          th:class="${record.processType == 'CLEANING' ? 'badge-info' : (record.processType == 'COATING' ? 'badge-warning' : (record.processType == 'PACKAGING' ? 'badge-success' : 'badge-secondary'))}">
                                        <span th:text="${record.processType == 'CLEANING' ? '清选' : (record.processType == 'COATING' ? '包衣' : (record.processType == 'PACKAGING' ? '分装' : (record.processType == 'INSPECTION' ? '检验' : '其他')))}">
                                        </span>
                                    </span>
                                </td>
                                <td th:text="${record.processName}"></td>
                                <td th:text="${record.quantity} + ' ' + ${record.productionPlan?.product?.unit}"></td>
                                <td th:text="${record.operator ?: '-'}"></td>
                                <td th:text="${record.equipment?.equipmentName ?: '-'}"></td>
                                <td th:text="${#temporals.format(record.startTime, 'MM-dd HH:mm')}"></td>
                                <td>
                                    <span class="badge status-badge" 
                                          th:class="${record.status == 'COMPLETED' ? 'badge-success' : (record.status == 'PROCESSING' ? 'badge-primary' : (record.status == 'PAUSED' ? 'badge-warning' : 'badge-secondary'))}"
                                          th:text="${record.status == 'PENDING' ? '待开始' : (record.status == 'PROCESSING' ? '进行中' : (record.status == 'PAUSED' ? '暂停' : '已完成'))}">
                                    </span>
                                </td>
                                <td class="table-action">
                                    <a th:href="@{/processing/edit/{id}(id=${record.id})}" class="btn btn-sm btn-info btn-action">
                                        <i class="fas fa-edit"></i>
                                    </a>
                                    <a th:href="@{/processing/detail/{id}(id=${record.id})}" class="btn btn-sm btn-primary btn-action">
                                        <i class="fas fa-eye"></i>
                                    </a>
                                    <a th:href="@{/parameters/add(recordId=${record.id})}" class="btn btn-sm btn-warning btn-action" title="添加参数">
                                        <i class="fas fa-sliders-h"></i>
                                    </a>
                                    <div class="btn-group" role="group">
                                        <button type="button" class="btn btn-sm btn-secondary dropdown-toggle" data-toggle="dropdown">
                                            <i class="fas fa-cog"></i>
                                        </button>
                                        <div class="dropdown-menu">
                                            <a th:href="@{/processing/status/{id}/PROCESSING(id=${record.id})}" class="dropdown-item">开始加工</a>
                                            <a th:href="@{/processing/status/{id}/PAUSED(id=${record.id})}" class="dropdown-item">暂停</a>
                                            <a th:href="@{/processing/status/{id}/COMPLETED(id=${record.id})}" class="dropdown-item">完成</a>
                                        </div>
                                    </div>
                                    <a th:href="@{/processing/delete/{id}(id=${record.id})}" 
                                       class="btn btn-sm btn-danger" 
                                       onclick="return confirm('确认删除？')">
                                        <i class="fas fa-trash"></i>
                                    </a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                    <div th:if="${totalPages > 1}" class="d-flex justify-content-between align-items-center mt-3">
                        <div class="text-muted">
                            共 <span th:text="${totalElements}">0</span> 条记录，第 <span th:text="${currentPage + 1}">1</span>/<span th:text="${totalPages}">1</span> 页
                        </div>
                        <nav>
                            <ul class="pagination mb-0">
                                <li class="page-item" th:class="${currentPage == 0} ? 'disabled'">
                                    <a class="page-link" th:href="@{/processing(planId=${currentPlanId}, page=0, size=${pageSize})}">首页</a>
                                </li>
                                <li class="page-item" th:class="${currentPage == 0} ? 'disabled'">
                                    <a class="page-link" th:href="@{/processing(planId=${currentPlanId}, page=${currentPage - 1}, size=${pageSize})}">上一页</a>
                                </li>
                                <li class="page-item" th:class="${currentPage + 1 >= totalPages} ? 'disabled'">
                                    <a class="page-link" th:href="@{/processing(planId=${currentPlanId}, page=${currentPage + 1}, size=${pageSize})}">下一页</a>
                                </li>
                                <li class="page-item" th:class="${currentPage + 1 >= totalPages} ? 'disabled'">
                                    <a class="page-link" th:href="@{/processing(planId=${currentPlanId}, page=${totalPages - 1}, size=${pageSize})}">末页</a>
                                </li>
                            </ul>
                        </nav>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/jquery@3.6.4/dist/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
