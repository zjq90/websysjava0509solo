<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/layout :: head(${product.id == null} ? '新增产品' : '编辑产品')">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <a class="navbar-brand" href="/dashboard"><i class="fas fa-industry"></i> 生产管理系统</a>
</nav>
<div class="container-fluid">
    <div class="row">
        <div class="col-md-2 sidebar">
            <ul class="nav flex-column mt-3">
                <li class="nav-item"><a class="nav-link" href="/dashboard"><i class="fas fa-tachometer-alt"></i> 仪表盘</a></li>
                <li class="nav-item"><a class="nav-link active" href="/products"><i class="fas fa-box"></i> 产品管理</a></li>
                <li class="nav-item"><a class="nav-link" href="/plans"><i class="fas fa-calendar-alt"></i> 生产计划</a></li>
                <li class="nav-item"><a class="nav-link" href="/plans/schedule"><i class="fas fa-project-diagram"></i> 可视化排产</a></li>
                <li class="nav-item"><a class="nav-link" href="/processing"><i class="fas fa-cogs"></i> 加工流程</a></li>
                <li class="nav-item"><a class="nav-link" href="/parameters"><i class="fas fa-sliders-h"></i> 工艺参数</a></li>
                <li class="nav-item"><a class="nav-link" href="/equipment"><i class="fas fa-tools"></i> 设备管理</a></li>
                <li class="nav-item"><a class="nav-link" href="/equipment-records"><i class="fas fa-database"></i> 设备数据</a></li>
                <li class="nav-item"><a class="nav-link" href="/test-data"><i class="fas fa-flask"></i> 测试数据</a></li>
            </ul>
        </div>
        <div class="col-md-10 content-wrapper">
            <h2 class="mb-4" th:text="${product.id == null} ? '新增产品' : '编辑产品'">
                <i class="fas fa-plus"></i> 新增产品
            </h2>
            
            <div class="card">
                <div class="card-body">
                    <form th:action="@{/products/save}" method="post" th:object="${product}">
                        <input type="hidden" th:field="*{id}" />
                        
                        <div class="row">
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label>产品编号 <span class="text-danger">*</span></label>
                                    <input type="text" th:field="*{productCode}" class="form-control" required="required" placeholder="如：P001" />
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label>产品名称 <span class="text-danger">*</span></label>
                                    <input type="text" th:field="*{productName}" class="form-control" required="required" placeholder="如：玉米种子" />
                                </div>
                            </div>
                        </div>
                        
                        <div class="row">
                            <div class="col-md-4">
                                <div class="form-group">
                                    <label>规格型号</label>
                                    <input type="text" th:field="*{specification}" class="form-control" placeholder="如：5kg/袋" />
                                </div>
                            </div>
                            <div class="col-md-4">
                                <div class="form-group">
                                    <label>产品类型</label>
                                    <select th:field="*{productType}" class="form-control">
                                        <option value="">请选择</option>
                                        <option value="种子">种子</option>
                                        <option value="化肥">化肥</option>
                                        <option value="农药">农药</option>
                                        <option value="其他">其他</option>
                                    </select>
                                </div>
                            </div>
                            <div class="col-md-4">
                                <div class="form-group">
                                    <label>单位</label>
                                    <select th:field="*{unit}" class="form-control">
                                        <option value="">请选择</option>
                                        <option value="kg">kg</option>
                                        <option value="袋">袋</option>
                                        <option value="箱">箱</option>
                                        <option value="件">件</option>
                                        <option value="吨">吨</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                        
                        <div class="form-group">
                            <label>产品描述</label>
                            <textarea th:field="*{description}" class="form-control" rows="3" placeholder="产品详细描述..."></textarea>
                        </div>
                        
                        <div class="form-group">
                            <label>状态</label>
                            <select th:field="*{status}" class="form-control">
                                <option value="ACTIVE">激活</option>
                                <option value="INACTIVE">停用</option>
                            </select>
                        </div>
                        
                        <div class="form-group">
                            <button type="submit" class="btn btn-primary">
                                <i class="fas fa-save"></i> 保存
                            </button>
                            <a href="/products" class="btn btn-secondary">
                                <i class="fas fa-arrow-left"></i> 返回
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/jquery@3.6.4/dist/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
