<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/layout :: head('设备数据详情')">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <a class="navbar-brand" href="/dashboard"><i class="fas fa-industry"></i> 生产管理系统</a>
</nav>
<div class="container-fluid">
    <div class="row">
        <div class="col-md-2 sidebar">
            <ul class="nav flex-column mt-3">
                <li class="nav-item"><a class="nav-link" href="/dashboard"><i class="fas fa-tachometer-alt"></i> 仪表盘</a></li>
                <li class="nav-item"><a class="nav-link" href="/products"><i class="fas fa-box"></i> 产品管理</a></li>
                <li class="nav-item"><a class="nav-link" href="/plans"><i class="fas fa-calendar-alt"></i> 生产计划</a></li>
                <li class="nav-item"><a class="nav-link" href="/plans/schedule"><i class="fas fa-project-diagram"></i> 可视化排产</a></li>
                <li class="nav-item"><a class="nav-link" href="/processing"><i class="fas fa-cogs"></i> 加工流程</a></li>
                <li class="nav-item"><a class="nav-link" href="/parameters"><i class="fas fa-sliders-h"></i> 工艺参数</a></li>
                <li class="nav-item"><a class="nav-link" href="/equipment"><i class="fas fa-tools"></i> 设备管理</a></li>
                <li class="nav-item"><a class="nav-link active" href="/equipment-records"><i class="fas fa-database"></i> 设备数据</a></li>
                <li class="nav-item"><a class="nav-link" href="/test-data"><i class="fas fa-flask"></i> 测试数据</a></li>
            </ul>
        </div>
        <div class="col-md-10 content-wrapper">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2><i class="fas fa-info-circle"></i> 设备数据详情</h2>
                <a href="/equipment-records" class="btn btn-secondary">
                    <i class="fas fa-arrow-left"></i> 返回列表
                </a>
            </div>
            
            <div class="card mb-4">
                <div class="card-header">
                    <h5 class="card-title mb-0">基本信息</h5>
                </div>
                <div class="card-body">
                    <div class="row">
                        <div class="col-md-3"><strong>设备：</strong><span th:text="${record.equipment?.equipmentName}"></span></div>
                        <div class="col-md-3"><strong>数据来源：</strong>
                            <span class="badge" th:class="${record.dataSource == 'AUTO'} ? 'badge-success' : 'badge-secondary'">
                                <span th:text="${record.dataSource == 'AUTO'} ? '自动采集' : '手动录入'"></span>
                            </span>
                        </div>
                        <div class="col-md-3"><strong>运行状态：</strong>
                            <span class="badge" th:class="${record.runStatus == 'RUNNING' ? 'badge-primary' : (record.runStatus == 'FAULT' ? 'badge-danger' : 'badge-secondary')}">
                                <span th:text="${record.runStatus}"></span>
                            </span>
                        </div>
                        <div class="col-md-3"><strong>记录时间：</strong><span th:text="${#temporals.format(record.recordTime, 'yyyy-MM-dd HH:mm:ss')}"></span></div>
                    </div>
                </div>
            </div>
            
            <div class="card mb-4">
                <div class="card-header">
                    <h5 class="card-title mb-0">运行参数</h5>
                </div>
                <div class="card-body">
                    <div class="row">
                        <div class="col-md-3"><strong>当前速度：</strong><span th:text="${record.currentSpeed ?: '-'}"></span></div>
                        <div class="col-md-3"><strong>产量：</strong><span th:text="${record.productionOutput ?: '-'}"></span></div>
                        <div class="col-md-3"><strong>运行时长：</strong><span th:text="${record.runDuration ?: '-'}"> 分钟</span></div>
                    </div>
                    <hr/>
                    <div class="row">
                        <div class="col-md-3"><strong>温度：</strong><span th:text="${record.temperature ?: '-'}"> ℃</span></div>
                        <div class="col-md-3"><strong>压力：</strong><span th:text="${record.pressure ?: '-'}"> MPa</span></div>
                    </div>
                </div>
            </div>
            
            <div class="card mb-4" th:if="${record.alarmMessage != null}">
                <div class="card-header bg-danger text-white">
                    <h5 class="card-title mb-0"><i class="fas fa-exclamation-triangle"></i> 告警信息</h5>
                </div>
                <div class="card-body">
                    <p class="text-danger" th:text="${record.alarmMessage}"></p>
                </div>
            </div>
            
            <div class="card" th:if="${record.rawData != null}">
                <div class="card-header">
                    <h5 class="card-title mb-0">原始数据</h5>
                </div>
                <div class="card-body">
                    <pre><code th:text="${record.rawData}"></code></pre>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/jquery@3.6.4/dist/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
