<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/layout :: head(${parameter.id == null ? '新增工艺参数' : '编辑工艺参数'})">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <a class="navbar-brand" href="/dashboard"><i class="fas fa-industry"></i> 生产管理系统</a>
</nav>
<div class="container-fluid">
    <div class="row">
        <div class="col-md-2 sidebar">
            <ul class="nav flex-column mt-3">
                <li class="nav-item"><a class="nav-link" href="/dashboard"><i class="fas fa-tachometer-alt"></i> 仪表盘</a></li>
                <li class="nav-item"><a class="nav-link" href="/products"><i class="fas fa-box"></i> 产品管理</a></li>
                <li class="nav-item"><a class="nav-link" href="/plans"><i class="fas fa-calendar-alt"></i> 生产计划</a></li>
                <li class="nav-item"><a class="nav-link" href="/plans/schedule"><i class="fas fa-project-diagram"></i> 可视化排产</a></li>
                <li class="nav-item"><a class="nav-link" href="/processing"><i class="fas fa-cogs"></i> 加工流程</a></li>
                <li class="nav-item"><a class="nav-link active" href="/parameters"><i class="fas fa-sliders-h"></i> 工艺参数</a></li>
                <li class="nav-item"><a class="nav-link" href="/equipment"><i class="fas fa-tools"></i> 设备管理</a></li>
                <li class="nav-item"><a class="nav-link" href="/equipment-records"><i class="fas fa-database"></i> 设备数据</a></li>
                <li class="nav-item"><a class="nav-link" href="/test-data"><i class="fas fa-flask"></i> 测试数据</a></li>
            </ul>
        </div>
        <div class="col-md-10 content-wrapper">
            <h2 class="mb-4" th:text="${parameter.id == null ? '新增工艺参数' : '编辑工艺参数'}">
                <i class="fas fa-plus"></i> 新增工艺参数
            </h2>
            
            <div class="card">
                <div class="card-body">
                    <form th:action="@{/parameters/save}" method="post" th:object="${parameter}">
                        <input type="hidden" th:field="*{id}" />
                        
                        <div class="row">
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label>加工记录 <span class="text-danger">*</span></label>
                                    <select name="recordId" class="form-control" required="required">
                                        <option value="">请选择</option>
                                        <option th:each="rec : ${records}" 
                                                th:value="${rec.id}" 
                                                th:text="${rec.recordCode + ' - ' + rec.processName}"
                                                th:selected="${parameter.processingRecord?.id == rec.id}">
                                        </option>
                                    </select>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label>参数名称 <span class="text-danger">*</span></label>
                                    <select th:field="*{parameterName}" class="form-control" required="required">
                                        <option value="">请选择</option>
                                        <option value="温度">温度</option>
                                        <option value="转速">转速</option>
                                        <option value="湿度">湿度</option>
                                        <option value="压力">压力</option>
                                        <option value="流量">流量</option>
                                        <option value="电压">电压</option>
                                        <option value="电流">电流</option>
                                        <option value="速度">速度</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                        
                        <div class="row">
                            <div class="col-md-4">
                                <div class="form-group">
                                    <label>参数值 <span class="text-danger">*</span></label>
                                    <input type="number" th:field="*{parameterValue}" class="form-control" required="required" step="0.0001" />
                                </div>
                            </div>
                            <div class="col-md-4">
                                <div class="form-group">
                                    <label>单位</label>
                                    <select th:field="*{parameterUnit}" class="form-control">
                                        <option value="">请选择</option>
                                        <option value="℃">℃</option>
                                        <option value="rpm">rpm</option>
                                        <option value="%">%</option>
                                        <option value="MPa">MPa</option>
                                        <option value="m³/h">m³/h</option>
                                        <option value="V">V</option>
                                        <option value="A">A</option>
                                        <option value="m/min">m/min</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                        
                        <div class="row">
                            <div class="col-md-4">
                                <div class="form-group">
                                    <label>标准下限</label>
                                    <input type="number" th:field="*{lowerLimit}" class="form-control" step="0.0001" />
                                </div>
                            </div>
                            <div class="col-md-4">
                                <div class="form-group">
                                    <label>标准上限</label>
                                    <input type="number" th:field="*{upperLimit}" class="form-control" step="0.0001" />
                                </div>
                            </div>
                        </div>
                        
                        <div class="form-group">
                            <label>备注</label>
                            <textarea th:field="*{remarks}" class="form-control" rows="3"></textarea>
                        </div>
                        
                        <div class="form-group">
                            <button type="submit" class="btn btn-primary">
                                <i class="fas fa-save"></i> 保存
                            </button>
                            <a href="/parameters" class="btn btn-secondary">
                                <i class="fas fa-arrow-left"></i> 返回
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/jquery@3.6.4/dist/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
