<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/layout :: head('工艺参数')">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <a class="navbar-brand" href="/dashboard"><i class="fas fa-industry"></i> 生产管理系统</a>
</nav>
<div class="container-fluid">
    <div class="row">
        <div class="col-md-2 sidebar">
            <ul class="nav flex-column mt-3">
                <li class="nav-item"><a class="nav-link" href="/dashboard"><i class="fas fa-tachometer-alt"></i> 仪表盘</a></li>
                <li class="nav-item"><a class="nav-link" href="/products"><i class="fas fa-box"></i> 产品管理</a></li>
                <li class="nav-item"><a class="nav-link" href="/plans"><i class="fas fa-calendar-alt"></i> 生产计划</a></li>
                <li class="nav-item"><a class="nav-link" href="/plans/schedule"><i class="fas fa-project-diagram"></i> 可视化排产</a></li>
                <li class="nav-item"><a class="nav-link" href="/processing"><i class="fas fa-cogs"></i> 加工流程</a></li>
                <li class="nav-item"><a class="nav-link active" href="/parameters"><i class="fas fa-sliders-h"></i> 工艺参数</a></li>
                <li class="nav-item"><a class="nav-link" href="/equipment"><i class="fas fa-tools"></i> 设备管理</a></li>
                <li class="nav-item"><a class="nav-link" href="/equipment-records"><i class="fas fa-database"></i> 设备数据</a></li>
                <li class="nav-item"><a class="nav-link" href="/test-data"><i class="fas fa-flask"></i> 测试数据</a></li>
            </ul>
        </div>
        <div class="col-md-10 content-wrapper">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2><i class="fas fa-sliders-h"></i> 工艺参数</h2>
                <a href="/parameters/add" class="btn btn-primary">
                    <i class="fas fa-plus"></i> 新增参数
                </a>
            </div>
            
            <div th:if="${success}" class="alert alert-success alert-flash" th:text="${success}"></div>
            <div th:if="${error}" class="alert alert-danger alert-flash" th:text="${error}"></div>
            
            <div class="card mb-3">
                <div class="card-body">
                    <form class="form-inline">
                        <label class="mr-2">加工记录：</label>
                        <select name="recordId" class="form-control mr-2" th:value="${currentRecordId}">
                            <option value="">全部</option>
                            <option th:each="rec : ${records}" 
                                    th:value="${rec.id}" 
                                    th:text="${rec.recordCode + ' - ' + rec.processName}">
                            </option>
                        </select>
                        <button type="submit" class="btn btn-primary">筛选</button>
                    </form>
                </div>
            </div>
            
            <div class="card">
                <div class="card-body">
                    <table class="table table-striped table-hover">
                        <thead class="thead-dark">
                            <tr>
                                <th>加工记录</th>
                                <th>参数名称</th>
                                <th>参数值</th>
                                <th>标准范围</th>
                                <th>状态</th>
                                <th>记录时间</th>
                                <th class="table-action">操作</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:if="${parameters.isEmpty()}">
                                <td colspan="7" class="text-center text-muted">暂无数据</td>
                            </tr>
                            <tr th:each="param : ${parameters}">
                                <td th:text="${param.processingRecord?.recordCode}"></td>
                                <td th:text="${param.parameterName}"></td>
                                <td th:text="${param.parameterValue + ' ' + (param.parameterUnit ?: '')}"></td>
                                <td th:text="${(param.lowerLimit != null ? param.lowerLimit : '-') + ' ~ ' + (param.upperLimit != null ? param.upperLimit : '-')}"></td>
                                <td>
                                    <span class="badge" th:class="${param.valueStatus == 'NORMAL'} ? 'badge-success' : 'badge-danger'">
                                        <span th:text="${param.valueStatus == 'NORMAL'} ? '正常' : '异常'}"></span>
                                    </span>
                                </td>
                                <td th:text="${#temporals.format(param.recordTime, 'MM-dd HH:mm:ss')}"></td>
                                <td class="table-action">
                                    <a th:href="@{/parameters/edit/{id}(id=${param.id})}" class="btn btn-sm btn-info btn-action">
                                        <i class="fas fa-edit"></i>
                                    </a>
                                    <a th:href="@{/parameters/delete/{id}(id=${param.id})}" 
                                       class="btn btn-sm btn-danger" 
                                       onclick="return confirm('确认删除？')">
                                        <i class="fas fa-trash"></i>
                                    </a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/jquery@3.6.4/dist/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
