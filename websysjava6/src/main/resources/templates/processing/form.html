<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/layout :: head(${record.id == null ? '新增加工记录' : '编辑加工记录'})">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <a class="navbar-brand" href="/dashboard"><i class="fas fa-industry"></i> 生产管理系统</a>
</nav>
<div class="container-fluid">
    <div class="row">
        <div class="col-md-2 sidebar">
            <ul class="nav flex-column mt-3">
                <li class="nav-item"><a class="nav-link" href="/dashboard"><i class="fas fa-tachometer-alt"></i> 仪表盘</a></li>
                <li class="nav-item"><a class="nav-link" href="/products"><i class="fas fa-box"></i> 产品管理</a></li>
                <li class="nav-item"><a class="nav-link" href="/plans"><i class="fas fa-calendar-alt"></i> 生产计划</a></li>
                <li class="nav-item"><a class="nav-link" href="/plans/schedule"><i class="fas fa-project-diagram"></i> 可视化排产</a></li>
                <li class="nav-item"><a class="nav-link active" href="/processing"><i class="fas fa-cogs"></i> 加工流程</a></li>
                <li class="nav-item"><a class="nav-link" href="/parameters"><i class="fas fa-sliders-h"></i> 工艺参数</a></li>
                <li class="nav-item"><a class="nav-link" href="/equipment"><i class="fas fa-tools"></i> 设备管理</a></li>
                <li class="nav-item"><a class="nav-link" href="/equipment-records"><i class="fas fa-database"></i> 设备数据</a></li>
                <li class="nav-item"><a class="nav-link" href="/test-data"><i class="fas fa-flask"></i> 测试数据</a></li>
            </ul>
        </div>
        <div class="col-md-10 content-wrapper">
            <h2 class="mb-4" th:text="${record.id == null ? '新增加工记录' : '编辑加工记录'}">
                <i class="fas fa-plus"></i> 新增加工记录
            </h2>
            
            <div class="card">
                <div class="card-body">
                    <form th:action="@{/processing/save}" method="post" th:object="${record}">
                        <input type="hidden" th:field="*{id}" />
                        
                        <div class="row">
                            <div class="col-md-4">
                                <div class="form-group">
                                    <label>记录编号 <span class="text-danger">*</span></label>
                                    <input type="text" th:field="*{recordCode}" class="form-control" required="required" placeholder="如：PR20240101001" />
                                </div>
                            </div>
                            <div class="col-md-4">
                                <div class="form-group">
                                    <label>生产计划 <span class="text-danger">*</span></label>
                                    <select name="planId" class="form-control" required="required">
                                        <option value="">请选择</option>
                                        <option th:each="plan : ${plans}" 
                                                th:value="${plan.id}" 
                                                th:text="${plan.planCode + ' - ' + plan.planName}"
                                                th:selected="${record.productionPlan?.id == plan.id}">
                                        </option>
                                    </select>
                                </div>
                            </div>
                            <div class="col-md-4">
                                <div class="form-group">
                                    <label>工序顺序</label>
                                    <input type="number" th:field="*{processOrder}" class="form-control" value="1" />
                                </div>
                            </div>
                        </div>
                        
                        <div class="row">
                            <div class="col-md-4">
                                <div class="form-group">
                                    <label>工序类型 <span class="text-danger">*</span></label>
                                    <select th:field="*{processType}" class="form-control" required="required">
                                        <option value="">请选择</option>
                                        <option value="CLEANING">清选</option>
                                        <option value="COATING">包衣</option>
                                        <option value="PACKAGING">分装</option>
                                        <option value="INSPECTION">检验</option>
                                    </select>
                                </div>
                            </div>
                            <div class="col-md-4">
                                <div class="form-group">
                                    <label>工序名称 <span class="text-danger">*</span></label>
                                    <input type="text" th:field="*{processName}" class="form-control" required="required" />
                                </div>
                            </div>
                            <div class="col-md-4">
                                <div class="form-group">
                                    <label>加工数量 <span class="text-danger">*</span></label>
                                    <input type="number" th:field="*{quantity}" class="form-control" required="required" step="0.01" />
                                </div>
                            </div>
                        </div>
                        
                        <div class="row">
                            <div class="col-md-4">
                                <div class="form-group">
                                    <label>合格数量</label>
                                    <input type="number" th:field="*{qualifiedQuantity}" class="form-control" step="0.01" />
                                </div>
                            </div>
                            <div class="col-md-4">
                                <div class="form-group">
                                    <label>不合格数量</label>
                                    <input type="number" th:field="*{unqualifiedQuantity}" class="form-control" step="0.01" />
                                </div>
                            </div>
                            <div class="col-md-4">
                                <div class="form-group">
                                    <label>使用设备</label>
                                    <select name="equipmentId" class="form-control">
                                        <option value="">请选择</option>
                                        <option th:each="eq : ${equipments}" 
                                                th:value="${eq.id}" 
                                                th:text="${eq.equipmentCode + ' - ' + eq.equipmentName}"
                                                th:selected="${record.equipment?.id == eq.id}">
                                        </option>
                                    </select>
                                </div>
                            </div>
                        </div>
                        
                        <div class="row">
                            <div class="col-md-4">
                                <div class="form-group">
                                    <label>操作人</label>
                                    <input type="text" th:field="*{operator}" class="form-control" />
                                </div>
                            </div>
                            <div class="col-md-4">
                                <div class="form-group">
                                    <label>状态</label>
                                    <select th:field="*{status}" class="form-control">
                                        <option value="PENDING">待开始</option>
                                        <option value="PROCESSING">进行中</option>
                                        <option value="PAUSED">暂停</option>
                                        <option value="COMPLETED">已完成</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                        
                        <div class="form-group">
                            <label>备注</label>
                            <textarea th:field="*{remarks}" class="form-control" rows="3"></textarea>
                        </div>
                        
                        <div class="form-group">
                            <button type="submit" class="btn btn-primary">
                                <i class="fas fa-save"></i> 保存
                            </button>
                            <a href="/processing" class="btn btn-secondary">
                                <i class="fas fa-arrow-left"></i> 返回
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/jquery@3.6.4/dist/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
