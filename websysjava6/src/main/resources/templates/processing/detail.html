<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/layout :: head('加工详情')">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <a class="navbar-brand" href="/dashboard"><i class="fas fa-industry"></i> 生产管理系统</a>
</nav>
<div class="container-fluid">
    <div class="row">
        <div class="col-md-2 sidebar">
            <ul class="nav flex-column mt-3">
                <li class="nav-item"><a class="nav-link" href="/dashboard"><i class="fas fa-tachometer-alt"></i> 仪表盘</a></li>
                <li class="nav-item"><a class="nav-link" href="/products"><i class="fas fa-box"></i> 产品管理</a></li>
                <li class="nav-item"><a class="nav-link" href="/plans"><i class="fas fa-calendar-alt"></i> 生产计划</a></li>
                <li class="nav-item"><a class="nav-link" href="/plans/schedule"><i class="fas fa-project-diagram"></i> 可视化排产</a></li>
                <li class="nav-item"><a class="nav-link active" href="/processing"><i class="fas fa-cogs"></i> 加工流程</a></li>
                <li class="nav-item"><a class="nav-link" href="/parameters"><i class="fas fa-sliders-h"></i> 工艺参数</a></li>
                <li class="nav-item"><a class="nav-link" href="/equipment"><i class="fas fa-tools"></i> 设备管理</a></li>
                <li class="nav-item"><a class="nav-link" href="/equipment-records"><i class="fas fa-database"></i> 设备数据</a></li>
                <li class="nav-item"><a class="nav-link" href="/test-data"><i class="fas fa-flask"></i> 测试数据</a></li>
            </ul>
        </div>
        <div class="col-md-10 content-wrapper">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2><i class="fas fa-info-circle"></i> 加工详情</h2>
                <a href="/processing" class="btn btn-secondary">
                    <i class="fas fa-arrow-left"></i> 返回列表
                </a>
            </div>
            
            <div class="card mb-4">
                <div class="card-header">
                    <h5 class="card-title mb-0">基本信息</h5>
                </div>
                <div class="card-body">
                    <div class="row">
                        <div class="col-md-3"><strong>记录编号：</strong><span th:text="${record.recordCode}"></span></div>
                        <div class="col-md-3"><strong>工序类型：</strong><span th:text="${record.processType}"></span></div>
                        <div class="col-md-3"><strong>工序名称：</strong><span th:text="${record.processName}"></span></div>
                        <div class="col-md-3"><strong>工序顺序：</strong><span th:text="${record.processOrder}"></span></div>
                    </div>
                    <hr/>
                    <div class="row">
                        <div class="col-md-3"><strong>生产计划：</strong><span th:text="${record.productionPlan?.planCode}"></span></div>
                        <div class="col-md-3"><strong>产品：</strong><span th:text="${record.productionPlan?.product?.productName}"></span></div>
                        <div class="col-md-3"><strong>批次号：</strong><span th:text="${record.productionPlan?.batchNumber}"></span></div>
                        <div class="col-md-3"><strong>使用设备：</strong><span th:text="${record.equipment?.equipmentName ?: '-'}"></span></div>
                    </div>
                    <hr/>
                    <div class="row">
                        <div class="col-md-3"><strong>加工数量：</strong><span th:text="${record.quantity}"></span></div>
                        <div class="col-md-3"><strong>合格数量：</strong><span th:text="${record.qualifiedQuantity ?: 0}"></span></div>
                        <div class="col-md-3"><strong>不合格数量：</strong><span th:text="${record.unqualifiedQuantity ?: 0}"></span></div>
                        <div class="col-md-3"><strong>操作人：</strong><span th:text="${record.operator ?: '-'}"></span></div>
                    </div>
                    <hr/>
                    <div class="row">
                        <div class="col-md-3"><strong>开工时间：</strong><span th:text="${#temporals.format(record.startTime, 'yyyy-MM-dd HH:mm:ss')}"></span></div>
                        <div class="col-md-3"><strong>完工时间：</strong><span th:text="${record.endTime != null ? #temporals.format(record.endTime, 'yyyy-MM-dd HH:mm:ss') : '-'}"></span></div>
                        <div class="col-md-3"><strong>状态：</strong>
                            <span class="badge" 
                                  th:class="${record.status == 'COMPLETED' ? 'badge-success' : (record.status == 'PROCESSING' ? 'badge-primary' : 'badge-secondary')}">
                                <span th:text="${record.status == 'PENDING' ? '待开始' : (record.status == 'PROCESSING' ? '进行中' : (record.status == 'PAUSED' ? '暂停' : '已完成'))}"></span>
                            </span>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="card">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <h5 class="card-title mb-0"><i class="fas fa-sliders-h"></i> 工艺参数</h5>
                    <a th:href="@{/parameters/add(recordId=${record.id})}" class="btn btn-sm btn-primary">
                        <i class="fas fa-plus"></i> 添加参数
                    </a>
                </div>
                <div class="card-body">
                    <table class="table table-striped">
                        <thead class="thead-light">
                            <tr>
                                <th>参数名称</th>
                                <th>参数值</th>
                                <th>标准范围</th>
                                <th>状态</th>
                                <th>记录时间</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:if="${parameters.isEmpty()}">
                                <td colspan="5" class="text-center text-muted">暂无工艺参数</td>
                            </tr>
                            <tr th:each="param : ${parameters}">
                                <td th:text="${param.parameterName}"></td>
                                <td th:text="${param.parameterValue + ' ' + (param.parameterUnit ?: '')}"></td>
                                <td th:text="${(param.lowerLimit != null ? param.lowerLimit : '-') + ' ~ ' + (param.upperLimit != null ? param.upperLimit : '-')}"></td>
                                <td>
                                    <span class="badge" th:class="${param.valueStatus == 'NORMAL'} ? 'badge-success' : 'badge-danger'">
                                        <span th:text="${param.valueStatus == 'NORMAL'} ? '正常' : '异常'}"></span>
                                    </span>
                                </td>
                                <td th:text="${#temporals.format(param.recordTime, 'MM-dd HH:mm:ss')}"></td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/jquery@3.6.4/dist/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
