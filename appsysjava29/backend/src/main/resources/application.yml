server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: appointment-system
  
  datasource:
    url: jdbc:h2:file:./data/hospital;MODE=MySQL;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  
  h2:
    console:
      enabled: true
      path: /h2-console
  
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect
  
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql
      data-locations: classpath:db/data.sql

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

jwt:
  secret: hospitalAppointmentSystemSecretKey2024VeryLongSecret
  expiration: 86400000

appointment:
  lock-minutes: 10
  slot-duration-minutes: 15

encryption:
  sm4-key: 0123456789abcdef0123456789abcdef
  sm2-private-key: 
  sm2-public-key:

logging:
  level:
    com.hospital: DEBUG
    org.hibernate.SQL: DEBUG
  file:
    name: logs/appointment.log
  pattern:
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
