<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>亲本记录管理</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css">
    <style>
        body { background-color: #f8f9fa; }
        .navbar-brand { font-weight: bold; color: #28a745 !important; }
        .sidebar { min-height: calc(100vh - 56px); background-color: #343a40; padding-top: 20px; }
        .sidebar a { color: #ffffff; padding: 10px 15px; display: block; text-decoration: none; }
        .sidebar a:hover, .sidebar a.active { background-color: #28a745; color: #ffffff; }
        .sidebar a i { width: 20px; margin-right: 10px; }
        .content-area { padding: 20px; }
        .card { border: none; box-shadow: 0 0 10px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .card-header { background-color: #ffffff; border-bottom: 2px solid #28a745; font-weight: bold; }
        .btn-primary { background-color: #28a745; border-color: #28a745; }
        .btn-primary:hover { background-color: #218838; border-color: #218838; }
        .table th { background-color: #f8f9fa; }
        .action-btn { margin-right: 5px; }
        .parent-type-male { color: #007bff; }
        .parent-type-female { color: #e83e8c; }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <a class="navbar-brand" href="/"><i class="fa fa-leaf"></i> 育种与田间管理系统</a>
</nav>

<div class="container-fluid">
    <div class="row">
        <div class="col-md-2 sidebar">
            <a href="/"><i class="fa fa-home"></i> 首页</a>
            <a href="/projects"><i class="fa fa-folder-open"></i> 育种项目</a>
            <a href="/parents" class="active"><i class="fa fa-seedling"></i> 亲本记录</a>
            <a href="/combinations"><i class="fa fa-link"></i> 杂交组合</a>
            <a href="/experiments"><i class="fa fa-flask"></i> 田间试验</a>
            <a href="/weather"><i class="fa fa-cloud"></i> 气象数据</a>
            <a href="/soil"><i class="fa fa-map"></i> 土壤数据</a>
            <a href="/analysis"><i class="fa fa-bar-chart"></i> 环境分析</a>
            <a href="/test"><i class="fa fa-cogs"></i> 测试功能</a>
        </div>

        <div class="col-md-10 content-area">
            <div class="card">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <span><i class="fa fa-seedling"></i> 亲本记录管理</span>
                    <a href="/parents/new" class="btn btn-primary btn-sm"><i class="fa fa-plus"></i> 新增亲本</a>
                </div>
                <div class="card-body">
                    <form class="form-inline mb-3" method="get" action="/parents">
                        <div class="form-group mr-2">
                            <input type="text" class="form-control" name="keyword" placeholder="搜索品种名称或编号" th:value="${keyword}">
                        </div>
                        <button type="submit" class="btn btn-primary mr-2"><i class="fa fa-search"></i> 搜索</button>
                        <a href="/parents" class="btn btn-secondary"><i class="fa fa-refresh"></i> 重置</a>
                    </form>

                    <div class="table-responsive">
                        <table class="table table-hover table-striped">
                            <thead>
                                <tr>
                                    <th>亲本编号</th>
                                    <th>品种名称</th>
                                    <th>类型</th>
                                    <th>作物类型</th>
                                    <th>来源地</th>
                                    <th>世代</th>
                                    <th>产量潜力</th>
                                    <th>操作</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="parent : ${parents}">
                                    <td th:text="${parent.parentCode}"></td>
                                    <td th:text="${parent.varietyName}"></td>
                                    <td>
                                        <i class="fa" th:class="${parent.parentType == '父本'} ? 'fa-mars parent-type-male' : 'fa-venus parent-type-female'"></i>
                                        <span th:text="${parent.parentType}"></span>
                                    </td>
                                    <td th:text="${parent.cropType}"></td>
                                    <td th:text="${parent.origin}"></td>
                                    <td th:text="${parent.generation}"></td>
                                    <td th:text="${parent.yieldPotential != null} ? ${parent.yieldPotential} + ' kg/亩' : '-'"></td>
                                    <td>
                                        <a class="btn btn-sm btn-info action-btn" th:href="@{/parents/{id}/edit(id=${parent.id})}">
                                            <i class="fa fa-edit"></i> 编辑
                                        </a>
                                        <button class="btn btn-sm btn-danger" th:onclick="'deleteParent(' + ${parent.id} + ')'">
                                            <i class="fa fa-trash"></i> 删除
                                        </button>
                                    </td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(parents)}">
                                    <td colspan="8" class="text-center">暂无数据</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>

                    <div class="row mt-3">
                        <div class="col-sm-12 col-md-5">
                            <div class="dataTables_info" th:text="'共 ' + ${totalItems} + ' 条记录，第 ' + (${currentPage} + 1) + ' / ' + ${totalPages} + ' 页'"></div>
                        </div>
                        <div class="col-sm-12 col-md-7">
                            <div class="dataTables_paginate paging_simple_numbers">
                                <ul class="pagination justify-content-end">
                                    <li class="paginate_button page-item previous" th:classappend="${currentPage == 0} ? 'disabled' : ''">
                                        <a class="page-link" th:href="@{/parents(keyword=${keyword}, page=0, size=${pageSize})}">首页</a>
                                    </li>
                                    <li class="paginate_button page-item previous" th:classappend="${currentPage == 0} ? 'disabled' : ''">
                                        <a class="page-link" th:href="@{/parents(keyword=${keyword}, page=${currentPage > 0 ? currentPage - 1 : 0}, size=${pageSize})}">上一页</a>
                                    </li>
                                    <li class="paginate_button page-item" th:each="i : ${#numbers.sequence(0, totalPages > 0 ? totalPages - 1 : 0)}" th:classappend="${i == currentPage} ? 'active' : ''">
                                        <a class="page-link" th:href="@{/parents(keyword=${keyword}, page=${i}, size=${pageSize})}" th:text="${i + 1}">1</a>
                                    </li>
                                    <li class="paginate_button page-item next" th:classappend="${currentPage >= totalPages - 1} ? 'disabled' : ''">
                                        <a class="page-link" th:href="@{/parents(keyword=${keyword}, page=${currentPage < totalPages - 1 ? currentPage + 1 : currentPage}, size=${pageSize})}">下一页</a>
                                    </li>
                                    <li class="paginate_button page-item next" th:classappend="${currentPage >= totalPages - 1} ? 'disabled' : ''">
                                        <a class="page-link" th:href="@{/parents(keyword=${keyword}, page=${totalPages > 0 ? totalPages - 1 : 0}, size=${pageSize})}">末页</a>
                                    </li>
                                </ul>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/jquery@3.6.4/dist/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
    function deleteParent(id) {
        if (confirm('确定要删除该亲本记录吗？')) {
            $.ajax({
                url: '/parents/api/' + id,
                type: 'DELETE',
                success: function(result) {
                    if (result.success) {
                        alert('删除成功！');
                        window.location.reload();
                    } else {
                        alert(result.message);
                    }
                },
                error: function() {
                    alert('删除失败，请稍后重试！');
                }
            });
        }
    }
</script>
</body>
</html>
