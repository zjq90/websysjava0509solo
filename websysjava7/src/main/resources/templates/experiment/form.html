<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>田间试验表单</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css">
    <style>
        body { background-color: #f8f9fa; }
        .navbar-brand { font-weight: bold; color: #28a745 !important; }
        .sidebar { min-height: calc(100vh - 56px); background-color: #343a40; padding-top: 20px; }
        .sidebar a { color: #ffffff; padding: 10px 15px; display: block; text-decoration: none; }
        .sidebar a:hover, .sidebar a.active { background-color: #28a745; color: #ffffff; }
        .sidebar a i { width: 20px; margin-right: 10px; }
        .content-area { padding: 20px; }
        .card { border: none; box-shadow: 0 0 10px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .card-header { background-color: #ffffff; border-bottom: 2px solid #28a745; font-weight: bold; }
        .btn-primary { background-color: #28a745; border-color: #28a745; }
        .form-group label { font-weight: 500; }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <a class="navbar-brand" href="/"><i class="fa fa-leaf"></i> 育种与田间管理系统</a>
</nav>
<div class="container-fluid">
    <div class="row">
        <div class="col-md-2 sidebar">
            <a href="/"><i class="fa fa-home"></i> 首页</a>
            <a href="/projects"><i class="fa fa-folder-open"></i> 育种项目</a>
            <a href="/parents"><i class="fa fa-seedling"></i> 亲本记录</a>
            <a href="/combinations"><i class="fa fa-link"></i> 杂交组合</a>
            <a href="/experiments" class="active"><i class="fa fa-flask"></i> 田间试验</a>
            <a href="/weather"><i class="fa fa-cloud"></i> 气象数据</a>
            <a href="/soil"><i class="fa fa-map"></i> 土壤数据</a>
            <a href="/analysis"><i class="fa fa-bar-chart"></i> 环境分析</a>
            <a href="/test"><i class="fa fa-cogs"></i> 测试功能</a>
        </div>
        <div class="col-md-10 content-area">
            <div class="card">
                <div class="card-header" th:text="${experiment.id != null} ? '编辑田间试验' : '新增田间试验'"></div>
                <div class="card-body">
                    <form id="form">
                        <input type="hidden" id="id" th:value="${experiment.id}">
                        <div class="row">
                            <div class="col-md-4"><div class="form-group"><label>试验编号 *</label>
                                <input type="text" class="form-control" id="experimentCode" th:value="${experiment.experimentCode}" required></div></div>
                            <div class="col-md-4"><div class="form-group"><label>试验名称 *</label>
                                <input type="text" class="form-control" id="experimentName" th:value="${experiment.experimentName}" required></div></div>
                            <div class="col-md-4"><div class="form-group"><label>试验地点 *</label>
                                <input type="text" class="form-control" id="location" th:value="${experiment.location}" required></div></div>
                        </div>
                        <div class="row">
                            <div class="col-md-3"><div class="form-group"><label>年份 *</label>
                                <input type="number" class="form-control" id="year" th:value="${experiment.year}" required></div></div>
                            <div class="col-md-3"><div class="form-group"><label>播种日期</label>
                                <input type="date" class="form-control" id="sowingDate" th:value="${experiment.sowingDate}"></div></div>
                            <div class="col-md-3"><div class="form-group"><label>收获日期</label>
                                <input type="date" class="form-control" id="harvestDate" th:value="${experiment.harvestDate}"></div></div>
                            <div class="col-md-3"><div class="form-group"><label>生育期(天)</label>
                                <input type="number" class="form-control" id="growthPeriod" th:value="${experiment.growthPeriod}"></div></div>
                        </div>
                        <div class="row">
                            <div class="col-md-3"><div class="form-group"><label>株高(cm)</label>
                                <input type="number" step="0.01" class="form-control" id="plantHeight" th:value="${experiment.plantHeight}"></div></div>
                            <div class="col-md-3"><div class="form-group"><label>穗长(cm)</label>
                                <input type="number" step="0.01" class="form-control" id="earLength" th:value="${experiment.earLength}"></div></div>
                            <div class="col-md-3"><div class="form-group"><label>千粒重(g)</label>
                                <input type="number" step="0.01" class="form-control" id="thousandGrainWeight" th:value="${experiment.thousandGrainWeight}"></div></div>
                            <div class="col-md-3"><div class="form-group"><label>亩产(kg)</label>
                                <input type="number" step="0.01" class="form-control" id="yieldPerMu" th:value="${experiment.yieldPerMu}"></div></div>
                        </div>
                        <div class="row">
                            <div class="col-md-3"><div class="form-group"><label>白粉病抗性</label>
                                <select class="form-control" id="powderyMildewResistance">
                                    <option value="高抗">高抗</option><option value="抗">抗</option><option value="中抗">中抗</option>
                                    <option value="感">感</option><option value="高感">高感</option>
                                </select></div></div>
                            <div class="col-md-3"><div class="form-group"><label>锈病抗性</label>
                                <select class="form-control" id="rustResistance">
                                    <option value="高抗">高抗</option><option value="抗">抗</option><option value="中抗">中抗</option>
                                    <option value="感">感</option><option value="高感">高感</option>
                                </select></div></div>
                            <div class="col-md-3"><div class="form-group"><label>抗倒性</label>
                                <select class="form-control" id="lodgingResistance">
                                    <option value="强">强</option><option value="中">中</option><option value="弱">弱</option>
                                </select></div></div>
                            <div class="col-md-3"><div class="form-group"><label>状态</label>
                                <select class="form-control" id="status">
                                    <option value="进行中">进行中</option><option value="已完成">已完成</option>
                                </select></div></div>
                        </div>
                        <div class="form-group text-right">
                            <a href="/experiments" class="btn btn-secondary mr-2"><i class="fa fa-arrow-left"></i> 返回</a>
                            <button type="submit" class="btn btn-primary"><i class="fa fa-save"></i> 保存</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/jquery@3.6.4/dist/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
    $('#form').on('submit', function(e) {
        e.preventDefault();
        var id = $('#id').val();
        var data = {
            experimentCode: $('#experimentCode').val(),
            experimentName: $('#experimentName').val(),
            location: $('#location').val(),
            year: parseInt($('#year').val()) || 2024,
            sowingDate: $('#sowingDate').val() || null,
            harvestDate: $('#harvestDate').val() || null,
            growthPeriod: parseInt($('#growthPeriod').val()) || null,
            plantHeight: parseFloat($('#plantHeight').val()) || null,
            earLength: parseFloat($('#earLength').val()) || null,
            thousandGrainWeight: parseFloat($('#thousandGrainWeight').val()) || null,
            yieldPerMu: parseFloat($('#yieldPerMu').val()) || null,
            powderyMildewResistance: $('#powderyMildewResistance').val(),
            rustResistance: $('#rustResistance').val(),
            lodgingResistance: $('#lodgingResistance').val(),
            status: $('#status').val()
        };
        var url = '/experiments/api', method = 'POST';
        if (id) { url = '/experiments/api/' + id; method = 'PUT'; }
        $.ajax({ url, type: method, contentType: 'application/json', data: JSON.stringify(data),
            success: function(r) { if (r.success) { alert('保存成功！'); window.location.href = '/experiments'; } else alert(r.message); }
        });
    });
</script>
</body>
</html>
