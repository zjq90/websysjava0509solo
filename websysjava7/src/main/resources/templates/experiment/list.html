<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>田间试验管理</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css">
    <style>
        body { background-color: #f8f9fa; }
        .navbar-brand { font-weight: bold; color: #28a745 !important; }
        .sidebar { min-height: calc(100vh - 56px); background-color: #343a40; padding-top: 20px; }
        .sidebar a { color: #ffffff; padding: 10px 15px; display: block; text-decoration: none; }
        .sidebar a:hover, .sidebar a.active { background-color: #28a745; color: #ffffff; }
        .sidebar a i { width: 20px; margin-right: 10px; }
        .content-area { padding: 20px; }
        .card { border: none; box-shadow: 0 0 10px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .card-header { background-color: #ffffff; border-bottom: 2px solid #28a745; font-weight: bold; }
        .btn-primary { background-color: #28a745; border-color: #28a745; }
        .table th { background-color: #f8f9fa; }
        .status-active { background-color: #fff3cd; color: #856404; padding: 5px 10px; border-radius: 4px; font-size: 12px; }
        .status-completed { background-color: #d4edda; color: #155724; padding: 5px 10px; border-radius: 4px; font-size: 12px; }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <a class="navbar-brand" href="/"><i class="fa fa-leaf"></i> 育种与田间管理系统</a>
</nav>
<div class="container-fluid">
    <div class="row">
        <div class="col-md-2 sidebar">
            <a href="/"><i class="fa fa-home"></i> 首页</a>
            <a href="/projects"><i class="fa fa-folder-open"></i> 育种项目</a>
            <a href="/parents"><i class="fa fa-seedling"></i> 亲本记录</a>
            <a href="/combinations"><i class="fa fa-link"></i> 杂交组合</a>
            <a href="/experiments" class="active"><i class="fa fa-flask"></i> 田间试验</a>
            <a href="/weather"><i class="fa fa-cloud"></i> 气象数据</a>
            <a href="/soil"><i class="fa fa-map"></i> 土壤数据</a>
            <a href="/analysis"><i class="fa fa-bar-chart"></i> 环境分析</a>
            <a href="/test"><i class="fa fa-cogs"></i> 测试功能</a>
        </div>
        <div class="col-md-10 content-area">
            <div class="card">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <span><i class="fa fa-flask"></i> 田间试验数据管理</span>
                    <a href="/experiments/new" class="btn btn-primary btn-sm"><i class="fa fa-plus"></i> 新增试验</a>
                </div>
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-hover table-striped">
                            <thead>
                                <tr><th>试验编号</th><th>试验名称</th><th>地点</th><th>年份</th><th>株高(cm)</th><th>亩产(kg)</th><th>状态</th><th>操作</th></tr>
                            </thead>
                            <tbody>
                                <tr th:each="e : ${experiments}">
                                    <td th:text="${e.experimentCode}"></td>
                                    <td th:text="${e.experimentName}"></td>
                                    <td th:text="${e.location}"></td>
                                    <td th:text="${e.year}"></td>
                                    <td th:text="${e.plantHeight}"></td>
                                    <td th:text="${e.yieldPerMu}"></td>
                                    <td>
                                        <span th:class="${e.status == '进行中'} ? 'status-active' : 'status-completed'"
                                              th:text="${e.status}"></span>
                                    </td>
                                    <td>
                                        <a class="btn btn-sm btn-info" th:href="@{/experiments/{id}/edit(id=${e.id})}"><i class="fa fa-edit"></i> 编辑</a>
                                        <button class="btn btn-sm btn-danger" th:onclick="'deleteExperiment(' + ${e.id} + ')'"><i class="fa fa-trash"></i> 删除</button>
                                    </td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(experiments)}"><td colspan="8" class="text-center">暂无数据</td></tr>
                            </tbody>
                        </table>
                    </div>

                    <div class="row mt-3">
                        <div class="col-sm-12 col-md-5">
                            <div class="dataTables_info" th:text="'共 ' + ${totalItems} + ' 条记录，第 ' + (${currentPage} + 1) + ' / ' + ${totalPages} + ' 页'"></div>
                        </div>
                        <div class="col-sm-12 col-md-7">
                            <div class="dataTables_paginate paging_simple_numbers">
                                <ul class="pagination justify-content-end">
                                    <li class="paginate_button page-item previous" th:classappend="${currentPage == 0} ? 'disabled' : ''">
                                        <a class="page-link" th:href="@{/experiments(keyword=${keyword}, page=0, size=${pageSize})}">首页</a>
                                    </li>
                                    <li class="paginate_button page-item previous" th:classappend="${currentPage == 0} ? 'disabled' : ''">
                                        <a class="page-link" th:href="@{/experiments(keyword=${keyword}, page=${currentPage > 0 ? currentPage - 1 : 0}, size=${pageSize})}">上一页</a>
                                    </li>
                                    <li class="paginate_button page-item" th:each="i : ${#numbers.sequence(0, totalPages > 0 ? totalPages - 1 : 0)}" th:classappend="${i == currentPage} ? 'active' : ''">
                                        <a class="page-link" th:href="@{/experiments(keyword=${keyword}, page=${i}, size=${pageSize})}" th:text="${i + 1}">1</a>
                                    </li>
                                    <li class="paginate_button page-item next" th:classappend="${currentPage >= totalPages - 1} ? 'disabled' : ''">
                                        <a class="page-link" th:href="@{/experiments(keyword=${keyword}, page=${currentPage < totalPages - 1 ? currentPage + 1 : currentPage}, size=${pageSize})}">下一页</a>
                                    </li>
                                    <li class="paginate_button page-item next" th:classappend="${currentPage >= totalPages - 1} ? 'disabled' : ''">
                                        <a class="page-link" th:href="@{/experiments(keyword=${keyword}, page=${totalPages > 0 ? totalPages - 1 : 0}, size=${pageSize})}">末页</a>
                                    </li>
                                </ul>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/jquery@3.6.4/dist/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
    function deleteExperiment(id) {
        if (confirm('确定删除？')) {
            $.ajax({ url: '/experiments/api/' + id, type: 'DELETE',
                success: function(r) { if (r.success) { alert('删除成功！'); location.reload(); } }
            });
        }
    }
</script>
</body>
</html>
