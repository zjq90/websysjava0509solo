<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>杂交组合表单</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css">
    <style>
        body { background-color: #f8f9fa; }
        .navbar-brand { font-weight: bold; color: #28a745 !important; }
        .sidebar { min-height: calc(100vh - 56px); background-color: #343a40; padding-top: 20px; }
        .sidebar a { color: #ffffff; padding: 10px 15px; display: block; text-decoration: none; }
        .sidebar a:hover, .sidebar a.active { background-color: #28a745; color: #ffffff; }
        .sidebar a i { width: 20px; margin-right: 10px; }
        .content-area { padding: 20px; }
        .card { border: none; box-shadow: 0 0 10px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .card-header { background-color: #ffffff; border-bottom: 2px solid #28a745; font-weight: bold; }
        .btn-primary { background-color: #28a745; border-color: #28a745; }
        .form-group label { font-weight: 500; }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <a class="navbar-brand" href="/"><i class="fa fa-leaf"></i> 育种与田间管理系统</a>
</nav>
<div class="container-fluid">
    <div class="row">
        <div class="col-md-2 sidebar">
            <a href="/"><i class="fa fa-home"></i> 首页</a>
            <a href="/projects"><i class="fa fa-folder-open"></i> 育种项目</a>
            <a href="/parents"><i class="fa fa-seedling"></i> 亲本记录</a>
            <a href="/combinations" class="active"><i class="fa fa-link"></i> 杂交组合</a>
            <a href="/experiments"><i class="fa fa-flask"></i> 田间试验</a>
            <a href="/weather"><i class="fa fa-cloud"></i> 气象数据</a>
            <a href="/soil"><i class="fa fa-map"></i> 土壤数据</a>
            <a href="/analysis"><i class="fa fa-bar-chart"></i> 环境分析</a>
            <a href="/test"><i class="fa fa-cogs"></i> 测试功能</a>
        </div>
        <div class="col-md-10 content-area">
            <div class="card">
                <div class="card-header" th:text="${combination.id != null} ? '编辑杂交组合' : '新增杂交组合'"></div>
                <div class="card-body">
                    <form id="form">
                        <input type="hidden" id="id" th:value="${combination.id}">
                        <div class="row">
                            <div class="col-md-4"><div class="form-group">
                                <label>组合编号 *</label>
                                <input type="text" class="form-control" id="combinationCode" th:value="${combination.combinationCode}" required>
                            </div></div>
                            <div class="col-md-4"><div class="form-group">
                                <label>组合名称 *</label>
                                <input type="text" class="form-control" id="combinationName" th:value="${combination.combinationName}" required>
                            </div></div>
                            <div class="col-md-4"><div class="form-group">
                                <label>杂交日期 *</label>
                                <input type="date" class="form-control" id="crossDate" th:value="${combination.crossDate}" required>
                            </div></div>
                        </div>
                        <div class="row">
                            <div class="col-md-4"><div class="form-group">
                                <label>杂交方式</label>
                                <input type="text" class="form-control" id="crossMethod" th:value="${combination.crossMethod}">
                            </div></div>
                            <div class="col-md-4"><div class="form-group">
                                <label>杂交地点</label>
                                <input type="text" class="form-control" id="crossLocation" th:value="${combination.crossLocation}">
                            </div></div>
                            <div class="col-md-4"><div class="form-group">
                                <label>世代</label>
                                <input type="text" class="form-control" id="generation" th:value="${combination.generation}">
                            </div></div>
                        </div>
                        <div class="row">
                            <div class="col-md-4"><div class="form-group">
                                <label>种子数</label>
                                <input type="number" class="form-control" id="seedCount" th:value="${combination.seedCount}">
                            </div></div>
                            <div class="col-md-4"><div class="form-group">
                                <label>结实率(%)</label>
                                <input type="number" step="0.01" class="form-control" id="seedSetRate" th:value="${combination.seedSetRate}">
                            </div></div>
                            <div class="col-md-4"><div class="form-group">
                                <label>状态 *</label>
                                <select class="form-control" id="status" required>
                                    <option value="进行中" th:selected="${combination.status == '进行中'}">进行中</option>
                                    <option value="已完成" th:selected="${combination.status == '已完成'}">已完成</option>
                                    <option value="已淘汰" th:selected="${combination.status == '已淘汰'}">已淘汰</option>
                                </select>
                            </div></div>
                        </div>
                        <div class="form-group text-right">
                            <a href="/combinations" class="btn btn-secondary mr-2"><i class="fa fa-arrow-left"></i> 返回</a>
                            <button type="submit" class="btn btn-primary"><i class="fa fa-save"></i> 保存</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/jquery@3.6.4/dist/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
    $('#form').on('submit', function(e) {
        e.preventDefault();
        var id = $('#id').val();
        var data = {
            combinationCode: $('#combinationCode').val(),
            combinationName: $('#combinationName').val(),
            crossDate: $('#crossDate').val(),
            crossMethod: $('#crossMethod').val(),
            crossLocation: $('#crossLocation').val(),
            generation: $('#generation').val(),
            seedCount: parseInt($('#seedCount').val()) || null,
            seedSetRate: parseFloat($('#seedSetRate').val()) || null,
            status: $('#status').val(),
            crossPurpose: '',
            flowerCount: null,
            offspringTraits: '',
            evaluation: '',
            remarks: ''
        };
        var url = '/combinations/api', method = 'POST';
        if (id) { url = '/combinations/api/' + id; method = 'PUT'; }
        $.ajax({ url, type: method, contentType: 'application/json', data: JSON.stringify(data),
            success: function(r) { if (r.success) { alert('保存成功！'); window.location.href = '/combinations'; } else alert(r.message); },
            error: function() { alert('保存失败！'); }
        });
    });
</script>
</body>
</html>
