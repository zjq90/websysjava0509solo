<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <div th:replace="fragments/layout :: head('新建销售')"></div>
</head>
<body>
<div th:replace="fragments/layout :: sidebar('sales')"></div>

<div class="main-content">
    <div class="navbar-top d-flex justify-content-between align-items-center">
        <h4 class="mb-0"><i class="fa fa-shopping-cart"></i> 新建销售</h4>
        <a th:href="@{/sales}" class="btn btn-secondary">
            <i class="fa fa-arrow-left"></i> 返回列表
        </a>
    </div>

    <div class="card">
        <div class="card-body">
            <form th:action="@{/sales/save}" method="post" id="saleForm">
                <div class="row">
                    <div class="col-md-6">
                        <div class="form-group">
                            <label>客户</label>
                            <select class="form-control" name="customerId">
                                <option value="">零售客户</option>
                                <option th:each="c : ${customers}" th:value="${c.id}" th:text="${c.customerName}">客户</option>
                            </select>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="form-group">
                            <label>备注</label>
                            <input type="text" class="form-control" name="remark">
                        </div>
                    </div>
                </div>

                <hr>

                <h5 class="mb-3">销售明细</h5>
                <div id="saleItems">
                    <div class="sale-item row mb-3 p-3 bg-light rounded" data-index="0">
                        <div class="col-md-4">
                            <label>产品 <span class="text-danger">*</span></label>
                            <select class="form-control product-select" name="productIds">
                                <option value="">请选择产品</option>
                                <option th:each="p : ${products}" th:value="${p.id}"
                                        th:text="${p.productName} + ' (库存: ' + ${p.inventory != null ? p.inventory.quantity : 0} + ')"
                                        th:data-price="${p.salePrice}">产品</option>
                            </select>
                        </div>
                        <div class="col-md-2">
                            <label>数量 <span class="text-danger">*</span></label>
                            <input type="number" class="form-control quantity-input" name="quantities" value="1" min="1">
                        </div>
                        <div class="col-md-2">
                            <label>单价</label>
                            <input type="number" step="0.01" class="form-control price-input" readonly>
                        </div>
                        <div class="col-md-2">
                            <label>金额</label>
                            <input type="text" class="form-control amount-input" readonly>
                        </div>
                        <div class="col-md-2 align-self-end">
                            <button type="button" class="btn btn-danger btn-block remove-item">
                                <i class="fa fa-trash"></i>
                            </button>
                        </div>
                    </div>
                </div>

                <div class="form-group mt-3">
                    <button type="button" class="btn btn-success" id="addItemBtn">
                        <i class="fa fa-plus"></i> 添加产品
                    </button>
                </div>

                <hr>

                <div class="form-group">
                    <button type="submit" class="btn btn-primary mr-2">
                        <i class="fa fa-save"></i> 保存销售单
                    </button>
                    <a th:href="@{/sales}" class="btn btn-secondary">
                        <i class="fa fa-times"></i> 取消
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>

<div th:replace="fragments/layout :: scripts"></div>
<script>
$(function() {
    function updateAmount($item) {
        var quantity = parseInt($item.find('.quantity-input').val()) || 0;
        var price = parseFloat($item.find('.price-input').val()) || 0;
        var amount = (quantity * price).toFixed(2);
        $item.find('.amount-input').val('¥' + amount);
    }

    $(document).on('change', '.product-select', function() {
        var $option = $(this).find('option:selected');
        var price = $option.data('price');
        $(this).closest('.sale-item').find('.price-input').val(price);
        updateAmount($(this).closest('.sale-item'));
    });

    $(document).on('input', '.quantity-input', function() {
        updateAmount($(this).closest('.sale-item'));
    });

    $('#addItemBtn').click(function() {
        var index = $('.sale-item').length;
        var $template = $('.sale-item:first').clone();
        $template.attr('data-index', index);
        $template.find('.product-select').val('');
        $template.find('.quantity-input').val(1);
        $template.find('.price-input').val('');
        $template.find('.amount-input').val('');
        $('#saleItems').append($template);
    });

    $(document).on('click', '.remove-item', function() {
        if ($('.sale-item').length > 1) {
            $(this).closest('.sale-item').remove();
        } else {
            alert('至少需要一条销售明细');
        }
    });
});
</script>
</body>
</html>
