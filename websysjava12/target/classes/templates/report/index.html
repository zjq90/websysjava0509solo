<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <div th:replace="fragments/layout :: head('数据统计')"></div>
</head>
<body>
<div th:replace="fragments/layout :: sidebar('reports')"></div>

<div class="main-content">
    <div class="navbar-top">
        <h4 class="mb-0"><i class="fa fa-bar-chart"></i> 数据统计</h4>
    </div>

    <div class="row">
        <div class="col-md-6 mb-4">
            <div class="card h-100">
                <div class="card-body text-center">
                    <i class="fa fa-line-chart fa-4x text-primary mb-3"></i>
                    <h5>销售报表</h5>
                    <p class="text-muted">查看指定时间段内的销售统计数据，包括销售总额、利润、订单数量等</p>
                    <a th:href="@{/reports/sales}" class="btn btn-primary">
                        <i class="fa fa-arrow-right"></i> 查看报表
                    </a>
                </div>
            </div>
        </div>
        <div class="col-md-6 mb-4">
            <div class="card h-100">
                <div class="card-body text-center">
                    <i class="fa fa-refresh fa-4x text-success mb-3"></i>
                    <h5>库存周转率</h5>
                    <p class="text-muted">分析每个产品的库存周转情况，计算周转率和周转天数</p>
                    <a th:href="@{/reports/inventory-turnover}" class="btn btn-success">
                        <i class="fa fa-arrow-right"></i> 查看分析
                    </a>
                </div>
            </div>
        </div>
        <div class="col-md-6 mb-4">
            <div class="card h-100">
                <div class="card-body text-center">
                    <i class="fa fa-money fa-4x text-warning mb-3"></i>
                    <h5>毛利率分析</h5>
                    <p class="text-muted">分析每个产品的销售毛利率，帮助优化产品结构</p>
                    <a th:href="@{/reports/gross-margin}" class="btn btn-warning text-white">
                        <i class="fa fa-arrow-right"></i> 查看分析
                    </a>
                </div>
            </div>
        </div>
        <div class="col-md-6 mb-4">
            <div class="card h-100">
                <div class="card-body text-center">
                    <i class="fa fa-line-chart fa-4x text-info mb-3"></i>
                    <h5>市场需求预测</h5>
                    <p class="text-muted">基于历史销售数据预测未来需求，辅助制定采购与生产计划</p>
                    <a th:href="@{/reports/demand-forecast}" class="btn btn-info">
                        <i class="fa fa-arrow-right"></i> 查看预测
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="fragments/layout :: scripts"></div>
</body>
</html>
