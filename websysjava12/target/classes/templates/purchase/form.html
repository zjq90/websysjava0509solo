<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <div th:replace="fragments/layout :: head(${purchase.id == null ? '新建采购' : '编辑采购'})"></div>
</head>
<body>
<div th:replace="fragments/layout :: sidebar('purchases')"></div>

<div class="main-content">
    <div class="navbar-top d-flex justify-content-between align-items-center">
        <h4 class="mb-0"><i class="fa fa-truck"></i> <span th:text="${purchase.id == null ? '新建采购' : '编辑采购'}">新建采购</span></h4>
        <a th:href="@{/purchases}" class="btn btn-secondary">
            <i class="fa fa-arrow-left"></i> 返回列表
        </a>
    </div>

    <div class="card">
        <div class="card-body">
            <form th:action="@{/purchases/save}" method="post" th:object="${purchase}">
                <input type="hidden" th:field="*{id}" />

                <div class="row">
                    <div class="col-md-6">
                        <div class="form-group">
                            <label>产品 <span class="text-danger">*</span></label>
                            <select class="form-control" name="productId" required>
                                <option value="">请选择产品</option>
                                <option th:each="p : ${products}" th:value="${p.id}"
                                        th:text="${p.productName}"
                                        th:data-price="${p.costPrice}">产品</option>
                            </select>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="form-group">
                            <label>供应商</label>
                            <select class="form-control" name="supplierId">
                                <option value="">请选择供应商</option>
                                <option th:each="s : ${suppliers}" th:value="${s.id}" th:text="${s.supplierName}">供应商</option>
                            </select>
                        </div>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-4">
                        <div class="form-group">
                            <label>数量 <span class="text-danger">*</span></label>
                            <input type="number" class="form-control" th:field="*{quantity}" required min="1">
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="form-group">
                            <label>单价 <span class="text-danger">*</span></label>
                            <input type="number" step="0.01" class="form-control" th:field="*{unitPrice}" required>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="form-group">
                            <label>状态</label>
                            <select class="form-control" th:field="*{status}">
                                <option value="已入库">已入库</option>
                                <option value="待入库">待入库</option>
                            </select>
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label>备注</label>
                    <textarea class="form-control" rows="2" th:field="*{remark}"></textarea>
                </div>

                <div class="form-group">
                    <button type="submit" class="btn btn-primary mr-2">
                        <i class="fa fa-save"></i> 保存
                    </button>
                    <a th:href="@{/purchases}" class="btn btn-secondary">
                        <i class="fa fa-times"></i> 取消
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>

<div th:replace="fragments/layout :: scripts"></div>
</body>
</html>
