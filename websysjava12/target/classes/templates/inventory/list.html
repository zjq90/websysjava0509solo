<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <div th:replace="fragments/layout :: head('库存管理')"></div>
</head>
<body>
<div th:replace="fragments/layout :: sidebar('inventory')"></div>

<div class="main-content">
    <div class="navbar-top d-flex justify-content-between align-items-center">
        <h4 class="mb-0"><i class="fa fa-archive"></i> 库存管理</h4>
        <a th:href="@{/inventory/low-stock}" class="btn btn-warning">
            <i class="fa fa-exclamation-triangle"></i> 查看预警
        </a>
    </div>

    <div th:if="${message}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${message}"></span>
        <button type="button" class="close" data-dismiss="alert">
            <span>&times;</span>
        </button>
    </div>

    <div class="row mb-4">
        <div class="col-md-4">
            <div class="card stat-card p-4">
                <div class="d-flex justify-content-between align-items-center">
                    <div>
                        <h6 class="text-white-50 mb-1">库存总价值</h6>
                        <h3 class="mb-0">¥<span th:text="${#numbers.formatDecimal(totalValue, 1, 2)}">0.00</span></h3>
                    </div>
                    <i class="fa fa-money fa-3x text-white-50"></i>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card stat-card blue p-4">
                <div class="d-flex justify-content-between align-items-center">
                    <div>
                        <h6 class="text-white-50 mb-1">产品种类</h6>
                        <h3 class="mb-0"><span th:text="${#lists.size(inventoryList)}">0</span></h3>
                    </div>
                    <i class="fa fa-cubes fa-3x text-white-50"></i>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card stat-card green p-4">
                <div class="d-flex justify-content-between align-items-center">
                    <div>
                        <h6 class="text-white-50 mb-1">库存总量</h6>
                        <h3 class="mb-0"><span th:text="${inventoryList.![quantity].sum()}">0</span></h3>
                    </div>
                    <i class="fa fa-boxes fa-3x text-white-50"></i>
                </div>
            </div>
        </div>
    </div>

    <div class="card">
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-hover table-bordered">
                    <thead class="thead-light">
                        <tr>
                            <th>ID</th>
                            <th>产品名称</th>
                            <th>分类</th>
                            <th>当前库存</th>
                            <th>最低库存</th>
                            <th>平均成本价</th>
                            <th>库存价值</th>
                            <th>状态</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="inv : ${inventoryList}">
                            <td th:text="${inv.id}">1</td>
                            <td th:text="${inv.product.productName}">产品名称</td>
                            <td th:text="${inv.product.category}">分类</td>
                            <td th:text="${inv.quantity}">0</td>
                            <td th:text="${inv.minStock}">10</td>
                            <td>¥<span th:text="${#numbers.formatDecimal(inv.avgCostPrice, 1, 2)}">0.00</span></td>
                            <td>¥<span th:text="${#numbers.formatDecimal(inv.totalValue, 1, 2)}">0.00</span></td>
                            <td>
                                <span th:class="${inv.quantity <= inv.minStock} ? 'badge badge-danger' : 'badge badge-success'">
                                    <span th:text="${inv.quantity <= inv.minStock} ? '库存不足' : '正常'">正常</span>
                                </span>
                            </td>
                            <td>
                                <a th:href="@{/inventory/edit/{id}(id=${inv.id})}" class="btn btn-sm btn-info">
                                    <i class="fa fa-edit"></i> 调整
                                </a>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(inventoryList)}">
                            <td colspan="9" class="text-center">暂无数据</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<div th:replace="fragments/layout :: scripts"></div>
</body>
</html>
