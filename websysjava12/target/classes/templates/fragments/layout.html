<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title} + ' - Web平台管理系统'">Web平台管理系统</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css">
    <style>
        body {
            background-color: #f8f9fa;
            min-height: 100vh;
        }
        .sidebar {
            min-height: 100vh;
            background-color: #343a40;
            position: fixed;
            left: 0;
            top: 0;
            width: 250px;
            z-index: 1000;
        }
        .sidebar .logo {
            padding: 1.5rem 1rem;
            border-bottom: 1px solid #495057;
        }
        .sidebar .logo h4 {
            color: #fff;
            margin: 0;
        }
        .sidebar .nav-link {
            color: #adb5bd;
            padding: 0.75rem 1.5rem;
            border-left: 3px solid transparent;
        }
        .sidebar .nav-link:hover,
        .sidebar .nav-link.active {
            color: #fff;
            background-color: #495057;
            border-left-color: #007bff;
        }
        .sidebar .nav-link i {
            margin-right: 10px;
        }
        .main-content {
            margin-left: 250px;
            padding: 1.5rem;
        }
        .navbar-top {
            background-color: #fff;
            padding: 0.75rem 1.5rem;
            margin: -1.5rem -1.5rem 1.5rem -1.5rem;
            border-bottom: 1px solid #dee2e6;
        }
        .card {
            border: none;
            box-shadow: 0 0.125rem 0.25rem rgba(0, 0, 0, 0.075);
        }
        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
        }
        .stat-card.blue {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
        }
        .stat-card.green {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
        }
        .stat-card.orange {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }
        .table-responsive {
            background: #fff;
            border-radius: 0.25rem;
        }
        .badge {
            padding: 0.5rem 0.75rem;
        }
    </style>
</head>
<body>
<div th:fragment="sidebar(activeMenu)">
    <div class="sidebar">
        <div class="logo">
            <h4><i class="fa fa-dashboard"></i> 管理系统</h4>
        </div>
        <nav class="nav flex-column">
            <a class="nav-link" th:classappend="${activeMenu == 'home'} ? 'active' : ''" th:href="@{/}">
                <i class="fa fa-home"></i> 首页
            </a>
            <a class="nav-link" th:classappend="${activeMenu == 'products'} ? 'active' : ''" th:href="@{/products}">
                <i class="fa fa-cubes"></i> 产品管理
            </a>
            <a class="nav-link" th:classappend="${activeMenu == 'inventory'} ? 'active' : ''" th:href="@{/inventory}">
                <i class="fa fa-archive"></i> 库存管理
            </a>
            <a class="nav-link" th:classappend="${activeMenu == 'sales'} ? 'active' : ''" th:href="@{/sales}">
                <i class="fa fa-shopping-cart"></i> 销售管理
            </a>
            <a class="nav-link" th:classappend="${activeMenu == 'purchases'} ? 'active' : ''" th:href="@{/purchases}">
                <i class="fa fa-truck"></i> 采购管理
            </a>
            <a class="nav-link" th:classappend="${activeMenu == 'suppliers'} ? 'active' : ''" th:href="@{/suppliers}">
                <i class="fa fa-user-circle"></i> 供应商管理
            </a>
            <a class="nav-link" th:classappend="${activeMenu == 'customers'} ? 'active' : ''" th:href="@{/customers}">
                <i class="fa fa-users"></i> 客户管理
            </a>
            <a class="nav-link" th:classappend="${activeMenu == 'reports'} ? 'active' : ''" th:href="@{/reports}">
                <i class="fa fa-bar-chart"></i> 数据统计
            </a>
            <a class="nav-link" th:classappend="${activeMenu == 'test-data'} ? 'active' : ''" th:href="@{/test-data}">
                <i class="fa fa-database"></i> 测试数据
            </a>
        </nav>
    </div>
</div>

<div th:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.6.4/dist/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        $(function() {
            $('.datepicker').attr('type', 'date');
        });
    </script>
</div>
</body>
</html>
