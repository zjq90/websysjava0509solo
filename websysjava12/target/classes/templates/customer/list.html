<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <div th:replace="fragments/layout :: head('客户管理')"></div>
</head>
<body>
<div th:replace="fragments/layout :: sidebar('customers')"></div>

<div class="main-content">
    <div class="navbar-top d-flex justify-content-between align-items-center">
        <h4 class="mb-0"><i class="fa fa-users"></i> 客户管理</h4>
        <a th:href="@{/customers/add}" class="btn btn-primary">
            <i class="fa fa-plus"></i> 添加客户
        </a>
    </div>

    <div th:if="${message}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${message}"></span>
        <button type="button" class="close" data-dismiss="alert">
            <span>&times;</span>
        </button>
    </div>

    <div class="card">
        <div class="card-header">
            <form class="form-inline" th:action="@{/customers}" method="get">
                <div class="form-group mr-2">
                    <input type="text" class="form-control" name="keyword" placeholder="搜索客户名称" th:value="${keyword}">
                </div>
                <button type="submit" class="btn btn-primary mr-2">
                    <i class="fa fa-search"></i> 搜索
                </button>
                <a th:href="@{/customers}" class="btn btn-secondary">
                    <i class="fa fa-refresh"></i> 重置
                </a>
            </form>
        </div>
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-hover table-bordered">
                    <thead class="thead-light">
                        <tr>
                            <th>ID</th>
                            <th>客户名称</th>
                            <th>联系人</th>
                            <th>电话</th>
                            <th>级别</th>
                            <th>地址</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="c : ${customers}">
                            <td th:text="${c.id}">1</td>
                            <td th:text="${c.customerName}">客户</td>
                            <td th:text="${c.contact}">联系人</td>
                            <td th:text="${c.phone}">电话</td>
                            <td>
                                <span th:class="${c.level == 'SVIP客户'} ? 'badge badge-danger' : 
                                    (c.level == 'VIP客户' ? 'badge badge-warning' : 'badge badge-secondary')"
                                      th:text="${c.level}">普通客户</span>
                            </td>
                            <td th:text="${c.address}">地址</td>
                            <td>
                                <a th:href="@{/customers/edit/{id}(id=${c.id})}" class="btn btn-sm btn-info">
                                    <i class="fa fa-edit"></i> 编辑
                                </a>
                                <a th:href="@{/customers/delete/{id}(id=${c.id})}" class="btn btn-sm btn-danger"
                                   onclick="return confirm('确定要删除该客户吗？')">
                                    <i class="fa fa-trash"></i> 删除
                                </a>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(customers)}">
                            <td colspan="7" class="text-center">暂无数据</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<div th:replace="fragments/layout :: scripts"></div>
</body>
</html>
