<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <div th:replace="fragments/layout :: head(${customer.id == null ? '添加客户' : '编辑客户'})"></div>
</head>
<body>
<div th:replace="fragments/layout :: sidebar('customers')"></div>

<div class="main-content">
    <div class="navbar-top d-flex justify-content-between align-items-center">
        <h4 class="mb-0"><i class="fa fa-users"></i> <span th:text="${customer.id == null ? '添加客户' : '编辑客户'}">添加客户</span></h4>
        <a th:href="@{/customers}" class="btn btn-secondary">
            <i class="fa fa-arrow-left"></i> 返回列表
        </a>
    </div>

    <div class="card">
        <div class="card-body">
            <form th:action="@{/customers/save}" method="post" th:object="${customer}">
                <input type="hidden" th:field="*{id}" />

                <div class="row">
                    <div class="col-md-6">
                        <div class="form-group">
                            <label>客户名称 <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" th:field="*{customerName}" required>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="form-group">
                            <label>联系人</label>
                            <input type="text" class="form-control" th:field="*{contact}">
                        </div>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6">
                        <div class="form-group">
                            <label>电话</label>
                            <input type="text" class="form-control" th:field="*{phone}">
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="form-group">
                            <label>客户级别</label>
                            <select class="form-control" th:field="*{level}">
                                <option value="普通客户">普通客户</option>
                                <option value="VIP客户">VIP客户</option>
                                <option value="SVIP客户">SVIP客户</option>
                            </select>
                        </div>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6">
                        <div class="form-group">
                            <label>地址</label>
                            <input type="text" class="form-control" th:field="*{address}">
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="form-group">
                            <label>邮箱</label>
                            <input type="email" class="form-control" th:field="*{email}">
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label>备注</label>
                    <textarea class="form-control" rows="2" th:field="*{remark}"></textarea>
                </div>

                <div class="form-group">
                    <button type="submit" class="btn btn-primary mr-2">
                        <i class="fa fa-save"></i> 保存
                    </button>
                    <a th:href="@{/customers}" class="btn btn-secondary">
                        <i class="fa fa-times"></i> 取消
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>

<div th:replace="fragments/layout :: scripts"></div>
</body>
</html>
