<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <div th:replace="fragments/layout :: head('首页')"></div>
</head>
<body>
<div th:replace="fragments/layout :: sidebar('home')"></div>

<div class="main-content">
    <div class="navbar-top">
        <h4 class="mb-0"><i class="fa fa-dashboard"></i> 系统概览</h4>
    </div>

    <div th:if="${message}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${message}"></span>
        <button type="button" class="close" data-dismiss="alert">
            <span>&times;</span>
        </button>
    </div>

    <div class="row mb-4">
        <div class="col-md-3 mb-3">
            <div class="card stat-card p-4">
                <div class="d-flex justify-content-between align-items-center">
                    <div>
                        <h6 class="text-white-50 mb-1">今日销售额</h6>
                        <h3 class="mb-0">¥<span th:text="${#numbers.formatDecimal(todaySales, 1, 2)}">0.00</span></h3>
                    </div>
                    <i class="fa fa-money fa-3x text-white-50"></i>
                </div>
            </div>
        </div>
        <div class="col-md-3 mb-3">
            <div class="card stat-card blue p-4">
                <div class="d-flex justify-content-between align-items-center">
                    <div>
                        <h6 class="text-white-50 mb-1">本月销售额</h6>
                        <h3 class="mb-0">¥<span th:text="${#numbers.formatDecimal(monthSales, 1, 2)}">0.00</span></h3>
                    </div>
                    <i class="fa fa-calendar fa-3x text-white-50"></i>
                </div>
            </div>
        </div>
        <div class="col-md-3 mb-3">
            <div class="card stat-card green p-4">
                <div class="d-flex justify-content-between align-items-center">
                    <div>
                        <h6 class="text-white-50 mb-1">本年销售额</h6>
                        <h3 class="mb-0">¥<span th:text="${#numbers.formatDecimal(yearSales, 1, 2)}">0.00</span></h3>
                    </div>
                    <i class="fa fa-line-chart fa-3x text-white-50"></i>
                </div>
            </div>
        </div>
        <div class="col-md-3 mb-3">
            <div class="card stat-card orange p-4">
                <div class="d-flex justify-content-between align-items-center">
                    <div>
                        <h6 class="text-white-50 mb-1">库存总价值</h6>
                        <h3 class="mb-0">¥<span th:text="${#numbers.formatDecimal(totalInventoryValue, 1, 2)}">0.00</span></h3>
                    </div>
                    <i class="fa fa-archive fa-3x text-white-50"></i>
                </div>
            </div>
        </div>
    </div>

    <div class="row">
        <div class="col-md-6">
            <div class="card">
                <div class="card-header">
                    <h5 class="mb-0">利润统计</h5>
                </div>
                <div class="card-body">
                    <div class="row text-center">
                        <div class="col-6">
                            <h6 class="text-muted">今日利润</h6>
                            <h3 class="text-success">¥<span th:text="${#numbers.formatDecimal(todayProfit, 1, 2)}">0.00</span></h3>
                        </div>
                        <div class="col-6">
                            <h6 class="text-muted">本月利润</h6>
                            <h3 class="text-success">¥<span th:text="${#numbers.formatDecimal(monthProfit, 1, 2)}">0.00</span></h3>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-md-6">
            <div class="card">
                <div class="card-header">
                    <h5 class="mb-0">库存预警</h5>
                </div>
                <div class="card-body">
                    <div class="row text-center">
                        <div class="col-6">
                            <h6 class="text-muted">产品总数</h6>
                            <h3 class="text-primary"><span th:text="${productCount}">0</span></h3>
                        </div>
                        <div class="col-6">
                            <h6 class="text-muted">库存预警</h6>
                            <h3 th:class="${lowStockCount > 0} ? 'text-danger' : 'text-success'"><span th:text="${lowStockCount}">0</span></h3>
                        </div>
                    </div>
                    <div class="mt-3" th:if="${lowStockCount > 0}">
                        <a th:href="@{/inventory/low-stock}" class="btn btn-danger btn-block">
                            <i class="fa fa-exclamation-triangle"></i> 查看预警商品
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="row mt-4">
        <div class="col-md-12">
            <div class="card">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <h5 class="mb-0">快捷操作</h5>
                </div>
                <div class="card-body">
                    <div class="row">
                        <div class="col-md-2 mb-3">
                            <a th:href="@{/products/add}" class="btn btn-primary btn-block">
                                <i class="fa fa-plus"></i><br>添加产品
                            </a>
                        </div>
                        <div class="col-md-2 mb-3">
                            <a th:href="@{/sales/add}" class="btn btn-success btn-block">
                                <i class="fa fa-shopping-cart"></i><br>新建销售
                            </a>
                        </div>
                        <div class="col-md-2 mb-3">
                            <a th:href="@{/purchases/add}" class="btn btn-info btn-block">
                                <i class="fa fa-truck"></i><br>新建采购
                            </a>
                        </div>
                        <div class="col-md-2 mb-3">
                            <a th:href="@{/reports/sales}" class="btn btn-warning btn-block">
                                <i class="fa fa-bar-chart"></i><br>销售报表
                            </a>
                        </div>
                        <div class="col-md-2 mb-3">
                            <a th:href="@{/reports/demand-forecast}" class="btn btn-purple btn-block" style="background: #6f42c1; color: white;">
                                <i class="fa fa-line-chart"></i><br>需求预测
                            </a>
                        </div>
                        <div class="col-md-2 mb-3">
                            <a th:href="@{/test-data}" class="btn btn-secondary btn-block">
                                <i class="fa fa-database"></i><br>测试数据
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="fragments/layout :: scripts"></div>
</body>
</html>
