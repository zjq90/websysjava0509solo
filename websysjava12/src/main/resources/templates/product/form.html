<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <div th:replace="fragments/layout :: head(${product.id == null ? '添加产品' : '编辑产品'})"></div>
</head>
<body>
<div th:replace="fragments/layout :: sidebar('products')"></div>

<div class="main-content">
    <div class="navbar-top d-flex justify-content-between align-items-center">
        <h4 class="mb-0"><i class="fa fa-cubes"></i> <span th:text="${product.id == null ? '添加产品' : '编辑产品'}">添加产品</span></h4>
        <a th:href="@{/products}" class="btn btn-secondary">
            <i class="fa fa-arrow-left"></i> 返回列表
        </a>
    </div>

    <div class="card">
        <div class="card-body">
            <form th:action="@{/products/save}" method="post" th:object="${product}">
                <input type="hidden" th:field="*{id}" />

                <div class="row">
                    <div class="col-md-6">
                        <div class="form-group">
                            <label>产品名称 <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" th:field="*{productName}" required>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="form-group">
                            <label>分类</label>
                            <select class="form-control" th:field="*{category}">
                                <option value="">请选择分类</option>
                                <option value="电子产品">电子产品</option>
                                <option value="日用百货">日用百货</option>
                                <option value="食品饮料">食品饮料</option>
                                <option value="服装鞋帽">服装鞋帽</option>
                                <option value="办公用品">办公用品</option>
                            </select>
                        </div>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6">
                        <div class="form-group">
                            <label>成本价 <span class="text-danger">*</span></label>
                            <input type="number" step="0.01" class="form-control" th:field="*{costPrice}" required>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="form-group">
                            <label>售价 <span class="text-danger">*</span></label>
                            <input type="number" step="0.01" class="form-control" th:field="*{salePrice}" required>
                        </div>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6">
                        <div class="form-group">
                            <label>单位</label>
                            <input type="text" class="form-control" th:field="*{unit}" placeholder="件、个、箱等">
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="form-group">
                            <label>条码</label>
                            <input type="text" class="form-control" th:field="*{barCode}">
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label>描述</label>
                    <textarea class="form-control" rows="3" th:field="*{description}"></textarea>
                </div>

                <div class="form-group">
                    <button type="submit" class="btn btn-primary mr-2">
                        <i class="fa fa-save"></i> 保存
                    </button>
                    <a th:href="@{/products}" class="btn btn-secondary">
                        <i class="fa fa-times"></i> 取消
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>

<div th:replace="fragments/layout :: scripts"></div>
</body>
</html>
