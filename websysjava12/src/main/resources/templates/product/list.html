<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <div th:replace="fragments/layout :: head('产品管理')"></div>
</head>
<body>
<div th:replace="fragments/layout :: sidebar('products')"></div>

<div class="main-content">
    <div class="navbar-top d-flex justify-content-between align-items-center">
        <h4 class="mb-0"><i class="fa fa-cubes"></i> 产品管理</h4>
        <a th:href="@{/products/add}" class="btn btn-primary">
            <i class="fa fa-plus"></i> 添加产品
        </a>
    </div>

    <div th:if="${message}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${message}"></span>
        <button type="button" class="close" data-dismiss="alert">
            <span>&times;</span>
        </button>
    </div>

    <div class="card">
        <div class="card-header">
            <form class="form-inline" th:action="@{/products}" method="get">
                <div class="form-group mr-2">
                    <input type="text" class="form-control" name="keyword" placeholder="搜索产品名称" th:value="${keyword}">
                </div>
                <button type="submit" class="btn btn-primary mr-2">
                    <i class="fa fa-search"></i> 搜索
                </button>
                <a th:href="@{/products}" class="btn btn-secondary">
                    <i class="fa fa-refresh"></i> 重置
                </a>
            </form>
        </div>
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-hover table-bordered">
                    <thead class="thead-light">
                        <tr>
                            <th>ID</th>
                            <th>产品名称</th>
                            <th>分类</th>
                            <th>成本价</th>
                            <th>售价</th>
                            <th>单位</th>
                            <th>条码</th>
                            <th>创建时间</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="product : ${products}">
                            <td th:text="${product.id}">1</td>
                            <td th:text="${product.productName}">产品名称</td>
                            <td th:text="${product.category}">分类</td>
                            <td>¥<span th:text="${#numbers.formatDecimal(product.costPrice, 1, 2)}">0.00</span></td>
                            <td>¥<span th:text="${#numbers.formatDecimal(product.salePrice, 1, 2)}">0.00</span></td>
                            <td th:text="${product.unit}">件</td>
                            <td th:text="${product.barCode}">条码</td>
                            <td th:text="${#temporals.format(product.createTime, 'yyyy-MM-dd HH:mm')}">时间</td>
                            <td>
                                <a th:href="@{/products/edit/{id}(id=${product.id})}" class="btn btn-sm btn-info">
                                    <i class="fa fa-edit"></i> 编辑
                                </a>
                                <a th:href="@{/products/delete/{id}(id=${product.id})}" class="btn btn-sm btn-danger"
                                   onclick="return confirm('确定要删除该产品吗？')">
                                    <i class="fa fa-trash"></i> 删除
                                </a>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(products)}">
                            <td colspan="9" class="text-center">暂无数据</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<div th:replace="fragments/layout :: scripts"></div>
</body>
</html>
