<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <div th:replace="fragments/layout :: head('毛利率分析')"></div>
</head>
<body>
<div th:replace="fragments/layout :: sidebar('reports')"></div>

<div class="main-content">
    <div class="navbar-top d-flex justify-content-between align-items-center">
        <h4 class="mb-0"><i class="fa fa-money"></i> 毛利率分析</h4>
        <a th:href="@{/reports}" class="btn btn-secondary">
            <i class="fa fa-arrow-left"></i> 返回
        </a>
    </div>

    <div class="row mb-4">
        <div class="col-md-3">
            <div class="card stat-card p-4">
                <h6 class="text-white-50 mb-1">总销售额</h6>
                <h3 class="mb-0">¥<span th:text="${#numbers.formatDecimal(totalSales, 1, 2)}">0.00</span></h3>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card stat-card orange p-4">
                <h6 class="text-white-50 mb-1">总成本</h6>
                <h3 class="mb-0">¥<span th:text="${#numbers.formatDecimal(totalCost, 1, 2)}">0.00</span></h3>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card stat-card green p-4">
                <h6 class="text-white-50 mb-1">总利润</h6>
                <h3 class="mb-0">¥<span th:text="${#numbers.formatDecimal(totalProfit, 1, 2)}">0.00</span></h3>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card stat-card blue p-4">
                <h6 class="text-white-50 mb-1">综合毛利率</h6>
                <h3 class="mb-0" th:text="${overallGrossMargin}">0%</h3>
            </div>
        </div>
    </div>

    <div class="card">
        <div class="card-header">
            <h5 class="mb-0">各产品毛利率详情</h5>
        </div>
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-hover table-bordered">
                    <thead class="thead-light">
                        <tr>
                            <th>产品名称</th>
                            <th>销售数量</th>
                            <th>销售额</th>
                            <th>成本</th>
                            <th>利润</th>
                            <th>毛利率</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="item : ${productMargins}">
                            <td th:text="${item.productName}">产品</td>
                            <td th:text="${item.totalQuantity}">0</td>
                            <td>¥<span th:text="${#numbers.formatDecimal(item.totalSales, 1, 2)}">0.00</span></td>
                            <td>¥<span th:text="${#numbers.formatDecimal(item.totalCost, 1, 2)}">0.00</span></td>
                            <td class="text-success">¥<span th:text="${#numbers.formatDecimal(item.totalProfit, 1, 2)}">0.00</span></td>
                            <td>
                                <span th:class="${#strings.replace(item.grossMargin, '%', '') != '0.00' ? 'badge badge-success' : 'badge badge-secondary'}"
                                      th:text="${item.grossMargin}">0%</span>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(productMargins)}">
                            <td colspan="6" class="text-center">暂无数据，请先生成测试数据</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<div th:replace="fragments/layout :: scripts"></div>
</body>
</html>
