server:
  port: 8088
  servlet:
    context-path: /api

spring:
  application:
    name: personal-accounting
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:accounting;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql
      data-locations: classpath:db/data.sql

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.accounting.system.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

knife4j:
  enable: true
  openapi:
    title: 个人记账系统API文档
    description: 个人记账系统管理后台 - 基础记账功能接口文档
    version: 1.0.0
    concat: admin@accounting.com
    group:
      default:
        group-name: 记账系统接口
        api-rule: package
        api-rule-resources:
          - com.accounting.system.controller

logging:
  level:
    com.accounting.system: debug
