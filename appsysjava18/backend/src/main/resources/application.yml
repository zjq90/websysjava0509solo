server:
  port: 8080

spring:
  application:
    name: appsys-backend
  
  datasource:
    url: jdbc:h2:mem:appsysdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true
  
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.H2Dialect

# JWT配置
jwt:
  secret: appsys-secret-key-2024-spring-boot-jwt-token-secret
  expiration: 86400000

# AES加密配置
aes:
  secret: appsys-aes-256-encryption-secret-key-1234567890

# SpringDoc配置
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

# 日志配置
logging:
  level:
    com.appsys: DEBUG
    org.springframework.web: INFO
