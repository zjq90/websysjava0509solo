<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="pagination(page, url)" class="mt-4">
    <div th:if="${page != null and page.totalPages > 1}" class="d-flex justify-content-between align-items-center">
        <div class="text-muted">
            共 <span th:text="${page.totalElements}">0</span> 条记录，
            第 <span th:text="${page.number + 1}">1</span>/<span th:text="${page.totalPages}">1</span> 页
        </div>
        <nav>
            <ul class="pagination pagination-sm mb-0">
                <li class="page-item" th:classappend="${page.isFirst()} ? 'disabled' : ''">
                    <a class="page-link" th:href="${url} + '?page=0&size=' + ${page.size}" th:classappend="${page.isFirst()} ? 'disabled' : ''">
                        <i class="fas fa-angle-double-left"></i>
                    </a>
                </li>
                <li class="page-item" th:classappend="${!page.hasPrevious()} ? 'disabled' : ''">
                    <a class="page-link" th:href="${page.hasPrevious()} ? ${url} + '?page=' + ${page.previousPageable().pageNumber} + '&size=' + ${page.size} : '#'" th:classappend="${!page.hasPrevious()} ? 'disabled' : ''">
                        <i class="fas fa-angle-left"></i>
                    </a>
                </li>
                <li class="page-item" th:each="i : ${#numbers.sequence(0, page.totalPages - 1)}" th:classappend="${i == page.number} ? 'active' : ''" th:if="${i >= page.number - 2 and i <= page.number + 2}">
                    <a class="page-link" th:href="${url} + '?page=' + ${i} + '&size=' + ${page.size}" th:text="${i + 1}">1</a>
                </li>
                <li class="page-item" th:classappend="${!page.hasNext()} ? 'disabled' : ''">
                    <a class="page-link" th:href="${page.hasNext()} ? ${url} + '?page=' + ${page.nextPageable().pageNumber} + '&size=' + ${page.size} : '#'" th:classappend="${!page.hasNext()} ? 'disabled' : ''">
                        <i class="fas fa-angle-right"></i>
                    </a>
                </li>
                <li class="page-item" th:classappend="${page.isLast()} ? 'disabled' : ''">
                    <a class="page-link" th:href="${url} + '?page=' + ${page.totalPages - 1} + '&size=' + ${page.size}" th:classappend="${page.isLast()} ? 'disabled' : ''">
                        <i class="fas fa-angle-double-right"></i>
                    </a>
                </li>
            </ul>
        </nav>
    </div>
</div>
</body>
</html>
