<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/header::head('订单详情')">
    <style>
        .progress-timeline {
            display: flex;
            justify-content: space-between;
            position: relative;
        }
        .progress-timeline::before {
            content: '';
            position: absolute;
            top: 20px;
            left: 5%;
            right: 5%;
            height: 2px;
            background-color: #dee2e6;
            z-index: 1;
        }
        .progress-step {
            position: relative;
            z-index: 2;
            text-align: center;
            flex: 1;
        }
        .progress-step .step-dot {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-color: #fff;
            border: 3px solid #dee2e6;
            margin: 0 auto 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
        }
        .progress-step.active .step-dot {
            border-color: #007bff;
            color: #007bff;
            background-color: #e3f2fd;
        }
        .progress-step.completed .step-dot {
            border-color: #28a745;
            background-color: #28a745;
            color: #fff;
        }
        .step-label {
            font-size: 12px;
            color: #6c757d;
        }
        .progress-step.active .step-label,
        .progress-step.completed .step-label {
            color: #212529;
            font-weight: bold;
        }
    </style>
</head>
<body>
<div th:replace="fragments/navbar::navbar"></div>

<div class="container-fluid">
    <div class="row">
        <div class="col-md-2 px-0">
            <div th:replace="fragments/sidebar::sidebar('orders')"></div>
        </div>
        <div class="col-md-10">
            <div class="main-content">
                <div th:replace="fragments/alerts::alerts"></div>
                
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h2><i class="fas fa-file-invoice"></i> 订单详情</h2>
                    <a href="/orders" class="btn btn-secondary">
                        <i class="fas fa-arrow-left"></i> 返回列表
                    </a>
                </div>
                
                <!-- 订单状态进度 -->
                <div class="card mb-4">
                    <div class="card-header">
                        <h5>订单状态跟踪</h5>
                    </div>
                    <div class="card-body">
                        <div class="progress-timeline">
                            <div class="progress-step" 
                                 th:classappend="${#strings.contains('PENDING_ORDER,ORDERED,PAID,SHIPPED,IN_TRANSIT,DELIVERED', order.status.name())} ? 'completed' : ''">
                                <div class="step-dot"><i class="fas fa-check"></i></div>
                                <div class="step-label">待下单</div>
                            </div>
                            <div class="progress-step"
                                 th:classappend="${#strings.contains('ORDERED,PAID,SHIPPED,IN_TRANSIT,DELIVERED', order.status.name())} ? 'completed' : ''">
                                <div class="step-dot"><i class="fas fa-check"></i></div>
                                <div class="step-label">已下单</div>
                            </div>
                            <div class="progress-step"
                                 th:classappend="${#strings.contains('PAID,SHIPPED,IN_TRANSIT,DELIVERED', order.status.name())} ? 'completed' : ''">
                                <div class="step-dot"><i class="fas fa-check"></i></div>
                                <div class="step-label">已收款</div>
                            </div>
                            <div class="progress-step"
                                 th:classappend="${#strings.contains('SHIPPED,IN_TRANSIT,DELIVERED', order.status.name())} ? 'completed' : ''">
                                <div class="step-dot"><i class="fas fa-check"></i></div>
                                <div class="step-label">已发货</div>
                            </div>
                            <div class="progress-step"
                                 th:classappend="${#strings.contains('IN_TRANSIT,DELIVERED', order.status.name())} ? 'completed' : ''">
                                <div class="step-dot"><i class="fas fa-check"></i></div>
                                <div class="step-label">运输中</div>
                            </div>
                            <div class="progress-step"
                                 th:classappend="${order.status.name() == 'DELIVERED'} ? 'completed' : ''">
                                <div class="step-dot"><i class="fas fa-check"></i></div>
                                <div class="step-label">已签收</div>
                            </div>
                        </div>
                    </div>
                </div>
                
                <div class="row">
                    <div class="col-md-8">
                        <!-- 基本信息 -->
                        <div class="card mb-4">
                            <div class="card-header">
                                <h5>订单信息</h5>
                            </div>
                            <div class="card-body">
                                <div class="row">
                                    <div class="col-md-6">
                                        <table class="table table-borderless">
                                            <tr><th style="width: 100px;">订单号</th><td th:text="${order.orderNo}"></td></tr>
                                            <tr><th>客户</th><td th:text="${order.customer.name}"></td></tr>
                                            <tr><th>客户类型</th><td th:text="${order.customer.type.description}"></td></tr>
                                            <tr><th>客户等级</th><td th:text="${order.customer.level.description}"></td></tr>
                                        </table>
                                    </div>
                                    <div class="col-md-6">
                                        <table class="table table-borderless">
                                            <tr><th style="width: 100px;">当前状态</th>
                                                <td><span class="badge badge-lg"
                                                          th:class="${order.status.name() == 'DELIVERED'} ? 'badge-success' : 
                                                                      (${order.status.name() == 'CANCELLED'} ? 'badge-secondary' : 'badge-primary')"
                                                          th:text="${order.status.description}"></span>
                                                </td>
                                            </tr>
                                            <tr><th>订单金额</th><td th:text="${#numbers.formatCurrency(order.totalAmount)}"></td></tr>
                                            <tr><th>已收金额</th><td th:text="${#numbers.formatCurrency(order.paidAmount)}"></td></tr>
                                            <tr><th>创建时间</th><td th:text="${#temporals.format(order.createTime, 'yyyy-MM-dd HH:mm:ss')}"></td></tr>
                                        </table>
                                    </div>
                                </div>
                            </div>
                        </div>
                        
                        <!-- 订单项 -->
                        <div class="card mb-4">
                            <div class="card-header">
                                <h5>产品明细</h5>
                            </div>
                            <div class="card-body">
                                <div th:if="${#lists.isEmpty(orderItems)}" class="text-center text-muted py-4">
                                    暂无产品明细
                                </div>
                                <div th:unless="${#lists.isEmpty(orderItems)}">
                                    <table class="table table-bordered">
                                        <thead class="thead-light">
                                            <tr>
                                                <th>产品</th>
                                                <th>单价</th>
                                                <th>数量</th>
                                                <th>小计</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            <tr th:each="item : ${orderItems}">
                                                <td th:text="${item.product.code + ' - ' + item.product.name}"></td>
                                                <td th:text="${#numbers.formatCurrency(item.unitPrice)}"></td>
                                                <td th:text="${item.quantity + ' ' + item.product.unit}"></td>
                                                <td th:text="${#numbers.formatCurrency(item.subtotal)}"></td>
                                            </tr>
                                        </tbody>
                                        <tfoot>
                                            <tr class="table-info">
                                                <th colspan="3" class="text-right">总计</th>
                                                <th th:text="${#numbers.formatCurrency(order.totalAmount)}"></th>
                                            </tr>
                                        </tfoot>
                                    </table>
                                </div>
                            </div>
                        </div>
                        
                        <!-- 物流信息 -->
                        <div class="card">
                            <div class="card-header">
                                <h5>物流信息</h5>
                            </div>
                            <div class="card-body">
                                <div th:if="${#lists.isEmpty(logisticsList)}" class="text-center text-muted py-4">
                                    暂无物流信息
                                </div>
                                <div th:unless="${#lists.isEmpty(logisticsList)}" class="order-timeline">
                                    <div th:each="log : ${logisticsList}" class="timeline-item completed">
                                        <div class="timeline-dot"></div>
                                        <strong th:text="${#temporals.format(log.createTime, 'yyyy-MM-dd HH:mm:ss')}"></strong>
                                        <div th:if="${log.trackingNo}">
                                            <small class="text-muted">物流单号：<span th:text="${log.trackingNo}"></span></small>
                                        </div>
                                        <div th:if="${log.logisticsCompany}">
                                            <small class="text-muted">物流公司：<span th:text="${log.logisticsCompany}"></span></small>
                                        </div>
                                        <div th:if="${log.currentLocation}">
                                            <span th:text="${log.currentLocation}"></span>
                                        </div>
                                        <div th:if="${log.statusDescription}">
                                            <p class="mb-0" th:text="${log.statusDescription}"></p>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <div class="col-md-4">
                        <!-- 操作面板 -->
                        <div class="card mb-4">
                            <div class="card-header">
                                <h5>订单操作</h5>
                            </div>
                            <div class="card-body">
                                <!-- 确认下单 -->
                                <div th:if="${order.status.name() == 'PENDING_ORDER'}" class="mb-3">
                                    <form th:action="@{/orders/{id}/confirm(id=${order.id})}" method="post">
                                        <button type="submit" class="btn btn-primary btn-block">
                                            <i class="fas fa-check"></i> 确认下单
                                        </button>
                                    </form>
                                </div>
                                
                                <!-- 确认收款 -->
                                <div th:if="${order.status.name() == 'ORDERED' or order.status.name() == 'PENDING_PAYMENT'}" class="mb-3">
                                    <form th:action="@{/orders/{id}/payment(id=${order.id})}" method="post">
                                        <div class="form-group">
                                            <label>收款金额</label>
                                            <input type="number" name="paidAmount" class="form-control" step="0.01" 
                                                   th:value="${order.totalAmount}" required>
                                        </div>
                                        <button type="submit" class="btn btn-success btn-block">
                                            <i class="fas fa-money-check-alt"></i> 确认收款
                                        </button>
                                    </form>
                                </div>
                                
                                <!-- 发货 -->
                                <div th:if="${order.status.name() == 'PAID' or order.status.name() == 'PENDING_SHIPMENT'}" class="mb-3">
                                    <a th:href="@{/orders/{id}/ship(id=${order.id})}" class="btn btn-info btn-block">
                                        <i class="fas fa-truck"></i> 安排发货
                                    </a>
                                </div>
                                
                                <!-- 更新物流 -->
                                <div th:if="${order.status.name() == 'SHIPPED' or order.status.name() == 'IN_TRANSIT'}" class="mb-3">
                                    <form th:action="@{/orders/{id}/logistics(id=${order.id})}" method="post">
                                        <div class="form-group">
                                            <label>当前位置</label>
                                            <input type="text" name="currentLocation" class="form-control" required>
                                        </div>
                                        <div class="form-group">
                                            <label>状态描述</label>
                                            <textarea name="statusDescription" class="form-control" rows="2" required></textarea>
                                        </div>
                                        <button type="submit" class="btn btn-info btn-block">
                                            <i class="fas fa-location-arrow"></i> 更新物流
                                        </button>
                                    </form>
                                </div>
                                
                                <!-- 确认签收 -->
                                <div th:if="${order.status.name() == 'SHIPPED' or order.status.name() == 'IN_TRANSIT'}" class="mb-3">
                                    <form th:action="@{/orders/{id}/delivery(id=${order.id})}" method="post">
                                        <button type="submit" class="btn btn-success btn-block">
                                            <i class="fas fa-box-open"></i> 确认签收
                                        </button>
                                    </form>
                                </div>
                                
                                <!-- 取消订单 -->
                                <div th:if="${order.status.name() != 'DELIVERED' and order.status.name() != 'CANCELLED'}">
                                    <button type="button" class="btn btn-danger btn-block" data-toggle="modal" data-target="#cancelModal">
                                        <i class="fas fa-times"></i> 取消订单
                                    </button>
                                </div>
                                
                                <div th:if="${order.status.name() == 'DELIVERED'}" class="alert alert-success text-center">
                                    <i class="fas fa-check-circle"></i> 订单已完成
                                </div>
                                
                                <div th:if="${order.status.name() == 'CANCELLED'}" class="alert alert-secondary text-center">
                                    <i class="fas fa-times-circle"></i> 订单已取消
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- 取消订单模态框 -->
<div class="modal fade" id="cancelModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">取消订单</h5>
                <button type="button" class="close" data-dismiss="modal">
                    <span>&times;</span>
                </button>
            </div>
            <form th:action="@{/orders/{id}/cancel(id=${order.id})}" method="post">
                <div class="modal-body">
                    <div class="form-group">
                        <label>取消原因 <span class="text-danger">*</span></label>
                        <textarea name="reason" class="form-control" rows="3" required></textarea>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-dismiss="modal">取消</button>
                    <button type="submit" class="btn btn-danger">确认取消订单</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/jquery@3.6.0/dist/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
