<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/header::head('订单管理')"></head>
<body>
<div th:replace="fragments/navbar::navbar"></div>

<div class="container-fluid">
    <div class="row">
        <div class="col-md-2 px-0">
            <div th:replace="fragments/sidebar::sidebar('orders')"></div>
        </div>
        <div class="col-md-10">
            <div class="main-content">
                <div th:replace="fragments/alerts::alerts"></div>
                
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h2><i class="fas fa-shopping-cart"></i> 订单管理</h2>
                    <a href="/orders/new" class="btn btn-primary">
                        <i class="fas fa-plus"></i> 新建订单
                    </a>
                </div>
                
                <!-- 搜索和筛选 -->
                <div class="card mb-4">
                    <div class="card-body">
                        <form method="get" class="form-row">
                            <div class="col-md-4 mb-2">
                                <input type="text" name="orderNo" class="form-control" placeholder="搜索订单号" th:value="${orderNo}">
                            </div>
                            <div class="col-md-4 mb-2">
                                <select name="status" class="form-control">
                                    <option value="">全部状态</option>
                                    <option th:each="s : ${statuses}" 
                                            th:value="${s.name()}"
                                            th:text="${s.description}"
                                            th:selected="${selectedStatus == s}"></option>
                                </select>
                            </div>
                            <div class="col-md-4 mb-2">
                                <button type="submit" class="btn btn-primary">
                                    <i class="fas fa-search"></i> 搜索
                                </button>
                                <a href="/orders" class="btn btn-secondary">
                                    <i class="fas fa-undo"></i> 重置
                                </a>
                            </div>
                        </form>
                    </div>
                </div>
                
                <!-- 订单列表 -->
                <div class="card">
                    <div class="card-body">
                        <div th:if="${#lists.isEmpty(orders)}" class="text-center text-muted py-4">
                            暂无订单数据
                        </div>
                        <div th:unless="${#lists.isEmpty(orders)}">
                            <table class="table table-hover">
                                <thead>
                                    <tr>
                                        <th>订单号</th>
                                        <th>客户</th>
                                        <th>金额</th>
                                        <th>已收金额</th>
                                        <th>状态</th>
                                        <th>创建时间</th>
                                        <th>操作</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="order : ${orders}">
                                        <td th:text="${order.orderNo}"></td>
                                        <td th:text="${order.customer.name}"></td>
                                        <td th:text="${#numbers.formatCurrency(order.totalAmount)}"></td>
                                        <td th:text="${#numbers.formatCurrency(order.paidAmount)}"></td>
                                        <td>
                                            <span class="badge" th:class="${order.status.name() == 'DELIVERED'} ? 'badge-success' : 
                                                                        (${order.status.name() == 'CANCELLED'} ? 'badge-secondary' :
                                                                        (${order.status.name() == 'SHIPPED' || order.status.name() == 'IN_TRANSIT'} ? 'badge-info' :
                                                                        (${order.status.name() == 'PAID'} ? 'badge-warning' : 'badge-primary')))"
                                                  th:text="${order.status.description}"></span>
                                        </td>
                                        <td th:text="${#temporals.format(order.createTime, 'yyyy-MM-dd HH:mm')}"></td>
                                        <td>
                                            <a th:href="@{/orders/{id}(id=${order.id})}" class="btn btn-sm btn-info">
                                                <i class="fas fa-eye"></i> 查看
                                            </a>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                        <div th:replace="fragments/pagination::pagination(${page}, '/orders')"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/jquery@3.6.0/dist/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
