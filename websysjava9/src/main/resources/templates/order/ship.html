<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/header::head('安排发货')"></head>
<body>
<div th:replace="fragments/navbar::navbar"></div>

<div class="container-fluid">
    <div class="row">
        <div class="col-md-2 px-0">
            <div th:replace="fragments/sidebar::sidebar('orders')"></div>
        </div>
        <div class="col-md-10">
            <div class="main-content">
                <h2 class="mb-4"><i class="fas fa-truck"></i> 安排发货</h2>
                
                <div class="row">
                    <div class="col-md-8">
                        <div class="card">
                            <div class="card-body">
                                <form th:action="@{/orders/{id}/ship(id=${order.id})}" th:object="${logistics}" method="post">
                                    <div class="form-row">
                                        <div class="form-group col-md-6">
                                            <label>物流公司</label>
                                            <input type="text" th:field="*{logisticsCompany}" class="form-control" placeholder="如：顺丰速运">
                                        </div>
                                        <div class="form-group col-md-6">
                                            <label>物流单号</label>
                                            <input type="text" th:field="*{trackingNo}" class="form-control">
                                        </div>
                                    </div>
                                    
                                    <div class="form-group">
                                        <label>发件地址</label>
                                        <input type="text" th:field="*{fromAddress}" class="form-control">
                                    </div>
                                    
                                    <div class="form-group">
                                        <label>收件地址</label>
                                        <input type="text" th:field="*{toAddress}" class="form-control"
                                               th:value="${order.customer.province + ' ' + order.customer.city + ' ' + order.customer.address}">
                                    </div>
                                    
                                    <div class="form-group">
                                        <label>当前位置/状态</label>
                                        <input type="text" th:field="*{currentLocation}" class="form-control" value="仓库已出库" required>
                                    </div>
                                    
                                    <div class="form-group">
                                        <label>状态描述</label>
                                        <textarea th:field="*{statusDescription}" class="form-control" rows="2">商品已发出，正在配送中</textarea>
                                    </div>
                                    
                                    <div class="form-group">
                                        <button type="submit" class="btn btn-primary">
                                            <i class="fas fa-check"></i> 确认发货
                                        </button>
                                        <a th:href="@{/orders/{id}(id=${order.id})}" class="btn btn-secondary">
                                            <i class="fas fa-undo"></i> 取消
                                        </a>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>
                    
                    <div class="col-md-4">
                        <div class="card">
                            <div class="card-header">
                                <h5>订单信息</h5>
                            </div>
                            <div class="card-body">
                                <table class="table table-borderless">
                                    <tr><th>订单号</th><td th:text="${order.orderNo}"></td></tr>
                                    <tr><th>客户</th><td th:text="${order.customer.name}"></td></tr>
                                    <tr><th>联系人</th><td th:text="${order.customer.contactPerson}"></td></tr>
                                    <tr><th>电话</th><td th:text="${order.customer.phone}"></td></tr>
                                    <tr><th>金额</th><td th:text="${#numbers.formatCurrency(order.totalAmount)}"></td></tr>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/jquery@3.6.0/dist/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
