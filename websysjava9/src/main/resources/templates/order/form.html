<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/header::head('新建订单')">
    <style>
        .product-row {
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
<div th:replace="fragments/navbar::navbar"></div>

<div class="container-fluid">
    <div class="row">
        <div class="col-md-2 px-0">
            <div th:replace="fragments/sidebar::sidebar('orders')"></div>
        </div>
        <div class="col-md-10">
            <div class="main-content">
                <h2 class="mb-4"><i class="fas fa-cart-plus"></i> 新建订单</h2>
                
                <form action="/orders" method="post" id="orderForm">
                    <div class="card mb-4">
                        <div class="card-header">
                            <h5>客户信息</h5>
                        </div>
                        <div class="card-body">
                            <div class="form-row">
                                <div class="form-group col-md-6">
                                    <label>选择客户 <span class="text-danger">*</span></label>
                                    <select name="customerId" class="form-control" required id="customerSelect">
                                        <option value="">请选择客户</option>
                                        <option th:each="c : ${customers}" 
                                                th:value="${c.id}"
                                                th:text="${c.code + ' - ' + c.name + ' (' + c.type.description + ' - ' + c.level.description + ')'}"></option>
                                    </select>
                                </div>
                                <div class="form-group col-md-6">
                                    <label>备注</label>
                                    <textarea name="remark" class="form-control" rows="2"></textarea>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <div class="card mb-4">
                        <div class="card-header d-flex justify-content-between align-items-center">
                            <h5>产品列表</h5>
                            <button type="button" class="btn btn-sm btn-success" onclick="addProductRow()">
                                <i class="fas fa-plus"></i> 添加产品
                            </button>
                        </div>
                        <div class="card-body">
                            <div id="productList">
                                <div class="form-row product-row" data-index="0">
                                    <div class="col-md-4">
                                        <select name="productIds" class="form-control product-select" required>
                                            <option value="">请选择产品</option>
                                            <option th:each="p : ${products}" 
                                                    th:value="${p.id}"
                                                    th:data-price="${p.basePrice}"
                                                    th:text="${p.code + ' - ' + p.name + ' (' + #numbers.formatCurrency(p.basePrice) + '/' + p.unit + ')'}"></option>
                                        </select>
                                    </div>
                                    <div class="col-md-2">
                                        <input type="number" name="quantities" class="form-control quantity-input" min="1" value="1" placeholder="数量" required>
                                    </div>
                                    <div class="col-md-2">
                                        <input type="text" class="form-control unit-price" placeholder="单价" readonly>
                                    </div>
                                    <div class="col-md-2">
                                        <input type="text" class="form-control subtotal" placeholder="小计" readonly>
                                    </div>
                                    <div class="col-md-2">
                                        <button type="button" class="btn btn-danger btn-block" onclick="removeProductRow(this)">
                                            <i class="fas fa-trash"></i>
                                        </button>
                                    </div>
                                </div>
                            </div>
                            
                            <div class="mt-3 text-right">
                                <h4>订单总金额：<span id="totalAmount" class="text-primary">¥0.00</span></h4>
                            </div>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-save"></i> 创建订单
                        </button>
                        <a href="/orders" class="btn btn-secondary">
                            <i class="fas fa-undo"></i> 取消
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/jquery@3.6.0/dist/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
    var productIndex = 1;
    
    function addProductRow() {
        var template = $('#productList .product-row:first').clone();
        template.attr('data-index', productIndex++);
        template.find('.product-select').val('');
        template.find('.quantity-input').val(1);
        template.find('.unit-price').val('');
        template.find('.subtotal').val('');
        $('#productList').append(template);
        bindRowEvents(template);
    }
    
    function removeProductRow(btn) {
        var row = $(btn).closest('.product-row');
        if ($('#productList .product-row').length > 1) {
            row.remove();
            calculateTotal();
        }
    }
    
    function bindRowEvents(row) {
        row.find('.product-select').change(function() {
            var price = parseFloat($(this).find('option:selected').data('price') || 0);
            var row = $(this).closest('.product-row');
            row.find('.unit-price').val(price.toFixed(2));
            calculateRowSubtotal(row);
        });
        
        row.find('.quantity-input').change(function() {
            calculateRowSubtotal($(this).closest('.product-row'));
        });
    }
    
    function calculateRowSubtotal(row) {
        var quantity = parseInt(row.find('.quantity-input').val()) || 0;
        var price = parseFloat(row.find('.unit-price').val()) || 0;
        var subtotal = quantity * price;
        row.find('.subtotal').val(subtotal.toFixed(2));
        calculateTotal();
    }
    
    function calculateTotal() {
        var total = 0;
        $('.product-row').each(function() {
            var subtotal = parseFloat($(this).find('.subtotal').val()) || 0;
            total += subtotal;
        });
        $('#totalAmount').text('¥' + total.toFixed(2));
    }
    
    // 初始绑定
    $(function() {
        bindRowEvents($('#productList .product-row:first'));
    });
</script>
</body>
</html>
