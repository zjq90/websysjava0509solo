<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/header::head(${customer.id == null} ? '新增客户' : '编辑客户')"></head>
<body>
<div th:replace="fragments/navbar::navbar"></div>

<div class="container-fluid">
    <div class="row">
        <div class="col-md-2 px-0">
            <div th:replace="fragments/sidebar::sidebar('customers')"></div>
        </div>
        <div class="col-md-10">
            <div class="main-content">
                <h2 class="mb-4">
                    <i class="fas fa-user-edit"></i>
                    <span th:text="${customer.id == null} ? '新增客户' : '编辑客户'"></span>
                </h2>
                
                <div class="card">
                    <div class="card-body">
                        <form th:action="@{/customers}" th:object="${customer}" method="post">
                            <input type="hidden" th:field="*{id}">
                            
                            <div class="form-row">
                                <div class="form-group col-md-4">
                                    <label>客户编码 <span class="text-danger">*</span></label>
                                    <input type="text" th:field="*{code}" class="form-control" required>
                                </div>
                                <div class="form-group col-md-4">
                                    <label>客户名称 <span class="text-danger">*</span></label>
                                    <input type="text" th:field="*{name}" class="form-control" required>
                                </div>
                                <div class="form-group col-md-4">
                                    <label>客户类型 <span class="text-danger">*</span></label>
                                    <select th:field="*{type}" class="form-control" required>
                                        <option th:each="type : ${types}" 
                                                th:value="${type.name()}"
                                                th:text="${type.description}"></option>
                                    </select>
                                </div>
                            </div>
                            
                            <div class="form-row">
                                <div class="form-group col-md-4">
                                    <label>客户等级</label>
                                    <select th:field="*{level}" class="form-control">
                                        <option th:each="level : ${levels}" 
                                                th:value="${level.name()}"
                                                th:text="${level.description}"></option>
                                    </select>
                                </div>
                                <div class="form-group col-md-4">
                                    <label>联系人</label>
                                    <input type="text" th:field="*{contactPerson}" class="form-control">
                                </div>
                                <div class="form-group col-md-4">
                                    <label>联系电话</label>
                                    <input type="text" th:field="*{phone}" class="form-control">
                                </div>
                            </div>
                            
                            <div class="form-row">
                                <div class="form-group col-md-4">
                                    <label>省份</label>
                                    <input type="text" th:field="*{province}" class="form-control" placeholder="如：浙江省">
                                </div>
                                <div class="form-group col-md-4">
                                    <label>城市</label>
                                    <input type="text" th:field="*{city}" class="form-control" placeholder="如：杭州市">
                                </div>
                                <div class="form-group col-md-4">
                                    <label>电子邮箱</label>
                                    <input type="email" th:field="*{email}" class="form-control">
                                </div>
                            </div>
                            
                            <div class="form-group">
                                <label>详细地址</label>
                                <input type="text" th:field="*{address}" class="form-control">
                            </div>
                            
                            <div class="form-group">
                                <label>客户标签 <small class="text-muted">（多个标签用逗号分隔）</small></label>
                                <input type="text" th:field="*{tags}" class="form-control" placeholder="如：重要客户,长期合作,VIP">
                            </div>
                            
                            <div class="form-group">
                                <label>备注</label>
                                <textarea th:field="*{remark}" class="form-control" rows="3"></textarea>
                            </div>
                            
                            <div class="form-group">
                                <div class="custom-control custom-checkbox">
                                    <input type="checkbox" th:field="*{active}" class="custom-control-input" id="active">
                                    <label class="custom-control-label" for="active">启用该客户</label>
                                </div>
                            </div>
                            
                            <div class="form-group">
                                <button type="submit" class="btn btn-primary">
                                    <i class="fas fa-save"></i> 保存
                                </button>
                                <a href="/customers" class="btn btn-secondary">
                                    <i class="fas fa-undo"></i> 取消
                                </a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/jquery@3.6.0/dist/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
