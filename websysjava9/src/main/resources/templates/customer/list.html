<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/header::head('客户管理')"></head>
<body>
<div th:replace="fragments/navbar::navbar"></div>

<div class="container-fluid">
    <div class="row">
        <div class="col-md-2 px-0">
            <div th:replace="fragments/sidebar::sidebar('customers')"></div>
        </div>
        <div class="col-md-10">
            <div class="main-content">
                <div th:replace="fragments/alerts::alerts"></div>
                
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h2><i class="fas fa-users"></i> 客户管理</h2>
                    <a href="/customers/new" class="btn btn-primary">
                        <i class="fas fa-plus"></i> 新增客户
                    </a>
                </div>
                
                <!-- 搜索和筛选 -->
                <div class="card mb-4">
                    <div class="card-body">
                        <form method="get" class="form-row">
                            <div class="col-md-4 mb-2">
                                <input type="text" name="keyword" class="form-control" placeholder="搜索客户名称" th:value="${keyword}">
                            </div>
                            <div class="col-md-2 mb-2">
                                <select name="type" class="form-control">
                                    <option value="">全部类型</option>
                                    <option th:each="type : ${types}" 
                                            th:value="${type.name()}"
                                            th:text="${type.description}"
                                            th:selected="${selectedType == type}"></option>
                                </select>
                            </div>
                            <div class="col-md-2 mb-2">
                                <select name="level" class="form-control">
                                    <option value="">全部等级</option>
                                    <option th:each="level : ${levels}" 
                                            th:value="${level.name()}"
                                            th:text="${level.description}"
                                            th:selected="${selectedLevel == level}"></option>
                                </select>
                            </div>
                            <div class="col-md-4 mb-2">
                                <button type="submit" class="btn btn-primary">
                                    <i class="fas fa-search"></i> 搜索
                                </button>
                                <a href="/customers" class="btn btn-secondary">
                                    <i class="fas fa-undo"></i> 重置
                                </a>
                            </div>
                        </form>
                    </div>
                </div>
                
                <!-- 客户列表 -->
                <div class="card">
                    <div class="card-body">
                        <div th:if="${#lists.isEmpty(customers)}" class="text-center text-muted py-4">
                            暂无客户数据
                        </div>
                        <div th:unless="${#lists.isEmpty(customers)}">
                            <table class="table table-hover">
                                <thead>
                                    <tr>
                                        <th>编码</th>
                                        <th>名称</th>
                                        <th>类型</th>
                                        <th>等级</th>
                                        <th>联系人</th>
                                        <th>电话</th>
                                        <th>区域</th>
                                        <th>标签</th>
                                        <th>状态</th>
                                        <th>操作</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="customer : ${customers}">
                                        <td th:text="${customer.code}"></td>
                                        <td th:text="${customer.name}"></td>
                                        <td th:text="${customer.type.description}"></td>
                                        <td>
                                            <span class="badge" th:class="${customer.level.name() == 'CORE'} ? 'badge-danger' : 
                                                                        (${customer.level.name() == 'GOOD'} ? 'badge-warning' : 'badge-secondary')"
                                                  th:text="${customer.level.description}"></span>
                                        </td>
                                        <td th:text="${customer.contactPerson}">-</td>
                                        <td th:text="${customer.phone}">-</td>
                                        <td th:text="${customer.province + ' ' + customer.city}">-</td>
                                        <td th:text="${customer.tags}">-</td>
                                        <td>
                                            <span class="badge" 
                                                  th:class="${customer.active} ? 'badge-success' : 'badge-secondary'"
                                                  th:text="${customer.active} ? '启用' : '禁用'"></span>
                                        </td>
                                        <td>
                                            <div class="btn-group btn-group-sm">
                                                <a th:href="@{/customers/{id}(id=${customer.id})}" class="btn btn-info" title="查看">
                                                    <i class="fas fa-eye"></i>
                                                </a>
                                                <a th:href="@{/customers/{id}/edit(id=${customer.id})}" class="btn btn-warning" title="编辑">
                                                    <i class="fas fa-edit"></i>
                                                </a>
                                                <form th:action="@{/customers/{id}/delete(id=${customer.id})}" method="post" 
                                                      th:onsubmit="'return confirm(\'确定删除此客户？\')'">
                                                    <button type="submit" class="btn btn-danger" title="删除">
                                                        <i class="fas fa-trash"></i>
                                                    </button>
                                                </form>
                                            </div>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                        <div th:replace="fragments/pagination::pagination(${page}, '/customers')"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/jquery@3.6.0/dist/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
