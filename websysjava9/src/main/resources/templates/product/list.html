<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/header::head('产品管理')"></head>
<body>
<div th:replace="fragments/navbar::navbar"></div>

<div class="container-fluid">
    <div class="row">
        <div class="col-md-2 px-0">
            <div th:replace="fragments/sidebar::sidebar('products')"></div>
        </div>
        <div class="col-md-10">
            <div class="main-content">
                <div th:replace="fragments/alerts::alerts"></div>
                
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h2><i class="fas fa-boxes"></i> 产品管理</h2>
                    <a href="/products/new" class="btn btn-primary">
                        <i class="fas fa-plus"></i> 新增产品
                    </a>
                </div>
                
                <!-- 搜索 -->
                <div class="card mb-4">
                    <div class="card-body">
                        <form method="get" class="form-row">
                            <div class="col-md-6 mb-2">
                                <input type="text" name="keyword" class="form-control" placeholder="搜索产品名称" th:value="${keyword}">
                            </div>
                            <div class="col-md-6 mb-2">
                                <button type="submit" class="btn btn-primary">
                                    <i class="fas fa-search"></i> 搜索
                                </button>
                                <a href="/products" class="btn btn-secondary">
                                    <i class="fas fa-undo"></i> 重置
                                </a>
                            </div>
                        </form>
                    </div>
                </div>
                
                <!-- 产品列表 -->
                <div class="card">
                    <div class="card-body">
                        <div th:if="${#lists.isEmpty(products)}" class="text-center text-muted py-4">
                            暂无产品数据
                        </div>
                        <div th:unless="${#lists.isEmpty(products)}">
                            <table class="table table-hover">
                                <thead>
                                    <tr>
                                        <th>编码</th>
                                        <th>名称</th>
                                        <th>类别</th>
                                        <th>规格</th>
                                        <th>基础价格</th>
                                        <th>库存</th>
                                        <th>单位</th>
                                        <th>状态</th>
                                        <th>操作</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="product : ${products}">
                                        <td th:text="${product.code}"></td>
                                        <td th:text="${product.name}"></td>
                                        <td th:text="${product.category}">-</td>
                                        <td th:text="${product.specification}">-</td>
                                        <td th:text="${#numbers.formatCurrency(product.basePrice)}"></td>
                                        <td th:text="${product.stockQuantity}"></td>
                                        <td th:text="${product.unit}"></td>
                                        <td>
                                            <span class="badge" 
                                                  th:class="${product.active} ? 'badge-success' : 'badge-secondary'"
                                                  th:text="${product.active} ? '启用' : '禁用'"></span>
                                        </td>
                                        <td>
                                            <div class="btn-group btn-group-sm">
                                                <a th:href="@{/products/{id}(id=${product.id})}" class="btn btn-info" title="查看">
                                                    <i class="fas fa-eye"></i>
                                                </a>
                                                <a th:href="@{/products/{id}/edit(id=${product.id})}" class="btn btn-warning" title="编辑">
                                                    <i class="fas fa-edit"></i>
                                                </a>
                                                <form th:action="@{/products/{id}/delete(id=${product.id})}" method="post"
                                                      th:onsubmit="'return confirm(\'确定删除此产品？\')'">
                                                    <button type="submit" class="btn btn-danger" title="删除">
                                                        <i class="fas fa-trash"></i>
                                                    </button>
                                                </form>
                                            </div>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                        <div th:replace="fragments/pagination::pagination(${page}, '/products')"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/jquery@3.6.0/dist/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
