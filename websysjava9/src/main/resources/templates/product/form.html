<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/header::head(${product.id == null} ? '新增产品' : '编辑产品')"></head>
<body>
<div th:replace="fragments/navbar::navbar"></div>

<div class="container-fluid">
    <div class="row">
        <div class="col-md-2 px-0">
            <div th:replace="fragments/sidebar::sidebar('products')"></div>
        </div>
        <div class="col-md-10">
            <div class="main-content">
                <h2 class="mb-4">
                    <i class="fas fa-box"></i>
                    <span th:text="${product.id == null} ? '新增产品' : '编辑产品'"></span>
                </h2>
                
                <div class="card">
                    <div class="card-body">
                        <form th:action="@{/products}" th:object="${product}" method="post">
                            <input type="hidden" th:field="*{id}">
                            
                            <div class="form-row">
                                <div class="form-group col-md-4">
                                    <label>产品编码 <span class="text-danger">*</span></label>
                                    <input type="text" th:field="*{code}" class="form-control" required>
                                </div>
                                <div class="form-group col-md-4">
                                    <label>产品名称 <span class="text-danger">*</span></label>
                                    <input type="text" th:field="*{name}" class="form-control" required>
                                </div>
                                <div class="form-group col-md-4">
                                    <label>产品类别</label>
                                    <input type="text" th:field="*{category}" class="form-control" placeholder="如：化肥、农药">
                                </div>
                            </div>
                            
                            <div class="form-row">
                                <div class="form-group col-md-4">
                                    <label>基础价格 <span class="text-danger">*</span></label>
                                    <input type="number" th:field="*{basePrice}" class="form-control" step="0.01" min="0" required>
                                </div>
                                <div class="form-group col-md-4">
                                    <label>库存数量</label>
                                    <input type="number" th:field="*{stockQuantity}" class="form-control" min="0" value="0">
                                </div>
                                <div class="form-group col-md-4">
                                    <label>单位</label>
                                    <input type="text" th:field="*{unit}" class="form-control" placeholder="如：吨、袋、箱">
                                </div>
                            </div>
                            
                            <div class="form-group">
                                <label>产品规格</label>
                                <input type="text" th:field="*{specification}" class="form-control">
                            </div>
                            
                            <div class="form-group">
                                <label>产品描述</label>
                                <textarea th:field="*{description}" class="form-control" rows="3"></textarea>
                            </div>
                            
                            <div class="form-group">
                                <div class="custom-control custom-checkbox">
                                    <input type="checkbox" th:field="*{active}" class="custom-control-input" id="active">
                                    <label class="custom-control-label" for="active">启用该产品</label>
                                </div>
                            </div>
                            
                            <div class="form-group">
                                <button type="submit" class="btn btn-primary">
                                    <i class="fas fa-save"></i> 保存
                                </button>
                                <a href="/products" class="btn btn-secondary">
                                    <i class="fas fa-undo"></i> 取消
                                </a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/jquery@3.6.0/dist/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
