<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/header::head('仪表盘 - 销售与客户管理系统')"></head>
<body>
<div th:replace="fragments/navbar::navbar"></div>

<div class="container-fluid">
    <div class="row">
        <div class="col-md-2 px-0">
            <div th:replace="fragments/sidebar::sidebar('dashboard')"></div>
        </div>
        <div class="col-md-10">
            <div class="main-content">
                <div th:replace="fragments/alerts::alerts"></div>
                
                <h2 class="mb-4"><i class="fas fa-tachometer-alt"></i> 系统概览</h2>
                
                <!-- 统计卡片 -->
                <div class="row mb-4">
                    <div class="col-md-3">
                        <div class="card stat-card">
                            <div class="card-body">
                                <div class="stat-number text-primary" th:text="${totalOrders}">0</div>
                                <div class="stat-label">总订单数</div>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="card stat-card">
                            <div class="card-body">
                                <div class="stat-number text-warning" th:text="${pendingOrders}">0</div>
                                <div class="stat-label">待处理订单</div>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="card stat-card">
                            <div class="card-body">
                                <div class="stat-number text-info" th:text="${shippingOrders}">0</div>
                                <div class="stat-label">运输中</div>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="card stat-card">
                            <div class="card-body">
                                <div class="stat-number text-success" th:text="${totalCustomers}">0</div>
                                <div class="stat-label">客户总数</div>
                            </div>
                        </div>
                    </div>
                </div>
                
                <!-- 最近订单 -->
                <div class="card">
                    <div class="card-header">
                        <h5><i class="fas fa-clock"></i> 最近订单</h5>
                    </div>
                    <div class="card-body">
                        <div th:if="${#lists.isEmpty(recentOrders)}" class="text-center text-muted py-4">
                            暂无订单数据，请先<a href="/test/generate">生成测试数据</a>
                        </div>
                        <div th:unless="${#lists.isEmpty(recentOrders)}">
                            <table class="table table-hover">
                                <thead>
                                    <tr>
                                        <th>订单号</th>
                                        <th>客户</th>
                                        <th>金额</th>
                                        <th>状态</th>
                                        <th>创建时间</th>
                                        <th>操作</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="order : ${recentOrders}">
                                        <td th:text="${order.orderNo}"></td>
                                        <td th:text="${order.customer.name}"></td>
                                        <td th:text="${#numbers.formatCurrency(order.totalAmount)}"></td>
                                        <td>
                                            <span class="badge" 
                                                  th:class="${order.status.name() == 'DELIVERED'} ? 'badge-success' : 
                                                                      (${order.status.name() == 'CANCELLED'} ? 'badge-secondary' : 'badge-primary')"
                                                  th:text="${order.status.description}"></span>
                                        </td>
                                        <td th:text="${#temporals.format(order.createTime, 'yyyy-MM-dd HH:mm')}"></td>
                                        <td>
                                            <a th:href="@{/orders/{id}(id=${order.id})}" class="btn btn-sm btn-info">
                                                <i class="fas fa-eye"></i> 查看
                                            </a>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
                
                <!-- 快捷操作 -->
                <div class="card">
                    <div class="card-header">
                        <h5><i class="fas fa-bolt"></i> 快捷操作</h5>
                    </div>
                    <div class="card-body">
                        <div class="row">
                            <div class="col-md-3 mb-2">
                                <a href="/orders/new" class="btn btn-primary btn-block">
                                    <i class="fas fa-plus"></i> 新建订单
                                </a>
                            </div>
                            <div class="col-md-3 mb-2">
                                <a href="/customers/new" class="btn btn-success btn-block">
                                    <i class="fas fa-user-plus"></i> 新增客户
                                </a>
                            </div>
                            <div class="col-md-3 mb-2">
                                <a href="/products/new" class="btn btn-info btn-block">
                                    <i class="fas fa-box"></i> 新增产品
                                </a>
                            </div>
                            <div class="col-md-3 mb-2">
                                <a href="/price-strategies/calculate" class="btn btn-warning btn-block">
                                    <i class="fas fa-calculator"></i> 价格计算
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/jquery@3.6.0/dist/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
