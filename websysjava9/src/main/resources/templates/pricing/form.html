<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/header::head(${strategy.id == null} ? '新增价格策略' : '编辑价格策略')">
    <style>
        .price-type-fields {
            display: none;
        }
    </style>
</head>
<body>
<div th:replace="fragments/navbar::navbar"></div>

<div class="container-fluid">
    <div class="row">
        <div class="col-md-2 px-0">
            <div th:replace="fragments/sidebar::sidebar('pricing')"></div>
        </div>
        <div class="col-md-10">
            <div class="main-content">
                <h2 class="mb-4">
                    <i class="fas fa-tag"></i>
                    <span th:text="${strategy.id == null} ? '新增价格策略' : '编辑价格策略'"></span>
                </h2>
                
                <div class="card">
                    <div class="card-body">
                        <form th:action="@{/price-strategies}" th:object="${strategy}" method="post">
                            <input type="hidden" th:field="*{id}">
                            
                            <div class="form-row">
                                <div class="form-group col-md-6">
                                    <label>策略名称 <span class="text-danger">*</span></label>
                                    <input type="text" th:field="*{name}" class="form-control" required>
                                </div>
                                <div class="form-group col-md-6">
                                    <label>优先级 <small class="text-muted">（数值越大优先级越高）</small></label>
                                    <input type="number" th:field="*{priority}" class="form-control" min="0" value="0">
                                </div>
                            </div>
                            
                            <hr>
                            <h5>适用范围</h5>
                            
                            <div class="form-row">
                                <div class="form-group col-md-6">
                                    <label>适用产品 <small class="text-muted">（不选则适用于全部产品）</small></label>
                                    <select th:field="*{product.id}" class="form-control">
                                        <option value="">全部产品</option>
                                        <option th:each="p : ${products}" 
                                                th:value="${p.id}"
                                                th:text="${p.code + ' - ' + p.name}"></option>
                                    </select>
                                </div>
                                <div class="form-group col-md-6">
                                    <label>适用区域 <small class="text-muted">（不选则全国通用）</small></label>
                                    <input type="text" th:field="*{region}" class="form-control" placeholder="如：浙江省、广东省">
                                </div>
                            </div>
                            
                            <div class="form-row">
                                <div class="form-group col-md-4">
                                    <label>指定客户 <small class="text-muted">（优先级最高）</small></label>
                                    <select th:field="*{customer.id}" class="form-control">
                                        <option value="">不指定</option>
                                        <option th:each="c : ${customers}" 
                                                th:value="${c.id}"
                                                th:text="${c.code + ' - ' + c.name}"></option>
                                    </select>
                                </div>
                                <div class="form-group col-md-4">
                                    <label>客户等级</label>
                                    <select th:field="*{customerLevel}" class="form-control">
                                        <option value="">不限制</option>
                                        <option th:each="level : ${customerLevels}" 
                                                th:value="${level.name()}"
                                                th:text="${level.description}"></option>
                                    </select>
                                </div>
                                <div class="form-group col-md-4">
                                    <label>客户类型</label>
                                    <select th:field="*{customerType}" class="form-control">
                                        <option value="">不限制</option>
                                        <option th:each="type : ${customerTypes}" 
                                                th:value="${type.name()}"
                                                th:text="${type.description}"></option>
                                    </select>
                                </div>
                            </div>
                            
                            <div class="form-group">
                                <label>最小起订量 <small class="text-muted">（达到该数量才适用此策略）</small></label>
                                <input type="number" th:field="*{minQuantity}" class="form-control" min="1" placeholder="留空则不限制">
                            </div>
                            
                            <hr>
                            <h5>价格设置</h5>
                            
                            <div class="form-row">
                                <div class="form-group col-md-4">
                                    <label>价格类型 <span class="text-danger">*</span></label>
                                    <select th:field="*{priceType}" class="form-control" id="priceTypeSelect" required>
                                        <option th:each="type : ${priceTypes}" 
                                                th:value="${type.name()}"
                                                th:text="${type.description}"></option>
                                    </select>
                                </div>
                                <div class="form-group col-md-4 price-type-fields" id="fixedPriceField">
                                    <label>固定价格 <span class="text-danger">*</span></label>
                                    <input type="number" th:field="*{fixedPrice}" class="form-control" step="0.01" min="0">
                                </div>
                                <div class="form-group col-md-4 price-type-fields" id="discountField">
                                    <label>折扣比例 <small class="text-muted">（0.9表示9折）</small><span class="text-danger">*</span></label>
                                    <input type="number" th:field="*{discountRate}" class="form-control" step="0.01" min="0" max="1" placeholder="0.9">
                                </div>
                            </div>
                            
                            <div class="form-group">
                                <label>策略说明</label>
                                <textarea th:field="*{description}" class="form-control" rows="3"></textarea>
                            </div>
                            
                            <div class="form-group">
                                <div class="custom-control custom-checkbox">
                                    <input type="checkbox" th:field="*{active}" class="custom-control-input" id="active">
                                    <label class="custom-control-label" for="active">启用该策略</label>
                                </div>
                            </div>
                            
                            <div class="form-group">
                                <button type="submit" class="btn btn-primary">
                                    <i class="fas fa-save"></i> 保存
                                </button>
                                <a href="/price-strategies" class="btn btn-secondary">
                                    <i class="fas fa-undo"></i> 取消
                                </a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/jquery@3.6.0/dist/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
    function updatePriceFields() {
        var type = $('#priceTypeSelect').val();
        if (type === 'FIXED') {
            $('#fixedPriceField').show();
            $('#discountField').hide();
        } else if (type === 'DISCOUNT') {
            $('#fixedPriceField').hide();
            $('#discountField').show();
        }
    }
    
    $(function() {
        updatePriceFields();
        $('#priceTypeSelect').change(updatePriceFields);
    });
</script>
</body>
</html>
