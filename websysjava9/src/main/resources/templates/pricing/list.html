<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/header::head('价格策略')"></head>
<body>
<div th:replace="fragments/navbar::navbar"></div>

<div class="container-fluid">
    <div class="row">
        <div class="col-md-2 px-0">
            <div th:replace="fragments/sidebar::sidebar('pricing')"></div>
        </div>
        <div class="col-md-10">
            <div class="main-content">
                <div th:replace="fragments/alerts::alerts"></div>
                
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h2><i class="fas fa-tags"></i> 价格策略管理</h2>
                    <div>
                        <a href="/price-strategies/calculate" class="btn btn-warning mr-2">
                            <i class="fas fa-calculator"></i> 价格计算
                        </a>
                        <a href="/price-strategies/new" class="btn btn-primary">
                            <i class="fas fa-plus"></i> 新增策略
                        </a>
                    </div>
                </div>
                
                <!-- 策略列表 -->
                <div class="card">
                    <div class="card-body">
                        <div th:if="${#lists.isEmpty(strategies)}" class="text-center text-muted py-4">
                            暂无价格策略
                        </div>
                        <div th:unless="${#lists.isEmpty(strategies)}">
                            <table class="table table-hover">
                                <thead>
                                    <tr>
                                        <th>策略名称</th>
                                        <th>产品</th>
                                        <th>客户</th>
                                        <th>类型</th>
                                        <th>价格/折扣</th>
                                        <th>区域</th>
                                        <th>优先级</th>
                                        <th>状态</th>
                                        <th>操作</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="strategy : ${strategies}">
                                        <td th:text="${strategy.name}"></td>
                                        <td th:text="${strategy.product != null ? strategy.product.name : '全部产品'}"></td>
                                        <td>
                                            <span th:if="${strategy.customer != null}" th:text="${strategy.customer.name}"></span>
                                            <span th:if="${strategy.customer == null and strategy.customerLevel != null}"
                                                  th:text="${strategy.customerLevel.description + '客户'}"></span>
                                            <span th:if="${strategy.customer == null and strategy.customerType != null and strategy.customerLevel == null}"
                                                  th:text="${strategy.customerType.description}"></span>
                                            <span th:if="${strategy.customer == null and strategy.customerType == null and strategy.customerLevel == null}">
                                                全部客户
                                            </span>
                                        </td>
                                        <td th:text="${strategy.priceType.description}"></td>
                                        <td>
                                            <span th:if="${strategy.priceType.name() == 'FIXED'}"
                                                  th:text="${#numbers.formatCurrency(strategy.fixedPrice)}"></span>
                                            <span th:if="${strategy.priceType.name() == 'DISCOUNT'}"
                                                  th:text="${(strategy.discountRate.multiply(new java.math.BigDecimal(100))).intValue() + '%折扣'}"></span>
                                        </td>
                                        <td th:text="${strategy.region != null ? strategy.region : '全国'}"></td>
                                        <td>
                                            <span class="badge badge-info" th:text="${strategy.priority}"></span>
                                        </td>
                                        <td>
                                            <span class="badge" 
                                                  th:class="${strategy.active} ? 'badge-success' : 'badge-secondary'"
                                                  th:text="${strategy.active} ? '启用' : '禁用'"></span>
                                        </td>
                                        <td>
                                            <div class="btn-group btn-group-sm">
                                                <a th:href="@{/price-strategies/{id}(id=${strategy.id})}" class="btn btn-info" title="查看">
                                                    <i class="fas fa-eye"></i>
                                                </a>
                                                <a th:href="@{/price-strategies/{id}/edit(id=${strategy.id})}" class="btn btn-warning" title="编辑">
                                                    <i class="fas fa-edit"></i>
                                                </a>
                                                <form th:action="@{/price-strategies/{id}/delete(id=${strategy.id})}" method="post"
                                                      th:onsubmit="'return confirm(\'确定删除此策略？\')'">
                                                    <button type="submit" class="btn btn-danger" title="删除">
                                                        <i class="fas fa-trash"></i>
                                                    </button>
                                                </form>
                                            </div>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                        <div th:replace="fragments/pagination::pagination(${page}, '/price-strategies')"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/jquery@3.6.0/dist/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
