server:
  port: 8080

spring:
  application:
    name: psyconsult-backend

  datasource:
    url: jdbc:h2:mem:psyconsultdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect

  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      timeout: 3000
      lettuce:
        pool:
          max-active: 8
          max-wait: -1
          max-idle: 8
          min-idle: 0

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
  packages-to-scan: com.psyconsult.controller
  paths-to-match: /api/**

jwt:
  secret: PsyConsultSecretKeyForJWTTokenGeneration2024VeryLongSecretKey
  expiration: 86400000

logging:
  level:
    com.psyconsult: DEBUG
    org.springframework.security: DEBUG
