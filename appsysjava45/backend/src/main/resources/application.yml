spring:
  application:
    name: flower-shop

  datasource:
    url: jdbc:h2:mem:flower_shop;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.H2Dialect

  redis:
    host: localhost
    port: 6379
    database: 0
    timeout: 3000ms

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  jwt:
    secret: flower-shop-secret-key-2024-very-long-secret-key-for-jwt-token
    expiration: 86400000

server:
  port: 8080
  servlet:
    context-path: /api