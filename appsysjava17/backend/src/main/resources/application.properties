# 服务器配置
server.port=8080

# 应用配置
spring.application.name=seed-trace-system

# H2 数据库配置
spring.datasource.url=jdbc:h2:mem:seeddb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 控制台配置
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA 配置
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# SQL 初始化配置
spring.sql.init.mode=always
spring.sql.init.platform=h2
spring.sql.init.continue-on-error=true
spring.jpa.defer-datasource-initialization=true

# Swagger 配置
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

# AES 加密配置
app.encryption.key=SeedTraceSystemSecretKey2024!
app.encryption.iv=SeedTraceInitIV
