server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: medical-appointment-system
  
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  
  datasource:
    url: jdbc:h2:file:./data/medicaldb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  
  h2:
    console:
      enabled: true
      path: /h2-console
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.H2Dialect

  security:
    user:
      name: admin
      password: admin123

jwt:
  secret: MedicalAppointmentSystemSecretKeyForJwtToken2024
  expiration: 86400000
  header: Authorization
  prefix: Bearer 

logging:
  level:
    com.medical: DEBUG
    org.springframework.security: INFO

app:
  encryption:
    sm4-key: 0123456789ABCDEFFEDCBA9876543210
  sms:
    mock: true
  wechat:
    mock: true
  audit:
    retention-days: 180
