server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: club-management

  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:clubdb;DB_CLOSE_DELAY=-1;MODE=MySQL
    username: sa
    password:
    schema: classpath:schema.sql
    data: classpath:data.sql
    initialization-mode: always

  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true

  redis:
    host: localhost
    port: 6379
    password:
    database: 0
    timeout: 3000ms
    lettuce:
      pool:
        max-active: 8
        max-wait: -1ms
        max-idle: 8
        min-idle: 0

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.club.management.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

jwt:
  secret: club-management-secret-key-2024-abcdefghijklmnopqrstuvwxyz
  expiration: 604800000
  header: Authorization

swagger:
  enable: true
  title: 大学生社团管理系统API
  description: 大学生社团管理系统后端接口文档
  version: 1.0.0
  base-package: com.club.management.controller

logging:
  level:
    com.club.management: debug
    org.springframework.web: info
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/club-management.log
    max-size: 10MB
    max-history: 30
