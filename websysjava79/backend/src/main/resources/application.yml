server:
  port: 8080

spring:
  application:
    name: music-platform

  datasource:
    url: jdbc:h2:mem:musicdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect

  redis:
    host: localhost
    port: 6379
    database: 0
    timeout: 3000ms

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

jwt:
  secret: musicplatform_secret_key_for_jwt_token_generation_2024
  expiration: 86400000

logging:
  level:
    com.musicplatform: DEBUG
    org.springframework.security: DEBUG
