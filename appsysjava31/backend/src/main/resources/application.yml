server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: hospital-appointment-system
  datasource:
    url: jdbc:h2:mem:hospitaldb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect

jwt:
  secret: hospitalAppointmentSystemSecretKeyForJwtTokenGeneration2024
  expiration: 86400000

encryption:
  sm4:
    key: hospitalSystemSm4SecretKey1234567890

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

logging:
  level:
    com.hospital: DEBUG
    org.springframework.security: DEBUG
