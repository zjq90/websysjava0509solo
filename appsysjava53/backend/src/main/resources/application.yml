server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: heritage-collection

  datasource:
    url: jdbc:h2:file:./data/heritage_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect

  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-wait: -1ms
          max-idle: 8
          min-idle: 0

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

rsa:
  private-key: classpath:rsa/private_key.pem
  public-key: classpath:rsa/public_key.pem

logging:
  level:
    com.heritage: debug
    org.springframework.data.redis: debug
