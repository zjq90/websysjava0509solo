<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>统计项管理 - Web平台管理系统</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@5.15.4/css/all.min.css">
    <style>
        body { padding-top: 56px; }
        .sidebar { min-height: calc(100vh - 56px); }
        .color-preview { width: 20px; height: 20px; border-radius: 4px; display: inline-block; }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-primary fixed-top">
    <a class="navbar-brand" href="index.html">
        <i class="fas fa-chart-line mr-2"></i>Web平台管理系统
    </a>
</nav>

<div class="container-fluid">
    <div class="row">
        <nav class="col-md-2 d-none d-md-block bg-light sidebar">
            <div class="sidebar-sticky pt-3">
                <ul class="nav flex-column">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">
                            <i class="fas fa-home mr-2"></i>首页
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="dashboard-config.html">
                            <i class="fas fa-cog mr-2"></i>看板配置
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="mobile-dashboard.html">
                            <i class="fas fa-mobile-alt mr-2"></i>移动端看板
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="stat-items.html">
                            <i class="fas fa-list mr-2"></i>统计项管理
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="business-data.html">
                            <i class="fas fa-database mr-2"></i>经营数据
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="users.html">
                            <i class="fas fa-users mr-2"></i>用户管理
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="test-tools.html">
                            <i class="fas fa-flask mr-2"></i>测试工具
                        </a>
                    </li>
                </ul>
            </div>
        </nav>

        <main role="main" class="col-md-9 ml-sm-auto col-lg-10 px-4 pt-4">
            <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pb-2 mb-3 border-bottom">
                <h1 class="h2"><i class="fas fa-list text-primary mr-2"></i>统计项管理</h1>
                <button class="btn btn-primary" data-toggle="modal" data-target="#editModal" onclick="openAddModal()">
                    <i class="fas fa-plus mr-1"></i> 新增统计项
                </button>
            </div>

            <div class="table-responsive">
                <table class="table table-striped table-hover">
                    <thead class="thead-dark">
                        <tr>
                            <th>ID</th>
                            <th>编码</th>
                            <th>名称</th>
                            <th>类型</th>
                            <th>图标</th>
                            <th>颜色</th>
                            <th>默认</th>
                            <th>排序</th>
                            <th>状态</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="statItemTableBody">
                    </tbody>
                </table>
            </div>
        </main>
    </div>
</div>

<div class="modal fade" id="editModal" tabindex="-1" role="dialog">
    <div class="modal-dialog" role="document">
        <div class="modal-content">
            <form id="editForm">
                <input type="hidden" id="formId">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalTitle">新增统计项</h5>
                    <button type="button" class="close" data-dismiss="modal">
                        <span>&times;</span>
                    </button>
                </div>
                <div class="modal-body">
                    <div class="form-group">
                        <label>统计项编码 <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="formItemCode" required>
                    </div>
                    <div class="form-group">
                        <label>统计项名称 <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="formItemName" required>
                    </div>
                    <div class="form-row">
                        <div class="form-group col-md-6">
                            <label>数据类型</label>
                            <select class="form-control" id="formItemType">
                                <option value="amount">金额</option>
                                <option value="count">数量</option>
                                <option value="percent">百分比</option>
                                <option value="text">文本</option>
                            </select>
                        </div>
                        <div class="form-group col-md-6">
                            <label>单位</label>
                            <input type="text" class="form-control" id="formUnit" placeholder="如：元、单、%">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group col-md-6">
                            <label>图标 (FontAwesome类名)</label>
                            <input type="text" class="form-control" id="formIcon" placeholder="如：fa-money">
                        </div>
                        <div class="form-group col-md-6">
                            <label>颜色</label>
                            <input type="color" class="form-control" id="formColor" value="#28a745">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group col-md-6">
                            <label>排序</label>
                            <input type="number" class="form-control" id="formSortOrder" value="0">
                        </div>
                        <div class="form-group col-md-6">
                            <label>状态</label>
                            <select class="form-control" id="formStatus">
                                <option value="1">启用</option>
                                <option value="0">禁用</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-group">
                        <div class="custom-control custom-checkbox">
                            <input type="checkbox" class="custom-control-input" id="formIsDefault">
                            <label class="custom-control-label" for="formIsDefault">默认显示</label>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>描述</label>
                        <textarea class="form-control" id="formDescription" rows="2"></textarea>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-dismiss="modal">取消</button>
                    <button type="submit" class="btn btn-primary">保存</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/jquery@3.6.4/dist/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/validation.js"></script>
<script>
    const API_BASE = '/api';

    function loadData() {
        $.ajax({
            url: `${API_BASE}/stat-items`,
            method: 'GET',
            success: function(res) {
                renderTable(res.data || []);
            }
        });
    }

    function renderTable(items) {
        const $tbody = $('#statItemTableBody');
        $tbody.empty();

        items.forEach(item => {
            const tr = `
                <tr>
                    <td>${item.id}</td>
                    <td><code>${item.itemCode}</code></td>
                    <td>${item.itemName}</td>
                    <td>${getTypeLabel(item.itemType)}</td>
                    <td><i class="${item.icon || 'fas fa-chart-bar'}"></i></td>
                    <td><span class="color-preview" style="background:${item.color || '#6c757d'}"></span></td>
                    <td>${item.isDefault ? '<span class="badge badge-success">是</span>' : '<span class="badge badge-secondary">否</span>'}</td>
                    <td>${item.sortOrder}</td>
                    <td>${item.status === 1 ? '<span class="badge badge-success">启用</span>' : '<span class="badge badge-danger">禁用</span>'}</td>
                    <td>
                        <button class="btn btn-sm btn-primary" onclick="openEditModal(${item.id})">
                            <i class="fas fa-edit"></i>
                        </button>
                        <button class="btn btn-sm btn-danger" onclick="deleteItem(${item.id})">
                            <i class="fas fa-trash"></i>
                        </button>
                    </td>
                </tr>
            `;
            $tbody.append(tr);
        });
    }

    function getTypeLabel(type) {
        const labels = { amount: '金额', count: '数量', percent: '百分比', text: '文本' };
        return labels[type] || type;
    }

    function clearFormValidation() {
        $('#editForm').find('.is-invalid, .is-valid').removeClass('is-invalid is-valid');
        $('#editForm').find('.invalid-feedback').remove();
    }

    function openAddModal() {
        clearFormValidation();
        $('#modalTitle').text('新增统计项');
        $('#editForm')[0].reset();
        $('#formId').val('');
        $('#formColor').val('#28a745');
    }

    function openEditModal(id) {
        clearFormValidation();
        $.ajax({
            url: `${API_BASE}/stat-items/${id}`,
            method: 'GET',
            success: function(res) {
                if (res.code === 200) {
                    const item = res.data;
                    $('#modalTitle').text('编辑统计项');
                    $('#formId').val(item.id);
                    $('#formItemCode').val(item.itemCode);
                    $('#formItemName').val(item.itemName);
                    $('#formItemType').val(item.itemType);
                    $('#formUnit').val(item.unit || '');
                    $('#formIcon').val(item.icon || '');
                    $('#formColor').val(item.color || '#28a745');
                    $('#formSortOrder').val(item.sortOrder);
                    $('#formStatus').val(item.status);
                    $('#formIsDefault').prop('checked', item.isDefault);
                    $('#formDescription').val(item.description || '');
                    $('#editModal').modal('show');
                }
            }
        });
    }

    function validateStatItemForm() {
        const id = $('#formId').val();
        
        const itemCode = $('#formItemCode').val();
        const itemName = $('#formItemName').val();
        const color = $('#formColor').val();
        const sortOrder = $('#formSortOrder').val();

        clearFormValidation();
        let isValid = true;

        const codeResult = Validation.validateItemCode(itemCode, { required: true });
        if (!codeResult.valid) {
            Validation.showError($('#formItemCode'), codeResult.message);
            isValid = false;
        } else {
            Validation.showSuccess($('#formItemCode'));
        }

        if (!itemName || itemName.trim().length < 2 || itemName.trim().length > 100) {
            Validation.showError($('#formItemName'), '统计项名称长度必须在2-100个字符之间');
            isValid = false;
        } else {
            Validation.showSuccess($('#formItemName'));
        }

        if (color) {
            const colorResult = Validation.validateColor(color, { required: false });
            if (!colorResult.valid) {
                Validation.showError($('#formColor'), colorResult.message);
                isValid = false;
            } else {
                Validation.showSuccess($('#formColor'));
            }
        }

        if (sortOrder !== '' && (parseInt(sortOrder) < 0 || isNaN(parseInt(sortOrder)))) {
            Validation.showError($('#formSortOrder'), '排序值不能为负数');
            isValid = false;
        } else if (sortOrder !== '') {
            Validation.showSuccess($('#formSortOrder'));
        }

        return isValid;
    }

    function saveItem() {
        if (!validateStatItemForm()) {
            return;
        }

        const data = {
            itemCode: $('#formItemCode').val(),
            itemName: $('#formItemName').val(),
            itemType: $('#formItemType').val(),
            unit: $('#formUnit').val(),
            icon: $('#formIcon').val(),
            color: $('#formColor').val(),
            sortOrder: parseInt($('#formSortOrder').val()) || 0,
            status: parseInt($('#formStatus').val()),
            isDefault: $('#formIsDefault').is(':checked'),
            description: $('#formDescription').val(),
            dataSource: '手动'
        };

        const id = $('#formId').val();
        const method = id ? 'PUT' : 'POST';
        const url = id ? `${API_BASE}/stat-items` : `${API_BASE}/stat-items`;
        if (id) data.id = parseInt(id);

        $.ajax({
            url: url,
            method: method,
            contentType: 'application/json',
            data: JSON.stringify(data),
            success: function(res) {
                if (res.code === 200) {
                    $('#editModal').modal('hide');
                    loadData();
                } else {
                    alert('保存失败: ' + res.message);
                }
            },
            error: function(xhr) {
                try {
                    const err = JSON.parse(xhr.responseText);
                    alert('保存失败: ' + (err.message || '未知错误'));
                } catch(e) {
                    alert('保存失败: 网络错误');
                }
            }
        });
    }

    function deleteItem(id) {
        if (confirm('确定要删除这条记录吗？')) {
            $.ajax({
                url: `${API_BASE}/stat-items/${id}`,
                method: 'DELETE',
                success: function(res) {
                    if (res.code === 200) {
                        loadData();
                    }
                }
            });
        }
    }

    $(document).ready(function() {
        loadData();
        
        $('#editForm').submit(function(e) {
            e.preventDefault();
            saveItem();
        });

        $('#formItemCode').on('blur', function() {
            const result = Validation.validateItemCode($(this).val(), { required: true });
            if (!result.valid) {
                Validation.showError($(this), result.message);
            } else {
                Validation.showSuccess($(this));
            }
        });

        $('#formItemName').on('blur', function() {
            const value = $(this).val();
            if (!value || value.trim().length < 2 || value.trim().length > 100) {
                Validation.showError($(this), '统计项名称长度必须在2-100个字符之间');
            } else {
                Validation.showSuccess($(this));
            }
        });

        $('#formColor').on('change blur', function() {
            const value = $(this).val();
            if (value) {
                const result = Validation.validateColor(value, { required: false });
                if (!result.valid) {
                    Validation.showError($(this), result.message);
                } else {
                    Validation.showSuccess($(this));
                }
            }
        });

        $('#formSortOrder').on('blur', function() {
            const value = $(this).val();
            if (value !== '' && (parseInt(value) < 0 || isNaN(parseInt(value)))) {
                Validation.showError($(this), '排序值不能为负数');
            } else if (value !== '') {
                Validation.showSuccess($(this));
            }
        });
    });
</script>
</body>
</html>
