<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - Web平台管理系统</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@5.15.4/css/all.min.css">
    <style>
        body {
            height: 100vh;
            display: flex;
            align-items: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .login-card {
            border: none;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card login-card">
                <div class="card-body p-5">
                    <div class="text-center mb-4">
                        <i class="fas fa-chart-line fa-4x text-primary mb-3"></i>
                        <h3 class="font-weight-bold">Web平台管理系统</h3>
                        <p class="text-muted">移动端看板集成</p>
                    </div>

                    <form id="loginForm">
                        <div class="form-group">
                            <label class="font-weight-bold">用户名</label>
                            <div class="input-group">
                                <div class="input-group-prepend">
                                    <span class="input-group-text"><i class="fas fa-user"></i></span>
                                </div>
                                <input type="text" class="form-control" id="username" placeholder="请输入用户名" required>
                            </div>
                        </div>

                        <div class="form-group">
                            <label class="font-weight-bold">密码</label>
                            <div class="input-group">
                                <div class="input-group-prepend">
                                    <span class="input-group-text"><i class="fas fa-lock"></i></span>
                                </div>
                                <input type="password" class="form-control" id="password" placeholder="请输入密码" required>
                            </div>
                        </div>

                        <div class="form-group form-check">
                            <input type="checkbox" class="form-check-input" id="remember">
                            <label class="form-check-label" for="remember">记住我</label>
                        </div>

                        <button type="submit" class="btn btn-primary btn-block btn-lg">
                            <i class="fas fa-sign-in-alt mr-2"></i>登录
                        </button>
                    </form>

                    <hr class="my-4">

                    <div class="text-center">
                        <p class="text-muted mb-2">测试账号：</p>
                        <div class="btn-group btn-group-sm">
                            <button class="btn btn-outline-primary" onclick="fillLogin('admin', 'admin123')">管理员</button>
                            <button class="btn btn-outline-info" onclick="fillLogin('manager', 'manager123')">经理</button>
                            <button class="btn btn-outline-warning" onclick="fillLogin('ceo', 'ceo123')">总经理</button>
                        </div>
                    </div>

                    <div class="text-center mt-3">
                        <a href="index.html" class="text-muted">
                            <i class="fas fa-arrow-left mr-1"></i>返回首页
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/jquery@3.6.4/dist/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const API_BASE = '/api';

    function fillLogin(username, password) {
        $('#username').val(username);
        $('#password').val(password);
    }

    $(document).ready(function() {
        $('#loginForm').submit(function(e) {
            e.preventDefault();

            const data = {
                username: $('#username').val(),
                password: $('#password').val()
            };

            $.ajax({
                url: `${API_BASE}/users/login`,
                method: 'POST',
                contentType: 'application/json',
                data: JSON.stringify(data),
                success: function(res) {
                    if (res.code === 200) {
                        localStorage.setItem('user', JSON.stringify(res.data));
                        alert('登录成功！欢迎，' + res.data.realName);
                        window.location.href = 'index.html';
                    } else {
                        alert(res.message);
                    }
                },
                error: function() {
                    alert('登录失败，请稍后重试');
                }
            });
        });
    });
</script>
</body>
</html>
