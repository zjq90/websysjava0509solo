<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>经营数据管理 - Web平台管理系统</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@5.15.4/css/all.min.css">
    <style>
        body { padding-top: 56px; }
        .sidebar { min-height: calc(100vh - 56px); }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-primary fixed-top">
    <a class="navbar-brand" href="index.html">
        <i class="fas fa-chart-line mr-2"></i>Web平台管理系统
    </a>
</nav>

<div class="container-fluid">
    <div class="row">
        <nav class="col-md-2 d-none d-md-block bg-light sidebar">
            <div class="sidebar-sticky pt-3">
                <ul class="nav flex-column">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">
                            <i class="fas fa-home mr-2"></i>首页
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="dashboard-config.html">
                            <i class="fas fa-cog mr-2"></i>看板配置
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="mobile-dashboard.html">
                            <i class="fas fa-mobile-alt mr-2"></i>移动端看板
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="stat-items.html">
                            <i class="fas fa-list mr-2"></i>统计项管理
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="business-data.html">
                            <i class="fas fa-database mr-2"></i>经营数据
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="users.html">
                            <i class="fas fa-users mr-2"></i>用户管理
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="test-tools.html">
                            <i class="fas fa-flask mr-2"></i>测试工具
                        </a>
                    </li>
                </ul>
            </div>
        </nav>

        <main role="main" class="col-md-9 ml-sm-auto col-lg-10 px-4 pt-4">
            <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pb-2 mb-3 border-bottom">
                <h1 class="h2"><i class="fas fa-database text-primary mr-2"></i>经营数据管理</h1>
                <div class="btn-toolbar">
                    <div class="btn-group mr-2">
                        <input type="date" class="form-control" id="searchDate">
                    </div>
                    <button class="btn btn-primary mr-2" onclick="loadData()">
                        <i class="fas fa-search mr-1"></i> 查询
                    </button>
                    <button class="btn btn-success" data-toggle="modal" data-target="#editModal" onclick="openAddModal()">
                        <i class="fas fa-plus mr-1"></i> 新增
                    </button>
                </div>
            </div>

            <div class="table-responsive">
                <table class="table table-striped table-hover">
                    <thead class="thead-dark">
                        <tr>
                            <th>ID</th>
                            <th>统计项编码</th>
                            <th>日期</th>
                            <th>数据值</th>
                            <th>较昨日</th>
                            <th>较上周</th>
                            <th>备注</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="dataTableBody">
                    </tbody>
                </table>
            </div>
        </main>
    </div>
</div>

<div class="modal fade" id="editModal" tabindex="-1" role="dialog">
    <div class="modal-dialog" role="document">
        <div class="modal-content">
            <form id="editForm">
                <input type="hidden" id="formId">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalTitle">新增经营数据</h5>
                    <button type="button" class="close" data-dismiss="modal">
                        <span>&times;</span>
                    </button>
                </div>
                <div class="modal-body">
                    <div class="form-row">
                        <div class="form-group col-md-6">
                            <label>统计项 <span class="text-danger">*</span></label>
                            <select class="form-control" id="formStatCode" required>
                            </select>
                        </div>
                        <div class="form-group col-md-6">
                            <label>日期 <span class="text-danger">*</span></label>
                            <input type="date" class="form-control" id="formDataDate" required>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group col-md-6">
                            <label>数据值 <span class="text-danger">*</span></label>
                            <input type="number" step="0.01" class="form-control" id="formDataValue" required>
                        </div>
                        <div class="form-group col-md-6">
                            <label>数据文本</label>
                            <input type="text" class="form-control" id="formDataText">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group col-md-4">
                            <label>较昨日变化(%)</label>
                            <input type="number" step="0.01" class="form-control" id="formTrendValue">
                        </div>
                        <div class="form-group col-md-4">
                            <label>较上周变化(%)</label>
                            <input type="number" step="0.01" class="form-control" id="formCompareValue">
                        </div>
                        <div class="form-group col-md-4">
                            <label>趋势</label>
                            <select class="form-control" id="formTrendType">
                                <option value="up">上升</option>
                                <option value="down">下降</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>备注</label>
                        <textarea class="form-control" id="formRemark" rows="2"></textarea>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-dismiss="modal">取消</button>
                    <button type="submit" class="btn btn-primary">保存</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/jquery@3.6.4/dist/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const API_BASE = '/api';

    function getToday() {
        const d = new Date();
        return d.toISOString().split('T')[0];
    }

    function loadStatItems() {
        $.ajax({
            url: `${API_BASE}/stat-items/enabled`,
            method: 'GET',
            success: function(res) {
                const items = res.data || [];
                const $select = $('#formStatCode');
                $select.empty();
                items.forEach(item => {
                    $select.append(`<option value="${item.itemCode}">${item.itemName} (${item.itemCode})</option>`);
                });
            }
        });
    }

    function loadData() {
        const date = $('#searchDate').val() || getToday();
        $.ajax({
            url: `${API_BASE}/business-data/date/${date}`,
            method: 'GET',
            success: function(res) {
                renderTable(res.data || []);
            }
        });
    }

    function renderTable(dataList) {
        const $tbody = $('#dataTableBody');
        $tbody.empty();

        if (dataList.length === 0) {
            $tbody.html('<tr><td colspan="8" class="text-center text-muted py-4">暂无数据</td></tr>');
            return;
        }

        dataList.forEach(data => {
            const trendClass = data.trendType === 'up' ? 'text-success' : 'text-danger';
            const trendIcon = data.trendType === 'up' ? 'fa-arrow-up' : 'fa-arrow-down';
            const compareClass = data.compareType === 'up' ? 'text-success' : 'text-danger';
            const compareIcon = data.compareType === 'up' ? 'fa-arrow-up' : 'fa-arrow-down';

            const tr = `
                <tr>
                    <td>${data.id}</td>
                    <td><code>${data.statCode}</code></td>
                    <td>${data.dataDate}</td>
                    <td>${data.dataValue ? data.dataValue.toLocaleString() : '-'}</td>
                    <td class="${trendClass}">
                        <i class="fas ${trendIcon} mr-1"></i>${data.trendValue || 0}%
                    </td>
                    <td class="${compareClass}">
                        <i class="fas ${compareIcon} mr-1"></i>${data.compareValue || 0}%
                    </td>
                    <td>${data.remark || '-'}</td>
                    <td>
                        <button class="btn btn-sm btn-danger" onclick="deleteItem(${data.id})">
                            <i class="fas fa-trash"></i>
                        </button>
                    </td>
                </tr>
            `;
            $tbody.append(tr);
        });
    }

    function openAddModal() {
        $('#modalTitle').text('新增经营数据');
        $('#editForm')[0].reset();
        $('#formId').val('');
        $('#formDataDate').val(getToday());
    }

    function saveItem() {
        const data = {
            statCode: $('#formStatCode').val(),
            dataDate: $('#formDataDate').val(),
            dataValue: parseFloat($('#formDataValue').val()),
            dataText: $('#formDataText').val(),
            trendValue: parseFloat($('#formTrendValue').val()) || 0,
            trendType: $('#formTrendType').val(),
            compareValue: parseFloat($('#formCompareValue').val()) || 0,
            compareType: $('#formTrendType').val(),
            remark: $('#formRemark').val()
        };

        $.ajax({
            url: `${API_BASE}/business-data`,
            method: 'POST',
            contentType: 'application/json',
            data: JSON.stringify(data),
            success: function(res) {
                if (res.code === 200) {
                    $('#editModal').modal('hide');
                    loadData();
                } else {
                    alert('保存失败: ' + res.message);
                }
            }
        });
    }

    function deleteItem(id) {
        if (confirm('确定要删除这条记录吗？')) {
            $.ajax({
                url: `${API_BASE}/business-data/${id}`,
                method: 'DELETE',
                success: function(res) {
                    if (res.code === 200) {
                        loadData();
                    }
                }
            });
        }
    }

    $(document).ready(function() {
        $('#searchDate').val(getToday());
        loadStatItems();
        loadData();
        $('#editForm').submit(function(e) {
            e.preventDefault();
            saveItem();
        });
    });
</script>
</body>
</html>
