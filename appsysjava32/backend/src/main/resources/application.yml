server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: hospital-app
  
  # H2 数据库配置
  datasource:
    url: jdbc:h2:mem:hospitaldb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  
  # JPA 配置
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect
  
  # H2 控制台
  h2:
    console:
      enabled: true
      path: /h2-console
  
  # 文件上传
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

# JWT 配置
jwt:
  secret: hospitalAppSecretKeyForJwtToken2024SpringBootApplication
  expiration: 86400000

# 日志配置
logging:
  level:
    root: INFO
    com.hospital: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# 审计日志保留天数
audit:
  retention-days: 180
