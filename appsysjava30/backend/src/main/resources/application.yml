server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: registration-system
  datasource:
    url: jdbc:h2:mem:registration;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.H2Dialect

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  jwt:
    secret: medicalRegistrationSystemJwtSecretKey1234567890
    expiration: 86400000
  encryption:
    sm4-key: 1234567890123456
