server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: music-player
  datasource:
    url: jdbc:h2:mem:musicdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 3000
      lettuce:
        pool:
          max-active: 8
          max-wait: -1
          max-idle: 8
          min-idle: 0
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

jwt:
  secret: your-256-bit-secret-key-here-must-be-at-least-32-characters
  expiration: 86400000

music:
  upload-dir: ./uploads/music
  lyrics-dir: ./uploads/lyrics

download:
  free-limit: 5
  premium-limit: 100
