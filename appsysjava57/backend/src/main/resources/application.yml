server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: pet-hospital-app

  datasource:
    url: jdbc:h2:mem:pethospital;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: 

  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect

  redis:
    host: localhost
    port: 6379
    database: 0
    timeout: 3000
    lettuce:
      pool:
        max-active: 8
        max-wait: -1
        max-idle: 8
        min-idle: 0

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
  packages-to-scan: com.pethospital.controller
  paths-to-match: /**

jwt:
  secret: pet-hospital-secret-key-2024-very-long-and-secure-key-for-jwt-token-generation
  expiration: 86400000

logging:
  level:
    com.pethospital: DEBUG
    org.springframework.web: INFO
