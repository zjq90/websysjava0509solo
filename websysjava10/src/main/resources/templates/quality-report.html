<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>质检报告管理</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css">
    <style>
        body { min-height: 100vh; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
        .sidebar { min-height: 100vh; background: #343a40; }
        .sidebar .nav-link { color: #fff; padding: 12px 20px; border-left: 3px solid transparent; }
        .sidebar .nav-link:hover, .sidebar .nav-link.active { background: #495057; border-left-color: #007bff; }
        .sidebar .nav-link i { margin-right: 10px; }
        .content-area { padding: 20px; background: #f8f9fa; min-height: 100vh; }
        .data-card { background: white; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <div class="col-md-2 sidebar p-0">
                <div class="p-4 text-center text-white"><h4><i class="fa fa-leaf"></i> 质量追溯系统</h4></div>
                <nav class="nav flex-column">
                    <a class="nav-link" href="/"><i class="fa fa-home"></i> 首页</a>
                    <a class="nav-link" href="/seed-batch"><i class="fa fa-seedling"></i> 种子批次</a>
                    <a class="nav-link" href="/parent-source"><i class="fa fa-sitemap"></i> 亲本来源</a>
                    <a class="nav-link" href="/field-planting"><i class="fa fa-tree"></i> 田间种植</a>
                    <a class="nav-link" href="/harvest"><i class="fa fa-cutlery"></i> 收获管理</a>
                    <a class="nav-link" href="/processing"><i class="fa fa-cogs"></i> 加工管理</a>
                    <a class="nav-link" href="/packaging"><i class="fa fa-gift"></i> 包装管理</a>
                    <a class="nav-link" href="/sale"><i class="fa fa-shopping-cart"></i> 销售管理</a>
                    <a class="nav-link active" href="/quality-report"><i class="fa fa-file-text"></i> 质检报告</a>
                    <a class="nav-link" href="/traceability"><i class="fa fa-link"></i> 全链追溯</a>
                    <a class="nav-link" href="/qr-code"><i class="fa fa-qrcode"></i> 二维码管理</a>
                    <a class="nav-link" href="/test-data"><i class="fa fa-database"></i> 测试数据</a>
                </nav>
            </div>
            
            <div class="col-md-10 content-area">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h2><i class="fa fa-file-text"></i> 质检报告管理</h2>
                    <button class="btn btn-primary" onclick="openModal()"><i class="fa fa-plus"></i> 新增</button>
                </div>

                <div class="data-card p-4">
                    <div class="table-responsive">
                        <table class="table table-striped table-hover">
                            <thead class="thead-dark">
                                <tr>
                                    <th>报告编号</th>
                                    <th>批次号</th>
                                    <th>检测项目</th>
                                    <th>检测结果</th>
                                    <th>检测机构</th>
                                    <th>检测日期</th>
                                    <th>状态</th>
                                    <th>操作</th>
                                </tr>
                            </thead>
                            <tbody id="dataTable">
                            </tbody>
                        </table>
                    </div>
                    <nav class="mt-3">
                        <ul class="pagination justify-content-center" id="pagination">
                        </ul>
                    </nav>
                    <div class="text-center text-muted mt-2" id="pageInfo"></div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="formModal">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">新增质检报告</h5>
                    <button type="button" class="close" data-dismiss="modal">&times;</button>
                </div>
                <div class="modal-body">
                    <form id="dataForm">
                        <input type="hidden" id="id">
                        <div class="form-row">
                            <div class="form-group col-md-6">
                                <label>报告编号</label>
                                <input type="text" class="form-control" id="reportNo" placeholder="系统自动生成">
                            </div>
                            <div class="form-group col-md-6">
                                <label>批次号 *</label>
                                <select class="form-control" id="batchNo" required>
                                    <option value="">请选择批次</option>
                                </select>
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-group col-md-6">
                                <label>检测日期</label>
                                <input type="date" class="form-control" id="testDate">
                            </div>
                            <div class="form-group col-md-6">
                                <label>检测机构</label>
                                <input type="text" class="form-control" id="testInstitution">
                            </div>
                        </div>
                        <div class="form-group">
                            <label>检测项目</label>
                            <input type="text" class="form-control" id="testItems" placeholder="如：发芽率、纯度、净度、水分等">
                        </div>
                        <div class="form-row">
                            <div class="form-group col-md-3">
                                <label>发芽率(%)</label>
                                <input type="number" class="form-control" id="germinationRate" step="0.01">
                            </div>
                            <div class="form-group col-md-3">
                                <label>纯度(%)</label>
                                <input type="number" class="form-control" id="purity" step="0.01">
                            </div>
                            <div class="form-group col-md-3">
                                <label>净度(%)</label>
                                <input type="number" class="form-control" id="clarity" step="0.01">
                            </div>
                            <div class="form-group col-md-3">
                                <label>水分(%)</label>
                                <input type="number" class="form-control" id="moisture" step="0.01">
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-group col-md-4">
                                <label>千粒重(g)</label>
                                <input type="number" class="form-control" id="thousandGrainWeight" step="0.01">
                            </div>
                            <div class="form-group col-md-4">
                                <label>健康度(%)</label>
                                <input type="number" class="form-control" id="healthDegree" step="0.01">
                            </div>
                            <div class="form-group col-md-4">
                                <label>活力指数</label>
                                <input type="number" class="form-control" id="vigorIndex" step="0.01">
                            </div>
                        </div>
                        <div class="form-group">
                            <label>检测结果</label>
                            <select class="form-control" id="testResult">
                                <option value="合格">合格</option>
                                <option value="不合格">不合格</option>
                                <option value="待复检">待复检</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>报告状态</label>
                            <select class="form-control" id="status">
                                <option value="草稿">草稿</option>
                                <option value="已审核">已审核</option>
                                <option value="已发布">已发布</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>检测员</label>
                            <input type="text" class="form-control" id="tester">
                        </div>
                        <div class="form-group">
                            <label>报告附件URL</label>
                            <input type="text" class="form-control" id="reportFileUrl" placeholder="上传后的文件路径">
                        </div>
                        <div class="form-group">
                            <label>备注</label>
                            <textarea class="form-control" id="remark" rows="2"></textarea>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-dismiss="modal">取消</button>
                    <button type="button" class="btn btn-primary" onclick="saveData()">保存</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/jquery@3.6.4/dist/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        var currentPage = 0;
        var pageSize = 10;
        var totalElements = 0;
        var totalPages = 0;

        $(document).ready(function() {
            loadData();
            loadBatches();
        });

        function loadData() {
            $.get('/api/quality-report', { page: currentPage, size: pageSize }, function(res) {
                var html = '';
                var content = res.data && res.data.content ? res.data.content : [];
                totalElements = res.data && res.data.totalElements ? res.data.totalElements : 0;
                totalPages = res.data && res.data.totalPages ? res.data.totalPages : 1;
                
                if (content.length > 0) {
                    content.forEach(function(item) {
                        var resultClass = item.testResult === '合格' ? 'badge-success' : 'badge-danger';
                        var statusClass = 'badge-secondary';
                        if (item.status === '已发布') statusClass = 'badge-success';
                        else if (item.status === '已审核') statusClass = 'badge-info';
                        
                        html += '<tr>';
                        html += '<td>' + (item.reportNo || '-') + '</td>';
                        html += '<td>' + item.batchNo + '</td>';
                        html += '<td>' + (item.testItems || '-') + '</td>';
                        html += '<td><span class="badge ' + resultClass + '">' + (item.testResult || '-') + '</span></td>';
                        html += '<td>' + (item.testInstitution || '-') + '</td>';
                        html += '<td>' + (item.testDate || '-') + '</td>';
                        html += '<td><span class="badge ' + statusClass + '">' + (item.status || '-') + '</span></td>';
                        html += '<td>';
                        html += '<button class="btn btn-sm btn-warning mr-1" onclick="editData(' + item.id + ')">编辑</button>';
                        html += '<button class="btn btn-sm btn-danger" onclick="deleteData(' + item.id + ')">删除</button>';
                        html += '</td></tr>';
                    });
                } else {
                    html = '<tr><td colspan="8" class="text-center">暂无数据</td></tr>';
                }
                $('#dataTable').html(html);
                renderPagination();
                renderPageInfo();
            });
        }

        function renderPagination() {
            var html = '';
            if (totalPages <= 1) {
                $('#pagination').html('');
                return;
            }
            
            html += '<li class="page-item ' + (currentPage === 0 ? 'disabled' : '') + '"><a class="page-link" href="#" onclick="goToPage(0)">首页</a></li>';
            html += '<li class="page-item ' + (currentPage === 0 ? 'disabled' : '') + '"><a class="page-link" href="#" onclick="goToPage(' + (currentPage - 1) + ')">上一页</a></li>';
            
            var startPage = Math.max(0, currentPage - 2);
            var endPage = Math.min(totalPages - 1, currentPage + 2);
            
            for (var i = startPage; i <= endPage; i++) {
                html += '<li class="page-item ' + (currentPage === i ? 'active' : '') + '"><a class="page-link" href="#" onclick="goToPage(' + i + ')">' + (i + 1) + '</a></li>';
            }
            
            html += '<li class="page-item ' + (currentPage === totalPages - 1 ? 'disabled' : '') + '"><a class="page-link" href="#" onclick="goToPage(' + (currentPage + 1) + ')">下一页</a></li>';
            html += '<li class="page-item ' + (currentPage === totalPages - 1 ? 'disabled' : '') + '"><a class="page-link" href="#" onclick="goToPage(' + (totalPages - 1) + ')">末页</a></li>';
            
            $('#pagination').html(html);
        }

        function renderPageInfo() {
            var info = '共 ' + totalElements + ' 条记录，当前第 ' + (currentPage + 1) + '/' + totalPages + ' 页，每页 ' + pageSize + ' 条';
            $('#pageInfo').text(info);
        }

        function goToPage(page) {
            if (page >= 0 && page < totalPages) {
                currentPage = page;
                loadData();
            }
            return false;
        }

        function loadBatches() {
            $.get('/api/seed-batch/all', function(res) {
                if (res.data && res.data.length > 0) {
                    var options = '<option value="">请选择批次</option>';
                    res.data.forEach(function(item) {
                        options += '<option value="' + item.batchNo + '">' + item.batchNo + ' - ' + item.seedName + '</option>';
                    });
                    $('#batchNo').html(options);
                }
            });
        }

        function openModal() {
            $('#dataForm')[0].reset();
            $('#id').val('');
            $('#formModal').modal('show');
        }

        function editData(id) {
            $.get('/api/quality-report/' + id, function(res) {
                if (res.code === 200) {
                    var item = res.data;
                    $('#id').val(item.id);
                    $('#reportNo').val(item.reportNo);
                    $('#batchNo').val(item.batchNo);
                    $('#testDate').val(item.testDate);
                    $('#testInstitution').val(item.testInstitution);
                    $('#testItems').val(item.testItems);
                    $('#germinationRate').val(item.germinationRate);
                    $('#purity').val(item.purity);
                    $('#clarity').val(item.clarity);
                    $('#moisture').val(item.moisture);
                    $('#thousandGrainWeight').val(item.thousandGrainWeight);
                    $('#healthDegree').val(item.healthDegree);
                    $('#vigorIndex').val(item.vigorIndex);
                    $('#testResult').val(item.testResult);
                    $('#status').val(item.status);
                    $('#tester').val(item.tester);
                    $('#reportFileUrl').val(item.reportFileUrl);
                    $('#remark').val(item.remark);
                    $('#formModal').modal('show');
                }
            });
        }

        function saveData() {
            var data = {
                id: $('#id').val() ? parseInt($('#id').val()) : null,
                reportNo: $('#reportNo').val(),
                batchNo: $('#batchNo').val(),
                testDate: $('#testDate').val(),
                testInstitution: $('#testInstitution').val(),
                testItems: $('#testItems').val(),
                germinationRate: $('#germinationRate').val() ? parseFloat($('#germinationRate').val()) : null,
                purity: $('#purity').val() ? parseFloat($('#purity').val()) : null,
                clarity: $('#clarity').val() ? parseFloat($('#clarity').val()) : null,
                moisture: $('#moisture').val() ? parseFloat($('#moisture').val()) : null,
                thousandGrainWeight: $('#thousandGrainWeight').val() ? parseFloat($('#thousandGrainWeight').val()) : null,
                healthDegree: $('#healthDegree').val() ? parseFloat($('#healthDegree').val()) : null,
                vigorIndex: $('#vigorIndex').val() ? parseFloat($('#vigorIndex').val()) : null,
                testResult: $('#testResult').val(),
                status: $('#status').val(),
                tester: $('#tester').val(),
                reportFileUrl: $('#reportFileUrl').val(),
                remark: $('#remark').val()
            };

            if (!data.batchNo) {
                alert('请选择批次号');
                return;
            }

            var method = data.id ? 'PUT' : 'POST';

            $.ajax({
                url: '/api/quality-report',
                type: method,
                contentType: 'application/json',
                data: JSON.stringify(data),
                success: function(res) {
                    if (res.code === 200) {
                        alert('保存成功');
                        $('#formModal').modal('hide');
                        loadData();
                    } else {
                        alert(res.message || '保存失败');
                    }
                }
            });
        }

        function deleteData(id) {
            if (confirm('确定要删除吗？')) {
                $.ajax({
                    url: '/api/quality-report/' + id,
                    type: 'DELETE',
                    success: function(res) {
                        if (res.code === 200) {
                            alert('删除成功');
                            loadData();
                        } else {
                            alert('删除失败');
                        }
                    }
                });
            }
        }
    </script>
</body>
</html>
