<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>包装管理</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css">
    <style>
        body { min-height: 100vh; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
        .sidebar { min-height: 100vh; background: #343a40; }
        .sidebar .nav-link { color: #fff; padding: 12px 20px; border-left: 3px solid transparent; }
        .sidebar .nav-link:hover, .sidebar .nav-link.active { background: #495057; border-left-color: #007bff; }
        .sidebar .nav-link i { margin-right: 10px; }
        .content-area { padding: 20px; background: #f8f9fa; min-height: 100vh; }
        .data-card { background: white; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <div class="col-md-2 sidebar p-0">
                <div class="p-4 text-center text-white"><h4><i class="fa fa-leaf"></i> 质量追溯系统</h4></div>
                <nav class="nav flex-column">
                    <a class="nav-link" href="/"><i class="fa fa-home"></i> 首页</a>
                    <a class="nav-link" href="/seed-batch"><i class="fa fa-seedling"></i> 种子批次</a>
                    <a class="nav-link" href="/parent-source"><i class="fa fa-sitemap"></i> 亲本来源</a>
                    <a class="nav-link" href="/field-planting"><i class="fa fa-tree"></i> 田间种植</a>
                    <a class="nav-link" href="/harvest"><i class="fa fa-cutlery"></i> 收获管理</a>
                    <a class="nav-link" href="/processing"><i class="fa fa-cogs"></i> 加工管理</a>
                    <a class="nav-link active" href="/packaging"><i class="fa fa-gift"></i> 包装管理</a>
                    <a class="nav-link" href="/sale"><i class="fa fa-shopping-cart"></i> 销售管理</a>
                    <a class="nav-link" href="/quality-report"><i class="fa fa-file-text"></i> 质检报告</a>
                    <a class="nav-link" href="/traceability"><i class="fa fa-link"></i> 全链追溯</a>
                    <a class="nav-link" href="/qr-code"><i class="fa fa-qrcode"></i> 二维码管理</a>
                    <a class="nav-link" href="/test-data"><i class="fa fa-database"></i> 测试数据</a>
                </nav>
            </div>
            
            <div class="col-md-10 content-area">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h2><i class="fa fa-gift"></i> 包装管理 <small class="text-muted">一袋一码</small></h2>
                    <button class="btn btn-primary" onclick="openModal()"><i class="fa fa-plus"></i> 新增包装</button>
                </div>

                <div class="data-card p-4">
                    <div class="table-responsive">
                        <table class="table table-striped table-hover">
                            <thead class="thead-dark">
                                <tr>
                                    <th>包装号</th>
                                    <th>批次号</th>
                                    <th>二维码</th>
                                    <th>包装类型</th>
                                    <th>规格</th>
                                    <th>净重</th>
                                    <th>状态</th>
                                    <th>操作</th>
                                </tr>
                            </thead>
                            <tbody id="dataTable">
                            </tbody>
                        </table>
                    </div>
                    <nav class="mt-3">
                        <ul class="pagination justify-content-center" id="pagination">
                        </ul>
                    </nav>
                    <div class="text-center text-muted mt-2" id="pageInfo"></div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="formModal">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">新增包装</h5>
                    <button type="button" class="close" data-dismiss="modal">&times;</button>
                </div>
                <div class="modal-body">
                    <form id="dataForm">
                        <input type="hidden" id="id">
                        <div class="form-row">
                            <div class="form-group col-md-6">
                                <label>批次号 *</label>
                                <select class="form-control" id="batchNo" required>
                                    <option value="">请选择批次</option>
                                </select>
                            </div>
                            <div class="form-group col-md-6">
                                <label>包装号</label>
                                <input type="text" class="form-control" id="packageNo" placeholder="系统自动生成">
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-group col-md-6">
                                <label>包装日期</label>
                                <input type="date" class="form-control" id="packagingDate">
                            </div>
                            <div class="form-group col-md-6">
                                <label>包装地点</label>
                                <input type="text" class="form-control" id="packagingLocation">
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-group col-md-4">
                                <label>包装类型</label>
                                <select class="form-control" id="packageType">
                                    <option value="复合袋">复合袋</option>
                                    <option value="编织袋">编织袋</option>
                                    <option value="纸袋">纸袋</option>
                                    <option value="铁罐">铁罐</option>
                                </select>
                            </div>
                            <div class="form-group col-md-4">
                                <label>包装规格</label>
                                <select class="form-control" id="packageSpec">
                                    <option value="1kg/袋">1kg/袋</option>
                                    <option value="5kg/袋">5kg/袋</option>
                                    <option value="10kg/袋">10kg/袋</option>
                                    <option value="25kg/袋">25kg/袋</option>
                                    <option value="50kg/袋">50kg/袋</option>
                                </select>
                            </div>
                            <div class="form-group col-md-4">
                                <label>单位</label>
                                <select class="form-control" id="unit">
                                    <option value="公斤">公斤</option>
                                    <option value="克">克</option>
                                </select>
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-group col-md-6">
                                <label>净重</label>
                                <input type="number" class="form-control" id="netWeight" step="0.01">
                            </div>
                            <div class="form-group col-md-6">
                                <label>包装人</label>
                                <input type="text" class="form-control" id="packagingPerson">
                            </div>
                        </div>
                        <div class="form-group">
                            <label>状态</label>
                            <select class="form-control" id="status">
                                <option value="待包装">待包装</option>
                                <option value="已包装">已包装</option>
                                <option value="待销售">待销售</option>
                                <option value="已销售">已销售</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>备注</label>
                            <textarea class="form-control" id="remark" rows="2"></textarea>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-dismiss="modal">取消</button>
                    <button type="button" class="btn btn-primary" onclick="saveData()">保存</button>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="qrModal">
        <div class="modal-dialog modal-sm">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">二维码</h5>
                    <button type="button" class="close" data-dismiss="modal">&times;</button>
                </div>
                <div class="modal-body text-center">
                    <img id="qrImage" class="img-fluid" alt="二维码">
                    <p class="mt-3" id="qrCodeText"></p>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/jquery@3.6.4/dist/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        var currentPage = 0;
        var pageSize = 10;
        var totalElements = 0;
        var totalPages = 0;

        $(document).ready(function() {
            loadData();
            loadBatches();
        });

        function loadData() {
            $.get('/api/packaging', { page: currentPage, size: pageSize }, function(res) {
                var html = '';
                var content = res.data && res.data.content ? res.data.content : [];
                totalElements = res.data && res.data.totalElements ? res.data.totalElements : 0;
                totalPages = res.data && res.data.totalPages ? res.data.totalPages : 1;
                
                if (content.length > 0) {
                    content.forEach(function(item) {
                        html += '<tr>';
                        html += '<td>' + item.packageNo + '</td>';
                        html += '<td>' + item.batchNo + '</td>';
                        html += '<td><button class="btn btn-sm btn-info" onclick="showQr(\'' + item.qrCode + '\')">查看</button></td>';
                        html += '<td>' + (item.packageType || '-') + '</td>';
                        html += '<td>' + (item.packageSpec || '-') + '</td>';
                        html += '<td>' + (item.netWeight || 0) + ' ' + (item.unit || '') + '</td>';
                        html += '<td><span class="badge badge-success">' + (item.status || '-') + '</span></td>';
                        html += '<td>';
                        html += '<button class="btn btn-sm btn-warning mr-1" onclick="editData(' + item.id + ')">编辑</button>';
                        html += '<button class="btn btn-sm btn-danger" onclick="deleteData(' + item.id + ')">删除</button>';
                        html += '</td></tr>';
                    });
                } else {
                    html = '<tr><td colspan="8" class="text-center">暂无数据</td></tr>';
                }
                $('#dataTable').html(html);
                renderPagination();
                renderPageInfo();
            });
        }

        function renderPagination() {
            var html = '';
            if (totalPages <= 1) {
                $('#pagination').html('');
                return;
            }
            
            html += '<li class="page-item ' + (currentPage === 0 ? 'disabled' : '') + '"><a class="page-link" href="#" onclick="goToPage(0)">首页</a></li>';
            html += '<li class="page-item ' + (currentPage === 0 ? 'disabled' : '') + '"><a class="page-link" href="#" onclick="goToPage(' + (currentPage - 1) + ')">上一页</a></li>';
            
            var startPage = Math.max(0, currentPage - 2);
            var endPage = Math.min(totalPages - 1, currentPage + 2);
            
            for (var i = startPage; i <= endPage; i++) {
                html += '<li class="page-item ' + (currentPage === i ? 'active' : '') + '"><a class="page-link" href="#" onclick="goToPage(' + i + ')">' + (i + 1) + '</a></li>';
            }
            
            html += '<li class="page-item ' + (currentPage === totalPages - 1 ? 'disabled' : '') + '"><a class="page-link" href="#" onclick="goToPage(' + (currentPage + 1) + ')">下一页</a></li>';
            html += '<li class="page-item ' + (currentPage === totalPages - 1 ? 'disabled' : '') + '"><a class="page-link" href="#" onclick="goToPage(' + (totalPages - 1) + ')">末页</a></li>';
            
            $('#pagination').html(html);
        }

        function renderPageInfo() {
            var info = '共 ' + totalElements + ' 条记录，当前第 ' + (currentPage + 1) + '/' + totalPages + ' 页，每页 ' + pageSize + ' 条';
            $('#pageInfo').text(info);
        }

        function goToPage(page) {
            if (page >= 0 && page < totalPages) {
                currentPage = page;
                loadData();
            }
            return false;
        }

        function loadBatches() {
            $.get('/api/seed-batch/all', function(res) {
                if (res.data && res.data.length > 0) {
                    var options = '<option value="">请选择批次</option>';
                    res.data.forEach(function(item) {
                        options += '<option value="' + item.batchNo + '">' + item.batchNo + ' - ' + item.seedName + '</option>';
                    });
                    $('#batchNo').html(options);
                }
            });
        }

        function openModal() {
            $('#dataForm')[0].reset();
            $('#id').val('');
            $('#formModal').modal('show');
        }

        function editData(id) {
            $.get('/api/packaging/' + id, function(res) {
                if (res.code === 200) {
                    var item = res.data;
                    $('#id').val(item.id);
                    $('#batchNo').val(item.batchNo);
                    $('#packageNo').val(item.packageNo);
                    $('#packagingDate').val(item.packagingDate);
                    $('#packagingLocation').val(item.packagingLocation);
                    $('#packageType').val(item.packageType);
                    $('#packageSpec').val(item.packageSpec);
                    $('#unit').val(item.unit);
                    $('#netWeight').val(item.netWeight);
                    $('#packagingPerson').val(item.packagingPerson);
                    $('#status').val(item.status);
                    $('#remark').val(item.remark);
                    $('#formModal').modal('show');
                }
            });
        }

        function showQr(qrCode) {
            $.get('/api/packaging/generate-qr/' + qrCode, function(res) {
                if (res.code === 200) {
                    $('#qrImage').attr('src', res.data);
                    $('#qrCodeText').text('二维码内容: ' + qrCode);
                    $('#qrModal').modal('show');
                }
            });
        }

        function saveData() {
            var data = {
                id: $('#id').val() ? parseInt($('#id').val()) : null,
                batchNo: $('#batchNo').val(),
                packageNo: $('#packageNo').val(),
                packagingDate: $('#packagingDate').val(),
                packagingLocation: $('#packagingLocation').val(),
                packageType: $('#packageType').val(),
                packageSpec: $('#packageSpec').val(),
                netWeight: $('#netWeight').val() ? parseFloat($('#netWeight').val()) : null,
                unit: $('#unit').val(),
                packagingPerson: $('#packagingPerson').val(),
                status: $('#status').val(),
                remark: $('#remark').val()
            };

            if (!data.batchNo) {
                alert('请选择批次号');
                return;
            }

            var method = data.id ? 'PUT' : 'POST';

            $.ajax({
                url: '/api/packaging',
                type: method,
                contentType: 'application/json',
                data: JSON.stringify(data),
                success: function(res) {
                    if (res.code === 200) {
                        alert('保存成功');
                        $('#formModal').modal('hide');
                        loadData();
                    } else {
                        alert(res.message || '保存失败');
                    }
                }
            });
        }

        function deleteData(id) {
            if (confirm('确定要删除吗？')) {
                $.ajax({
                    url: '/api/packaging/' + id,
                    type: 'DELETE',
                    success: function(res) {
                        if (res.code === 200) {
                            alert('删除成功');
                            loadData();
                        } else {
                            alert('删除失败');
                        }
                    }
                });
            }
        }
    </script>
</body>
</html>
