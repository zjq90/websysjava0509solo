<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>全链条追溯</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css">
    <style>
        body { min-height: 100vh; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
        .sidebar { min-height: 100vh; background: #343a40; }
        .sidebar .nav-link { color: #fff; padding: 12px 20px; border-left: 3px solid transparent; }
        .sidebar .nav-link:hover, .sidebar .nav-link.active { background: #495057; border-left-color: #007bff; }
        .sidebar .nav-link i { margin-right: 10px; }
        .content-area { padding: 20px; background: #f8f9fa; min-height: 100vh; }
        .data-card { background: white; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .trace-step { border-left: 3px solid #007bff; padding-left: 20px; margin-bottom: 20px; position: relative; }
        .trace-step:before { content: ''; position: absolute; left: -8px; top: 0; width: 13px; height: 13px; background: #007bff; border-radius: 50%; }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <div class="col-md-2 sidebar p-0">
                <div class="p-4 text-center text-white"><h4><i class="fa fa-leaf"></i> 质量追溯系统</h4></div>
                <nav class="nav flex-column">
                    <a class="nav-link" href="/"><i class="fa fa-home"></i> 首页</a>
                    <a class="nav-link" href="/seed-batch"><i class="fa fa-seedling"></i> 种子批次</a>
                    <a class="nav-link" href="/parent-source"><i class="fa fa-sitemap"></i> 亲本来源</a>
                    <a class="nav-link" href="/field-planting"><i class="fa fa-tree"></i> 田间种植</a>
                    <a class="nav-link" href="/harvest"><i class="fa fa-cutlery"></i> 收获管理</a>
                    <a class="nav-link" href="/processing"><i class="fa fa-cogs"></i> 加工管理</a>
                    <a class="nav-link" href="/packaging"><i class="fa fa-gift"></i> 包装管理</a>
                    <a class="nav-link" href="/sale"><i class="fa fa-shopping-cart"></i> 销售管理</a>
                    <a class="nav-link" href="/quality-report"><i class="fa fa-file-text"></i> 质检报告</a>
                    <a class="nav-link active" href="/traceability"><i class="fa fa-link"></i> 全链追溯</a>
                    <a class="nav-link" href="/qr-code"><i class="fa fa-qrcode"></i> 二维码管理</a>
                    <a class="nav-link" href="/test-data"><i class="fa fa-database"></i> 测试数据</a>
                </nav>
            </div>
            
            <div class="col-md-10 content-area">
                <h2 class="mb-4"><i class="fa fa-link"></i> 全链条追溯查询</h2>

                <div class="data-card p-4 mb-4">
                    <div class="form-row">
                        <div class="form-group col-md-3">
                            <label>查询方式</label>
                            <select class="form-control" id="queryType">
                                <option value="batchNo">批次号</option>
                                <option value="qrCode">二维码</option>
                                <option value="packageNo">包装号</option>
                            </select>
                        </div>
                        <div class="form-group col-md-6">
                            <label>查询内容</label>
                            <input type="text" class="form-control" id="queryValue" placeholder="请输入查询内容">
                        </div>
                        <div class="form-group col-md-3 d-flex align-items-end">
                            <button class="btn btn-primary btn-block" onclick="queryTraceability()">
                                <i class="fa fa-search"></i> 查询
                            </button>
                        </div>
                    </div>
                </div>

                <div id="resultArea" style="display: none;">
                    <div class="data-card p-4 mb-4">
                        <h4><i class="fa fa-info-circle"></i> 种子批次信息</h4>
                        <div id="batchInfo" class="row mt-3"></div>
                    </div>

                    <div class="data-card p-4 mb-4">
                        <h4><i class="fa fa-link"></i> 追溯链条</h4>
                        <div id="traceChain" class="mt-3"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/jquery@3.6.4/dist/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function queryTraceability() {
            var type = $('#queryType').val();
            var value = $('#queryValue').val().trim();
            
            if (!value) {
                alert('请输入查询内容');
                return;
            }

            var url;
            if (type === 'batchNo') {
                url = '/api/traceability/batch-no/' + value;
            } else if (type === 'qrCode') {
                url = '/api/traceability/qr-code/' + value;
            } else if (type === 'packageNo') {
                url = '/api/traceability/package-no/' + value;
            }
            $.get(url, function(res) {
                if (res.code === 200 && res.data) {
                    $('#resultArea').show();
                    renderResult(res.data);
                } else {
                    alert('未找到相关追溯信息');
                    $('#resultArea').hide();
                }
            });
        }

        function renderResult(data) {
            var html = '';
            var seedBatch = data.seedBatch;
            if (seedBatch) {
                html = '<div class="col-md-4"><strong>批次号：</strong>' + (seedBatch.batchNo || '-') + '</div>';
                html += '<div class="col-md-4"><strong>种子名称：</strong>' + (seedBatch.seedName || '-') + '</div>';
                html += '<div class="col-md-4"><strong>品种：</strong>' + (seedBatch.seedVariety || '-') + '</div>';
                html += '<div class="col-md-4"><strong>数量：</strong>' + (seedBatch.quantity || 0) + ' ' + (seedBatch.unit || '') + '</div>';
                html += '<div class="col-md-4"><strong>生产商：</strong>' + (seedBatch.producer || '-') + '</div>';
                html += '<div class="col-md-4"><strong>状态：</strong>' + (seedBatch.status || '-') + '</div>';
            } else if (data.packaging) {
                var packaging = data.packaging;
                html = '<div class="col-md-4"><strong>包装号：</strong>' + (packaging.packageNo || '-') + '</div>';
                html += '<div class="col-md-4"><strong>批次号：</strong>' + (packaging.batchNo || '-') + '</div>';
                html += '<div class="col-md-4"><strong>二维码：</strong>' + (packaging.qrCode || '-') + '</div>';
                html += '<div class="col-md-4"><strong>包装规格：</strong>' + (packaging.packageSpec || '-') + '</div>';
                html += '<div class="col-md-4"><strong>包装日期：</strong>' + (packaging.packagingDate || '-') + '</div>';
                html += '<div class="col-md-4"><strong>状态：</strong>' + (packaging.status || '-') + '</div>';
            }
            $('#batchInfo').html(html);

            var chainHtml = '';
            
            if (data.parentSources && data.parentSources.length > 0) {
                chainHtml += '<div class="trace-step"><h5><i class="fa fa-sitemap"></i> 1. 亲本来源</h5>';
                data.parentSources.forEach(function(item) {
                    chainHtml += '<p>亲本名称：' + (item.parentName || '-') + ' | 来源：' + (item.sourceOrigin || '-') + '</p>';
                });
                chainHtml += '</div>';
            }

            if (data.fieldPlantings && data.fieldPlantings.length > 0) {
                chainHtml += '<div class="trace-step"><h5><i class="fa fa-tree"></i> 2. 田间种植</h5>';
                data.fieldPlantings.forEach(function(item) {
                    chainHtml += '<p>地块：' + (item.fieldName || '-') + ' | 种植日期：' + (item.plantingDate || '-') + '</p>';
                });
                chainHtml += '</div>';
            }

            if (data.harvests && data.harvests.length > 0) {
                chainHtml += '<div class="trace-step"><h5><i class="fa fa-cutlery"></i> 3. 收获</h5>';
                data.harvests.forEach(function(item) {
                    chainHtml += '<p>收获日期：' + (item.harvestDate || '-') + ' | 数量：' + (item.harvestQuantity || 0) + ' ' + (item.unit || '') + '</p>';
                });
                chainHtml += '</div>';
            }

            if (data.processings && data.processings.length > 0) {
                chainHtml += '<div class="trace-step"><h5><i class="fa fa-cogs"></i> 4. 加工</h5>';
                data.processings.forEach(function(item) {
                    chainHtml += '<p>加工日期：' + (item.processingDate || '-') + ' | 类型：' + (item.processingType || '-') + '</p>';
                });
                chainHtml += '</div>';
            }

            if (data.packaging || (data.packagings && data.packagings.length > 0)) {
                chainHtml += '<div class="trace-step"><h5><i class="fa fa-gift"></i> 5. 包装（一袋一码）</h5>';
                var pkgs = data.packaging ? [data.packaging] : (data.packagings || []);
                pkgs.forEach(function(item) {
                    chainHtml += '<p>包装号：' + (item.packageNo || '-') + ' | 二维码：' + (item.qrCode || '-') + '</p>';
                });
                chainHtml += '</div>';
            }

            if (data.sales && data.sales.length > 0) {
                chainHtml += '<div class="trace-step"><h5><i class="fa fa-shopping-cart"></i> 6. 销售</h5>';
                data.sales.forEach(function(item) {
                    chainHtml += '<p>销售单号：' + (item.saleNo || '-') + ' | 客户：' + (item.customerName || '-') + '</p>';
                });
                chainHtml += '</div>';
            }

            if (data.qualityReports && data.qualityReports.length > 0) {
                chainHtml += '<div class="trace-step"><h5><i class="fa fa-file-text"></i> 质检报告</h5>';
                data.qualityReports.forEach(function(item) {
                    var resultClass = item.testResult === '合格' ? 'badge-success' : 'badge-danger';
                    chainHtml += '<p>报告号：' + (item.reportNo || '-') + ' | 结果：<span class="badge ' + resultClass + '">' + (item.testResult || '-') + '</span></p>';
                });
                chainHtml += '</div>';
            }

            if (!chainHtml) {
                chainHtml = '<p class="text-center text-muted">暂无追溯链条数据</p>';
            }

            $('#traceChain').html(chainHtml);
        }
    </script>
</body>
</html>
