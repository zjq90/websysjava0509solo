<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>测试数据生成 - 智能库存管理系统</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        body { background-color: #f8f9fa; }
        .sidebar { min-height: 100vh; background: linear-gradient(180deg, #343a40 0%, #212529 100%); }
        .sidebar a { color: rgba(255,255,255,.8); padding: 12px 15px; display: block; transition: all .3s; }
        .sidebar a:hover, .sidebar a.active { background: rgba(255,255,255,.1); color: #fff; text-decoration: none; }
        .log-box { background:#1e1e1e; color:#0f0; padding:15px; font-family:monospace; max-height:300px; overflow-y:auto; border-radius:5px; }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <div class="col-md-2 sidebar p-0">
                <div class="p-3 text-center text-white border-bottom border-secondary">
                    <h4><i class="bi bi-box-seam"></i> 智能库存</h4>
                </div>
                <nav class="mt-2">
                    <a href="index.html"><i class="bi bi-speedometer2 mr-2"></i>仪表板</a>
                    <a href="categories.html"><i class="bi bi-tags mr-2"></i>品类管理</a>
                    <a href="varieties.html"><i class="bi bi-folder mr-2"></i>品种管理</a>
                    <a href="batches.html"><i class="bi bi-box mr-2"></i>批次管理</a>
                    <a href="warehouses.html"><i class="bi bi-building mr-2"></i>仓库管理</a>
                    <a href="stores.html"><i class="bi bi-shop mr-2"></i>门店管理</a>
                    <a href="inventories.html"><i class="bi bi-boxes mr-2"></i>库存管理</a>
                    <a href="environment.html"><i class="bi bi-thermometer-half mr-2"></i>温湿度监控</a>
                    <a href="transfers.html"><i class="bi bi-arrow-left-right mr-2"></i>调拨管理</a>
                    <a href="checks.html"><i class="bi bi-clipboard-check mr-2"></i>库存盘点</a>
                    <a href="alerts.html"><i class="bi bi-bell mr-2"></i>预警中心</a>
                    <a href="test-data.html" class="active"><i class="bi bi-play-circle mr-2"></i>测试数据生成</a>
                </nav>
            </div>
            
            <div class="col-md-10 p-4">
                <h3 class="mb-4"><i class="bi bi-play-circle"></i> 测试数据生成器</h3>
                
                <div class="row mb-4">
                    <div class="col-md-4">
                        <div class="card">
                            <div class="card-header bg-primary text-white">
                                <i class="bi bi-database"></i> 基础数据
                            </div>
                            <div class="card-body">
                                <p class="text-muted small">生成品类、品种、仓库、门店基础数据</p>
                                <button class="btn btn-primary btn-block" onclick="generateBasic()">生成基础数据</button>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="card">
                            <div class="card-header bg-success text-white">
                                <i class="bi bi-box-seam"></i> 库存数据
                            </div>
                            <div class="card-body">
                                <p class="text-muted small">生成批次和库存数据（需先生成基础数据）</p>
                                <button class="btn btn-success btn-block" onclick="generateInventory()">生成库存数据</button>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="card">
                            <div class="card-header bg-warning text-dark">
                                <i class="bi bi-activity"></i> 业务数据
                            </div>
                            <div class="card-body">
                                <p class="text-muted small">生成温湿度、调拨、盘点等业务数据</p>
                                <button class="btn btn-warning btn-block" onclick="generateBusiness()">生成业务数据</button>
                            </div>
                        </div>
                    </div>
                </div>
                
                <div class="row mb-4">
                    <div class="col-md-6">
                        <div class="card">
                            <div class="card-header bg-info text-white">
                                <i class="bi bi-lightning"></i> 一键生成全部
                            </div>
                            <div class="card-body">
                                <p class="text-muted small">一键生成完整的测试数据集，包含所有模块</p>
                                <button class="btn btn-info btn-lg btn-block" onclick="generateAll()">🚀 一键生成所有测试数据</button>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="card">
                            <div class="card-header bg-danger text-white">
                                <i class="bi bi-trash"></i> 清空数据
                            </div>
                            <div class="card-body">
                                <p class="text-muted small">注意：此操作将清空所有数据，请谨慎使用</p>
                                <button class="btn btn-danger btn-lg btn-block" onclick="clearAll()">⚠️ 清空所有数据</button>
                            </div>
                        </div>
                    </div>
                </div>
                
                <div class="card">
                    <div class="card-header bg-dark text-white">
                        <i class="bi bi-terminal"></i> 执行日志
                    </div>
                    <div class="card-body">
                        <div id="logBox" class="log-box">
                            <div>等待操作...</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/jquery@3.6.4/dist/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function log(msg) {
            const time = new Date().toLocaleTimeString();
            $('#logBox').prepend(`<div>[${time}] ${msg}</div>`);
        }
        
        async function post(url, data) {
            const resp = await fetch(url, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(data)
            });
            return resp.json();
        }
        
        async function getAll(url) {
            const resp = await fetch(url);
            return resp.json();
        }
        
        async function del(url) {
            await fetch(url, {method: 'DELETE'});
        }
        
        async function generateBasic() {
            log('开始生成基础数据...');
            
            const categories = [
                {categoryCode:'CAT001', categoryName:'蔬菜种子', description:'各类蔬菜种子'},
                {categoryCode:'CAT002', categoryName:'粮食作物', description:'水稻、小麦等粮食种子'},
                {categoryCode:'CAT003', categoryName:'花卉种子', description:'观赏花卉种子'}
            ];
            
            for (const c of categories) {
                await post('/api/categories', c);
                log('✓ 品类: ' + c.categoryName);
            }
            
            const cats = await getAll('/api/categories');
            
            const varieties = [
                {varietyCode:'VAR001', varietyName:'番茄一号', category:{id:cats[0].id}, description:'早熟品种'},
                {varietyCode:'VAR002', varietyName:'黄瓜翠绿', category:{id:cats[0].id}, description:'高产黄瓜'},
                {varietyCode:'VAR003', varietyName:'水稻优稻', category:{id:cats[1].id}, description:'优质水稻'},
                {varietyCode:'VAR004', varietyName:'玫瑰红粉', category:{id:cats[2].id}, description:'红粉玫瑰'},
                {varietyCode:'VAR005', varietyName:'向日葵阳光', category:{id:cats[2].id}, description:'观赏向日葵'}
            ];
            
            for (const v of varieties) {
                await post('/api/varieties', v);
                log('✓ 品种: ' + v.varietyName);
            }
            
            const warehouses = [
                {warehouseCode:'WH001', warehouseName:'中心仓库', address:'北京市朝阳区', manager:'张三', phone:'13800138001'},
                {warehouseCode:'WH002', warehouseName:'东区分仓', address:'北京市东城区', manager:'李四', phone:'13800138002'}
            ];
            
            for (const w of warehouses) {
                await post('/api/warehouses', w);
                log('✓ 仓库: ' + w.warehouseName);
            }
            
            const stores = [
                {storeCode:'ST001', storeName:'朝阳门店', address:'朝阳门内大街', manager:'王五', phone:'13900139001'},
                {storeCode:'ST002', storeName:'西单店', address:'西单北大街', manager:'赵六', phone:'13900139002'}
            ];
            
            for (const s of stores) {
                await post('/api/stores', s);
                log('✓ 门店: ' + s.storeName);
            }
            
            log('✅ 基础数据生成完成！');
        }
        
        async function generateInventory() {
            log('开始生成库存数据...');
            
            const varieties = await getAll('/api/varieties');
            const warehouses = await getAll('/api/warehouses');
            const stores = await getAll('/api/stores');
            
            if (varieties.length === 0 || (warehouses.length === 0 && stores.length === 0)) {
                log('❌ 请先生成基础数据！');
                return;
            }
            
            const today = new Date();
            const batches = [];
            
            for (let i = 0; i < varieties.length; i++) {
                const v = varieties[i];
                const prodDate = new Date(today);
                prodDate.setMonth(prodDate.getMonth() - i);
                const expDate = new Date(prodDate);
                expDate.setMonth(expDate.getMonth() + 12);
                
                const batch = {
                    batchCode: 'BATCH' + String(i + 1).padStart(3, '0'),
                    variety: {id: v.id},
                    productionDate: prodDate.toISOString().split('T')[0],
                    expiryDate: expDate.toISOString().split('T')[0],
                    supplier: '供应商' + (i + 1),
                    purchasePrice: (10 + i * 5).toFixed(2)
                };
                const saved = await post('/api/batches', batch);
                batches.push(saved);
                log('✓ 批次: ' + batch.batchCode);
            }
            
            for (let i = 0; i < batches.length; i++) {
                const batch = batches[i];
                const wh = warehouses[i % warehouses.length];
                const st = stores[i % stores.length];
                const qty1 = Math.floor(Math.random() * 500) + 100;
                const qty2 = Math.floor(Math.random() * 200) + 50;
                
                await post('/api/inventories', {seedBatch:{id:batch.id}, warehouse:{id:wh.id}, quantity:qty1, location:'A-0' + (i+1)});
                log('✓ 库存: ' + wh.warehouseName + ' +' + qty1);
                
                await post('/api/inventories', {seedBatch:{id:batch.id}, store:{id:st.id}, quantity:qty2, location:'货架' + (i+1)});
                log('✓ 库存: ' + st.storeName + ' +' + qty2);
            }
            
            log('✅ 库存数据生成完成！');
        }
        
        async function generateBusiness() {
            log('开始生成业务数据...');
            
            const warehouses = await getAll('/api/warehouses');
            const stores = await getAll('/api/stores');
            const inventories = await getAll('/api/inventories');
            
            if (inventories.length === 0) {
                log('❌ 请先生成库存数据！');
                return;
            }
            
            for (let i = 0; i < 5; i++) {
                const isWh = Math.random() > 0.5;
                const locs = isWh ? warehouses : stores;
                const loc = locs[Math.floor(Math.random() * locs.length)];
                const data = {
                    temperature: parseFloat((Math.random() * 40 - 5).toFixed(1)),
                    humidity: parseFloat((Math.random() * 100).toFixed(1)),
                    deviceCode: 'DEV' + String(i + 1).padStart(3, '0')
                };
                if (isWh) data.warehouse = {id: loc.id};
                else data.store = {id: loc.id};
                
                await post('/api/environment', data);
                log('✓ 温湿度记录: T=' + data.temperature + ', H=' + data.humidity);
            }
            
            if (inventories.length >= 2) {
                const fromInv = inventories[0];
                const toWh = warehouses.find(w => fromInv.warehouse && w.id !== fromInv.warehouse.id);
                if (toWh) {
                    const transfer = {
                        seedBatch: {id: fromInv.seedBatch.id},
                        fromWarehouse: {id: fromInv.warehouse.id},
                        toWarehouse: {id: toWh.id},
                        quantity: Math.min(50, fromInv.quantity),
                        remark: '测试调拨'
                    };
                    const saved = await post('/api/transfers', transfer);
                    log('✓ 调拨申请: ' + saved.transferCode);
                    
                    await fetch('/api/transfers/' + saved.id + '/approve', {method:'POST'});
                    log('✓ 调拨已审批通过');
                }
            }
            
            if (inventories.length > 0) {
                const inv = inventories[0];
                const actual = inv.quantity + Math.floor(Math.random() * 20) - 10;
                await post('/api/checks', {inventoryId: inv.id, actualQuantity: actual, remark: '测试盘点'});
                log('✓ 盘点记录: 系统=' + inv.quantity + ', 实际=' + actual);
            }
            
            log('✅ 业务数据生成完成！');
        }
        
        async function generateAll() {
            log('===== 开始一键生成全部数据 =====');
            await generateBasic();
            await generateInventory();
            await generateBusiness();
            log('===== 🎉 全部数据生成完成！=====');
        }
        
        async function clearAll() {
            if (!confirm('确定要清空所有数据吗？此操作不可恢复！')) return;
            log('开始清空数据...');
            
            const [checks, transfers, invs, monitors, batches, vars, cats, whs, stores, alerts] = await Promise.all([
                getAll('/api/checks'), getAll('/api/transfers'), getAll('/api/inventories'),
                getAll('/api/environment'), getAll('/api/batches'), getAll('/api/varieties'),
                getAll('/api/categories'), getAll('/api/warehouses'), getAll('/api/stores'),
                getAll('/api/alerts')
            ]);
            
            for (const item of checks) await del('/api/checks/' + item.id);
            for (const item of transfers) await del('/api/transfers/' + item.id);
            for (const item of invs) await del('/api/inventories/' + item.id);
            for (const item of monitors) await del('/api/environment/' + item.id);
            for (const item of batches) await del('/api/batches/' + item.id);
            for (const item of vars) await del('/api/varieties/' + item.id);
            for (const item of cats) await del('/api/categories/' + item.id);
            for (const item of whs) await del('/api/warehouses/' + item.id);
            for (const item of stores) await del('/api/stores/' + item.id);
            for (const item of alerts) await del('/api/alerts/' + item.id);
            
            log('✅ 所有数据已清空！');
        }
    </script>
</body>
</html>
