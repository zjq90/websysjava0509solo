# Server Configuration
server.port=8080

# Application Name
spring.application.name=smart-inventory-system

# H2 Database Configuration
spring.datasource.url=jdbc:h2:file:./data/inventorydb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console Configuration
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Thymeleaf Configuration
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# Application Configuration
# 温湿度预警阈值
inventory.temperature.min=0
inventory.temperature.max=35
inventory.humidity.min=30
inventory.humidity.max=70
# 近效期提醒天数（30天）
inventory.expiry.warning.days=30
