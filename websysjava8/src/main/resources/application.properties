## 服务器配置
server.port=8080
server.servlet.context-path=/

## H2数据库配置
spring.datasource.url=jdbc:h2:./data/smart_inventory;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

## H2控制台配置
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

## JPA/Hibernate配置
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.format_sql=true

## 应用配置
# 近效期提醒天数（30天）
inventory.expiry.days=30
# 温湿度阈值配置
inventory.temperature.min=0
inventory.temperature.max=30
inventory.humidity.min=30
inventory.humidity.max=80
