<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>调拨管理 - 智能库存管理系统</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        body { background-color: #f8f9fa; }
        .sidebar { min-height: 100vh; background: linear-gradient(180deg, #343a40 0%, #212529 100%); }
        .sidebar a { color: rgba(255,255,255,.8); padding: 12px 15px; display: block; transition: all .3s; }
        .sidebar a:hover, .sidebar a.active { background: rgba(255,255,255,.1); color: #fff; text-decoration: none; }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <div class="col-md-2 sidebar p-0">
                <div class="p-3 text-center text-white border-bottom border-secondary">
                    <h4><i class="bi bi-box-seam"></i> 智能库存</h4>
                </div>
                <nav class="mt-2">
                    <a href="index.html"><i class="bi bi-speedometer2 mr-2"></i>仪表板</a>
                    <a href="categories.html"><i class="bi bi-tags mr-2"></i>品类管理</a>
                    <a href="varieties.html"><i class="bi bi-folder mr-2"></i>品种管理</a>
                    <a href="batches.html"><i class="bi bi-box mr-2"></i>批次管理</a>
                    <a href="warehouses.html"><i class="bi bi-building mr-2"></i>仓库管理</a>
                    <a href="stores.html"><i class="bi bi-shop mr-2"></i>门店管理</a>
                    <a href="inventories.html"><i class="bi bi-boxes mr-2"></i>库存管理</a>
                    <a href="environment.html"><i class="bi bi-thermometer-half mr-2"></i>温湿度监控</a>
                    <a href="transfers.html" class="active"><i class="bi bi-arrow-left-right mr-2"></i>调拨管理</a>
                    <a href="checks.html"><i class="bi bi-clipboard-check mr-2"></i>库存盘点</a>
                    <a href="alerts.html"><i class="bi bi-bell mr-2"></i>预警中心</a>
                    <a href="test-data.html"><i class="bi bi-play-circle mr-2"></i>测试数据生成</a>
                </nav>
            </div>
            
            <div class="col-md-10 p-4">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h3><i class="bi bi-arrow-left-right"></i> 调拨管理</h3>
                    <button class="btn btn-primary" onclick="showModal()"><i class="bi bi-plus-circle"></i> 申请调拨</button>
                </div>
                
                <div class="card">
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover mb-0">
                                <thead class="thead-dark">
                                    <tr><th>单号</th><th>品种</th><th>数量</th><th>调出</th><th>调入</th><th>状态</th><th>创建时间</th><th>操作</th></tr>
                                </thead>
                                <tbody id="tableBody"></tbody>
                            </table>
                        </div>
                    </div>
                    <div class="card-footer bg-white d-flex justify-content-between align-items-center">
                        <div class="text-muted small" id="pageInfo">共 0 条数据</div>
                        <nav>
                            <ul class="pagination pagination-sm mb-0" id="pagination">
                                <li class="page-item disabled"><a class="page-link" href="#">上一页</a></li>
                                <li class="page-item active"><a class="page-link" href="#">1</a></li>
                                <li class="page-item disabled"><a class="page-link" href="#">下一页</a></li>
                            </ul>
                        </nav>
                        <div class="d-flex align-items-center">
                            <span class="text-muted small mr-2">每页:</span>
                            <select class="form-control form-control-sm" id="pageSize" style="width:80px;" onchange="changePageSize()">
                                <option value="5">5</option>
                                <option value="10" selected>10</option>
                                <option value="20">20</option>
                                <option value="50">50</option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="formModal">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title">申请调拨</h5>
                    <button type="button" class="close text-white" data-dismiss="modal">&times;</button>
                </div>
                <div class="modal-body">
                    <form id="dataForm">
                        <div class="form-group">
                            <label>种子批次</label>
                            <select class="form-control" id="seedBatchId" required></select>
                        </div>
                        <div class="form-group">
                            <label>调出位置类型</label>
                            <select class="form-control" id="fromType" onchange="toggleFrom()">
                                <option value="warehouse">仓库</option>
                                <option value="store">门店</option>
                            </select>
                        </div>
                        <div class="form-group" id="fromWarehouseDiv">
                            <label>调出仓库</label>
                            <select class="form-control" id="fromWarehouseId"></select>
                        </div>
                        <div class="form-group" id="fromStoreDiv" style="display:none;">
                            <label>调出门店</label>
                            <select class="form-control" id="fromStoreId"></select>
                        </div>
                        <div class="form-group">
                            <label>调入位置类型</label>
                            <select class="form-control" id="toType" onchange="toggleTo()">
                                <option value="warehouse">仓库</option>
                                <option value="store">门店</option>
                            </select>
                        </div>
                        <div class="form-group" id="toWarehouseDiv">
                            <label>调入仓库</label>
                            <select class="form-control" id="toWarehouseId"></select>
                        </div>
                        <div class="form-group" id="toStoreDiv" style="display:none;">
                            <label>调入门店</label>
                            <select class="form-control" id="toStoreId"></select>
                        </div>
                        <div class="form-row">
                            <div class="form-group col-md-6">
                                <label>调拨数量</label>
                                <input type="number" class="form-control" id="quantity" required>
                            </div>
                            <div class="form-group col-md-6">
                                <label>备注</label>
                                <input type="text" class="form-control" id="remark">
                            </div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-dismiss="modal">取消</button>
                    <button type="button" class="btn btn-primary" onclick="saveData()">提交申请</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/jquery@3.6.4/dist/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const API_URL = '/api/transfers';
        let allData = [];
        let currentPage = 1;
        let pageSize = 10;
        
        $(function() { loadAll(); });
        
        async function loadAll() {
            const [batches, warehouses, stores] = await Promise.all([
                fetchData('/api/batches'), fetchData('/api/warehouses'), fetchData('/api/stores')
            ]);
            $('#seedBatchId').html(batches.map(b => `<option value="${b.id}">${b.batchCode} - ${b.variety.varietyName}</option>`).join(''));
            $('#fromWarehouseId').html(warehouses.map(w => `<option value="${w.id}">${w.warehouseName}</option>`).join(''));
            $('#toWarehouseId').html(warehouses.map(w => `<option value="${w.id}">${w.warehouseName}</option>`).join(''));
            $('#fromStoreId').html(stores.map(s => `<option value="${s.id}">${s.storeName}</option>`).join(''));
            $('#toStoreId').html(stores.map(s => `<option value="${s.id}">${s.storeName}</option>`).join(''));
            loadData();
        }
        
        async function loadData() {
            allData = await fetchData(API_URL);
            renderTable();
        }
        
        function renderTable() {
            const total = allData.length;
            const totalPages = Math.max(1, Math.ceil(total / pageSize));
            if (currentPage > totalPages) currentPage = totalPages;
            
            const start = (currentPage - 1) * pageSize;
            const end = start + pageSize;
            const pageData = allData.slice(start, end);
            
            $('#pageInfo').text(`共 ${total} 条数据，第 ${currentPage}/${totalPages} 页`);
            renderPagination(totalPages);
            
            if (pageData.length === 0) {
                $('#tableBody').html(`<tr><td colspan="8" class="text-center text-muted py-4"><i class="bi bi-inbox"></i> 暂无数据</td></tr>`);
                return;
            }
            
            $('#tableBody').html(pageData.map(item => {
                const fromName = item.fromWarehouse ? item.fromWarehouse.warehouseName : item.fromStore.storeName;
                const toName = item.toWarehouse ? item.toWarehouse.warehouseName : item.toStore.storeName;
                const badgeClass = item.status === 'COMPLETED' ? 'success' : item.status === 'PENDING' ? 'warning' : 'danger';
                let actions = '';
                if (item.status === 'PENDING') {
                    actions = `
                        <button class="btn btn-sm btn-success" onclick="approve(${item.id})">通过</button>
                        <button class="btn btn-sm btn-danger" onclick="reject(${item.id})">拒绝</button>
                    `;
                }
                return `
                    <tr>
                        <td><strong>${item.transferCode}</strong></td>
                        <td>${item.seedBatch.variety.varietyName}</td>
                        <td>${item.quantity}</td>
                        <td>${fromName}</td>
                        <td>${toName}</td>
                        <td><span class="badge badge-${badgeClass}">${item.status}</span></td>
                        <td class="small">${new Date(item.createTime).toLocaleString()}</td>
                        <td>${actions}</td>
                    </tr>
                `;
            }).join(''));
        }
        
        function renderPagination(totalPages) {
            let html = '';
            html += `<li class="page-item ${currentPage <= 1 ? 'disabled' : ''}"><a class="page-link" href="javascript:goToPage(${currentPage - 1})">上一页</a></li>`;
            
            for (let i = 1; i <= totalPages; i++) {
                if (i === 1 || i === totalPages || (i >= currentPage - 2 && i <= currentPage + 2)) {
                    html += `<li class="page-item ${i === currentPage ? 'active' : ''}"><a class="page-link" href="javascript:goToPage(${i})">${i}</a></li>`;
                } else if (i === currentPage - 3 || i === currentPage + 3) {
                    html += `<li class="page-item disabled"><a class="page-link" href="#">...</a></li>`;
                }
            }
            
            html += `<li class="page-item ${currentPage >= totalPages ? 'disabled' : ''}"><a class="page-link" href="javascript:goToPage(${currentPage + 1})">下一页</a></li>`;
            $('#pagination').html(html);
        }
        
        function goToPage(page) {
            const totalPages = Math.max(1, Math.ceil(allData.length / pageSize));
            if (page >= 1 && page <= totalPages) {
                currentPage = page;
                renderTable();
            }
        }
        
        function changePageSize() {
            pageSize = parseInt($('#pageSize').val());
            currentPage = 1;
            renderTable();
        }
        
        function toggleFrom() {
            $('#fromWarehouseDiv').toggle($('#fromType').val() === 'warehouse');
            $('#fromStoreDiv').toggle($('#fromType').val() === 'store');
        }
        function toggleTo() {
            $('#toWarehouseDiv').toggle($('#toType').val() === 'warehouse');
            $('#toStoreDiv').toggle($('#toType').val() === 'store');
        }
        
        function showModal() {
            $('#dataForm')[0].reset();
            toggleFrom(); toggleTo();
            $('#formModal').modal('show');
        }
        
        async function saveData() {
            const data = {
                seedBatch: {id: parseInt($('#seedBatchId').val())},
                quantity: parseInt($('#quantity').val()),
                remark: $('#remark').val()
            };
            if ($('#fromType').val() === 'warehouse') data.fromWarehouse = {id: parseInt($('#fromWarehouseId').val())};
            else data.fromStore = {id: parseInt($('#fromStoreId').val())};
            if ($('#toType').val() === 'warehouse') data.toWarehouse = {id: parseInt($('#toWarehouseId').val())};
            else data.toStore = {id: parseInt($('#toStoreId').val())};
            
            await fetch(API_URL, {method:'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(data)});
            $('#formModal').modal('hide');
            loadData();
        }
        
        async function approve(id) {
            if(confirm('确认通过此调拨申请？')) {
                await fetch(`${API_URL}/${id}/approve`, {method:'POST'});
                loadData();
            }
        }
        
        async function reject(id) {
            if(confirm('确认拒绝此调拨申请？')) {
                await fetch(`${API_URL}/${id}/reject`, {method:'POST'});
                loadData();
            }
        }
        
        async function fetchData(url) {
            const resp = await fetch(url);
            return resp.json();
        }
    </script>
</body>
</html>
