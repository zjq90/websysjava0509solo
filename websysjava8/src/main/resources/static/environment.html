<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>温湿度监控 - 智能库存管理系统</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        body { background-color: #f8f9fa; }
        .sidebar { min-height: 100vh; background: linear-gradient(180deg, #343a40 0%, #212529 100%); }
        .sidebar a { color: rgba(255,255,255,.8); padding: 12px 15px; display: block; transition: all .3s; }
        .sidebar a:hover, .sidebar a.active { background: rgba(255,255,255,.1); color: #fff; text-decoration: none; }
        .alert-row { background-color: #fff3cd !important; }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <div class="col-md-2 sidebar p-0">
                <div class="p-3 text-center text-white border-bottom border-secondary">
                    <h4><i class="bi bi-box-seam"></i> 智能库存</h4>
                </div>
                <nav class="mt-2">
                    <a href="index.html"><i class="bi bi-speedometer2 mr-2"></i>仪表板</a>
                    <a href="categories.html"><i class="bi bi-tags mr-2"></i>品类管理</a>
                    <a href="varieties.html"><i class="bi bi-folder mr-2"></i>品种管理</a>
                    <a href="batches.html"><i class="bi bi-box mr-2"></i>批次管理</a>
                    <a href="warehouses.html"><i class="bi bi-building mr-2"></i>仓库管理</a>
                    <a href="stores.html"><i class="bi bi-shop mr-2"></i>门店管理</a>
                    <a href="inventories.html"><i class="bi bi-boxes mr-2"></i>库存管理</a>
                    <a href="environment.html" class="active"><i class="bi bi-thermometer-half mr-2"></i>温湿度监控</a>
                    <a href="transfers.html"><i class="bi bi-arrow-left-right mr-2"></i>调拨管理</a>
                    <a href="checks.html"><i class="bi bi-clipboard-check mr-2"></i>库存盘点</a>
                    <a href="alerts.html"><i class="bi bi-bell mr-2"></i>预警中心</a>
                    <a href="test-data.html"><i class="bi bi-play-circle mr-2"></i>测试数据生成</a>
                </nav>
            </div>
            
            <div class="col-md-10 p-4">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h3><i class="bi bi-thermometer-half"></i> 温湿度监控</h3>
                    <div>
                        <button class="btn btn-info mr-2" onclick="addRandomRecord()"><i class="bi bi-plus-circle"></i> 模拟录入</button>
                        <button class="btn btn-primary" onclick="showModal()"><i class="bi bi-plus-circle"></i> 新增记录</button>
                    </div>
                </div>
                
                <div class="card mb-4">
                    <div class="card-body">
                        <div class="row">
                            <div class="col-md-3 text-center">
                                <h5>温度正常范围</h5>
                                <h3 class="text-success">0°C ~ 30°C</h3>
                            </div>
                            <div class="col-md-3 text-center">
                                <h5>湿度正常范围</h5>
                                <h3 class="text-success">30% ~ 80%</h3>
                            </div>
                            <div class="col-md-3 text-center">
                                <h5>温度异常</h5>
                                <h3 class="text-danger" id="tempAlertCount">-</h3>
                            </div>
                            <div class="col-md-3 text-center">
                                <h5>湿度异常</h5>
                                <h3 class="text-danger" id="humAlertCount">-</h3>
                            </div>
                        </div>
                    </div>
                </div>
                
                <div class="card">
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover mb-0">
                                <thead class="thead-dark">
                                    <tr><th>ID</th><th>位置</th><th>温度(°C)</th><th>湿度(%)</th><th>设备</th><th>监测时间</th><th>状态</th></tr>
                                </thead>
                                <tbody id="tableBody"></tbody>
                            </table>
                        </div>
                    </div>
                    <div class="card-footer bg-white d-flex justify-content-between align-items-center">
                        <div class="text-muted small" id="pageInfo">共 0 条数据</div>
                        <nav>
                            <ul class="pagination pagination-sm mb-0" id="pagination">
                                <li class="page-item disabled"><a class="page-link" href="#">上一页</a></li>
                                <li class="page-item active"><a class="page-link" href="#">1</a></li>
                                <li class="page-item disabled"><a class="page-link" href="#">下一页</a></li>
                            </ul>
                        </nav>
                        <div class="d-flex align-items-center">
                            <span class="text-muted small mr-2">每页:</span>
                            <select class="form-control form-control-sm" id="pageSize" style="width:80px;" onchange="changePageSize()">
                                <option value="5">5</option>
                                <option value="10" selected>10</option>
                                <option value="20">20</option>
                                <option value="50">50</option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="formModal">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title">新增温湿度记录</h5>
                    <button type="button" class="close text-white" data-dismiss="modal">&times;</button>
                </div>
                <div class="modal-body">
                    <form id="dataForm">
                        <div class="form-group">
                            <label>位置类型</label>
                            <select class="form-control" id="locationType" onchange="toggleLocation()">
                                <option value="warehouse">仓库</option>
                                <option value="store">门店</option>
                            </select>
                        </div>
                        <div class="form-group" id="warehouseDiv">
                            <label>仓库</label>
                            <select class="form-control" id="warehouseId"></select>
                        </div>
                        <div class="form-group" id="storeDiv" style="display:none;">
                            <label>门店</label>
                            <select class="form-control" id="storeId"></select>
                        </div>
                        <div class="form-row">
                            <div class="form-group col-md-6">
                                <label>温度(°C)</label>
                                <input type="number" step="0.1" class="form-control" id="temperature" required>
                            </div>
                            <div class="form-group col-md-6">
                                <label>湿度(%)</label>
                                <input type="number" step="0.1" class="form-control" id="humidity" required>
                            </div>
                        </div>
                        <div class="form-group">
                            <label>设备编码</label>
                            <input type="text" class="form-control" id="deviceCode">
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-dismiss="modal">取消</button>
                    <button type="button" class="btn btn-primary" onclick="saveData()">保存</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/jquery@3.6.4/dist/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const API_URL = '/api/environment';
        let warehouses = [], stores = [];
        let allData = [];
        let currentPage = 1;
        let pageSize = 10;
        
        $(function() { loadAll(); });
        
        async function loadAll() {
            warehouses = await fetchData('/api/warehouses');
            stores = await fetchData('/api/stores');
            $('#warehouseId').html(warehouses.map(w => `<option value="${w.id}">${w.warehouseName}</option>`).join(''));
            $('#storeId').html(stores.map(s => `<option value="${s.id}">${s.storeName}</option>`).join(''));
            loadData();
        }
        
        async function loadData() {
            allData = await fetchData(API_URL);
            renderTable();
        }
        
        function renderTable() {
            const total = allData.length;
            const totalPages = Math.max(1, Math.ceil(total / pageSize));
            if (currentPage > totalPages) currentPage = totalPages;
            
            const start = (currentPage - 1) * pageSize;
            const end = start + pageSize;
            const pageData = allData.slice(start, end);
            
            $('#pageInfo').text(`共 ${total} 条数据，第 ${currentPage}/${totalPages} 页`);
            renderPagination(totalPages);
            
            let tempAlert = 0, humAlert = 0;
            
            if (pageData.length === 0) {
                $('#tableBody').html(`<tr><td colspan="7" class="text-center text-muted py-4"><i class="bi bi-inbox"></i> 暂无数据</td></tr>`);
            } else {
                $('#tableBody').html(pageData.map(item => {
                    const temp = parseFloat(item.temperature);
                    const hum = parseFloat(item.humidity);
                    const tempOk = temp >= 0 && temp <= 30;
                    const humOk = hum >= 30 && hum <= 80;
                    if (!tempOk) tempAlert++;
                    if (!humOk) humAlert++;
                    
                    const locName = item.warehouse ? item.warehouse.warehouseName : item.store.storeName;
                    const rowClass = (!tempOk || !humOk) ? 'alert-row' : '';
                    const status = (!tempOk || !humOk) ? '<span class="badge badge-danger">异常</span>' : '<span class="badge badge-success">正常</span>';
                    
                    return `
                        <tr class="${rowClass}">
                            <td>${item.id}</td>
                            <td>${locName}</td>
                            <td class="${tempOk ? '' : 'text-danger font-weight-bold'}">${temp}</td>
                            <td class="${humOk ? '' : 'text-danger font-weight-bold'}">${hum}</td>
                            <td>${item.deviceCode || '-'}</td>
                            <td class="small">${new Date(item.monitorTime).toLocaleString()}</td>
                            <td>${status}</td>
                        </tr>
                    `;
                }).join(''));
            }
            
            $('#tempAlertCount').text(tempAlert);
            $('#humAlertCount').text(humAlert);
        }
        
        function renderPagination(totalPages) {
            let html = '';
            html += `<li class="page-item ${currentPage <= 1 ? 'disabled' : ''}"><a class="page-link" href="javascript:goToPage(${currentPage - 1})">上一页</a></li>`;
            
            for (let i = 1; i <= totalPages; i++) {
                if (i === 1 || i === totalPages || (i >= currentPage - 2 && i <= currentPage + 2)) {
                    html += `<li class="page-item ${i === currentPage ? 'active' : ''}"><a class="page-link" href="javascript:goToPage(${i})">${i}</a></li>`;
                } else if (i === currentPage - 3 || i === currentPage + 3) {
                    html += `<li class="page-item disabled"><a class="page-link" href="#">...</a></li>`;
                }
            }
            
            html += `<li class="page-item ${currentPage >= totalPages ? 'disabled' : ''}"><a class="page-link" href="javascript:goToPage(${currentPage + 1})">下一页</a></li>`;
            $('#pagination').html(html);
        }
        
        function goToPage(page) {
            const totalPages = Math.max(1, Math.ceil(allData.length / pageSize));
            if (page >= 1 && page <= totalPages) {
                currentPage = page;
                renderTable();
            }
        }
        
        function changePageSize() {
            pageSize = parseInt($('#pageSize').val());
            currentPage = 1;
            renderTable();
        }
        
        function toggleLocation() {
            $('#warehouseDiv').toggle($('#locationType').val() === 'warehouse');
            $('#storeDiv').toggle($('#locationType').val() === 'store');
        }
        
        function showModal() {
            $('#dataForm')[0].reset();
            toggleLocation();
            $('#formModal').modal('show');
        }
        
        async function saveData() {
            const locType = $('#locationType').val();
            const data = {
                temperature: parseFloat($('#temperature').val()),
                humidity: parseFloat($('#humidity').val()),
                deviceCode: $('#deviceCode').val()
            };
            if (locType === 'warehouse') {
                data.warehouse = {id: parseInt($('#warehouseId').val())};
            } else {
                data.store = {id: parseInt($('#storeId').val())};
            }
            
            await fetch(API_URL, {method:'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(data)});
            $('#formModal').modal('hide');
            loadData();
        }
        
        async function addRandomRecord() {
            const isWarehouse = Math.random() > 0.5;
            const locations = isWarehouse ? warehouses : stores;
            if (locations.length === 0) { alert('请先创建仓库或门店'); return; }
            const loc = locations[Math.floor(Math.random() * locations.length)];
            const temp = (Math.random() * 40 - 5).toFixed(1);
            const hum = (Math.random() * 100).toFixed(1);
            
            const data = {
                temperature: parseFloat(temp),
                humidity: parseFloat(hum),
                deviceCode: 'DEV' + Math.floor(Math.random()*1000)
            };
            if (isWarehouse) data.warehouse = {id: loc.id};
            else data.store = {id: loc.id};
            
            await fetch(API_URL, {method:'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(data)});
            loadData();
        }
        
        async function fetchData(url) {
            const resp = await fetch(url);
            return resp.json();
        }
    </script>
</body>
</html>
