server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: field-collection
  
  datasource:
    url: jdbc:h2:mem:fieldcollection;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  
  h2:
    console:
      enabled: true
      path: /h2-console
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

encryption:
  aes:
    key: 3ZgQ6mJ2aB8rT9xX5eY1wN3vH7kL4uC2
    iv: 2xS5cV8nM9pQ2bD7
