<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/layout :: head">
    <title>客户/供应商管理</title>
</head>
<body>
<div class="container-fluid">
    <div class="row">
        <nav th:replace="fragments/layout :: sidebar"></nav>
        
        <main role="main" class="col-md-10 ml-sm-auto px-4 main-content">
            <div class="pt-3 pb-2 mb-3 d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center">
                <h1 class="h2"><i class="fa fa-users mr-2 text-info"></i>客户/供应商管理</h1>
                <div class="btn-toolbar mb-2 mb-md-0">
                    <div class="btn-group mr-2">
                        <a href="/customer" class="btn btn-outline-secondary" th:classappend="${selectedType == null} ? 'active' : ''">全部</a>
                        <a href="/customer?type=CUSTOMER" class="btn btn-outline-secondary" th:classappend="${selectedType == 'CUSTOMER'} ? 'active' : ''">客户</a>
                        <a href="/customer?type=SUPPLIER" class="btn btn-outline-secondary" th:classappend="${selectedType == 'SUPPLIER'} ? 'active' : ''">供应商</a>
                    </div>
                    <a href="/customer/add" class="btn btn-primary">
                        <i class="fa fa-plus mr-1"></i>新增
                    </a>
                </div>
            </div>
            
            <div th:replace="fragments/layout :: messages"></div>
            
            <div class="card shadow mb-4">
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-striped table-hover">
                            <thead class="thead-light">
                                <tr>
                                    <th>编号</th>
                                    <th>名称</th>
                                    <th>类型</th>
                                    <th>联系人</th>
                                    <th>电话</th>
                                    <th>省市</th>
                                    <th>信用额度</th>
                                    <th>操作</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:if="${#lists.isEmpty(customers)}">
                                    <td colspan="8" class="text-center py-4 text-muted">暂无数据</td>
                                </tr>
                                <tr th:each="customer : ${customers}">
                                    <td th:text="${customer.customerCode}">C001</td>
                                    <td th:text="${customer.customerName}">客户名称</td>
                                    <td>
                                        <span class="badge status-badge" 
                                              th:classappend="${customer.customerType == 'CUSTOMER'} ? 'badge-success' : 'badge-warning'"
                                              th:text="${customer.customerType == 'CUSTOMER'} ? '客户' : '供应商'">客户</span>
                                    </td>
                                    <td th:text="${customer.contactPerson}">联系人</td>
                                    <td th:text="${customer.contactPhone}">电话</td>
                                    <td th:text="${customer.province + ' ' + customer.city}">省市</td>
                                    <td th:text="${customer.creditLimit != null} ? '¥' + ${#numbers.formatDecimal(customer.creditLimit, 1, 2)} : '-'">¥0.00</td>
                                    <td>
                                        <a th:href="@{/customer/edit/{id}(id=${customer.id})}" class="btn btn-sm btn-outline-primary">
                                            <i class="fa fa-edit"></i>
                                        </a>
                                        <a th:href="@{/customer/delete/{id}(id=${customer.id})}" 
                                           class="btn btn-sm btn-outline-danger"
                                           onclick="return confirm('确定要删除吗？')">
                                            <i class="fa fa-trash"></i>
                                        </a>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                    <div th:if="${!isFiltered}" th:replace="fragments/layout :: pagination('/customer', ${currentPage}, ${totalPages}, ${totalItems}, ${size})"></div>
                </div>
            </div>
        </main>
    </div>
</div>

<script th:replace="fragments/layout :: scripts"></script>
</body>
</html>
