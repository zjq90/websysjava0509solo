<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/layout :: head">
    <title>客户/供应商表单</title>
</head>
<body>
<div class="container-fluid">
    <div class="row">
        <nav th:replace="fragments/layout :: sidebar"></nav>
        
        <main role="main" class="col-md-10 ml-sm-auto px-4 main-content">
            <div class="pt-3 pb-2 mb-3">
                <h1 class="h2">
                    <i class="fa fa-users mr-2 text-info"></i>
                    <span th:text="${customer.id} ? '编辑' : '新增'">新增</span>客户/供应商
                </h1>
            </div>
            
            <div class="card shadow mb-4">
                <div class="card-body">
                    <form th:action="@{/customer/save}" th:object="${customer}" method="post">
                        <input type="hidden" th:field="*{id}" />
                        
                        <div class="row">
                            <div class="col-md-4">
                                <div class="form-group">
                                    <label>编号 <span class="text-danger">*</span></label>
                                    <input type="text" th:field="*{customerCode}" class="form-control" required />
                                </div>
                            </div>
                            <div class="col-md-4">
                                <div class="form-group">
                                    <label>名称 <span class="text-danger">*</span></label>
                                    <input type="text" th:field="*{customerName}" class="form-control" required />
                                </div>
                            </div>
                            <div class="col-md-4">
                                <div class="form-group">
                                    <label>类型 <span class="text-danger">*</span></label>
                                    <select th:field="*{customerType}" class="form-control" required>
                                        <option value="CUSTOMER">客户</option>
                                        <option value="SUPPLIER">供应商</option>
                                        <option value="BOTH">既是客户也是供应商</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                        
                        <div class="row">
                            <div class="col-md-4">
                                <div class="form-group">
                                    <label>联系人</label>
                                    <input type="text" th:field="*{contactPerson}" class="form-control" />
                                </div>
                            </div>
                            <div class="col-md-4">
                                <div class="form-group">
                                    <label>联系电话</label>
                                    <input type="text" th:field="*{contactPhone}" class="form-control" />
                                </div>
                            </div>
                            <div class="col-md-4">
                                <div class="form-group">
                                    <label>信用额度</label>
                                    <input type="number" step="0.01" th:field="*{creditLimit}" class="form-control" />
                                </div>
                            </div>
                        </div>
                        
                        <div class="row">
                            <div class="col-md-4">
                                <div class="form-group">
                                    <label>省</label>
                                    <input type="text" th:field="*{province}" class="form-control" />
                                </div>
                            </div>
                            <div class="col-md-4">
                                <div class="form-group">
                                    <label>市</label>
                                    <input type="text" th:field="*{city}" class="form-control" />
                                </div>
                            </div>
                            <div class="col-md-4">
                                <div class="form-group">
                                    <label>区/县</label>
                                    <input type="text" th:field="*{district}" class="form-control" />
                                </div>
                            </div>
                        </div>
                        
                        <div class="form-group">
                            <label>详细地址</label>
                            <input type="text" th:field="*{address}" class="form-control" />
                        </div>
                        
                        <div class="row">
                            <div class="col-md-4">
                                <div class="form-group">
                                    <label>税号</label>
                                    <input type="text" th:field="*{taxNumber}" class="form-control" />
                                </div>
                            </div>
                            <div class="col-md-4">
                                <div class="form-group">
                                    <label>开户银行</label>
                                    <input type="text" th:field="*{bankName}" class="form-control" />
                                </div>
                            </div>
                            <div class="col-md-4">
                                <div class="form-group">
                                    <label>银行账号</label>
                                    <input type="text" th:field="*{bankAccount}" class="form-control" />
                                </div>
                            </div>
                        </div>
                        
                        <div class="form-group">
                            <label>备注</label>
                            <textarea th:field="*{remark}" class="form-control" rows="2"></textarea>
                        </div>
                        
                        <div class="form-group">
                            <button type="submit" class="btn btn-primary">
                                <i class="fa fa-save mr-1"></i>保存
                            </button>
                            <a href="/customer" class="btn btn-secondary">
                                <i class="fa fa-times mr-1"></i>取消
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </main>
    </div>
</div>

<script th:replace="fragments/layout :: scripts"></script>
</body>
</html>
