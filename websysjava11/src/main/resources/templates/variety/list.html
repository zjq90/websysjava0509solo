<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/layout :: head">
    <title>品种管理</title>
</head>
<body>
<div class="container-fluid">
    <div class="row">
        <nav th:replace="fragments/layout :: sidebar"></nav>
        
        <main role="main" class="col-md-10 ml-sm-auto px-4 main-content">
            <div class="pt-3 pb-2 mb-3 d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center">
                <h1 class="h2"><i class="fa fa-seedling mr-2 text-success"></i>品种管理</h1>
                <div class="btn-toolbar mb-2 mb-md-0">
                    <a href="/variety/add" class="btn btn-primary">
                        <i class="fa fa-plus mr-1"></i>新增品种
                    </a>
                </div>
            </div>
            
            <div th:replace="fragments/layout :: messages"></div>
            
            <div class="card shadow mb-4">
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-striped table-hover">
                            <thead class="thead-light">
                                <tr>
                                    <th>品种编号</th>
                                    <th>品种名称</th>
                                    <th>类别</th>
                                    <th>单位</th>
                                    <th>标准售价</th>
                                    <th>标准成本</th>
                                    <th>状态</th>
                                    <th>操作</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:if="${#lists.isEmpty(varieties)}">
                                    <td colspan="8" class="text-center py-4 text-muted">暂无数据</td>
                                </tr>
                                <tr th:each="variety : ${varieties}">
                                    <td th:text="${variety.varietyCode}">V001</td>
                                    <td th:text="${variety.varietyName}">品种名称</td>
                                    <td th:text="${variety.category}">类别</td>
                                    <td th:text="${variety.unit}">公斤</td>
                                    <td th:text="'¥' + ${#numbers.formatDecimal(variety.standardPrice, 1, 2)}">¥0.00</td>
                                    <td th:text="'¥' + ${#numbers.formatDecimal(variety.standardCost, 1, 2)}">¥0.00</td>
                                    <td>
                                        <span class="badge status-badge" 
                                              th:classappend="${variety.enabled} ? 'badge-success' : 'badge-secondary'"
                                              th:text="${variety.enabled} ? '启用' : '禁用'">启用</span>
                                    </td>
                                    <td>
                                        <a th:href="@{/variety/edit/{id}(id=${variety.id})}" class="btn btn-sm btn-outline-primary">
                                            <i class="fa fa-edit"></i>
                                        </a>
                                        <a th:href="@{/variety/delete/{id}(id=${variety.id})}" 
                                           class="btn btn-sm btn-outline-danger"
                                           onclick="return confirm('确定要删除吗？')">
                                            <i class="fa fa-trash"></i>
                                        </a>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                    <div th:replace="fragments/layout :: pagination('/variety', ${currentPage}, ${totalPages}, ${totalItems}, ${size})"></div>
                </div>
            </div>
        </main>
    </div>
</div>

<script th:replace="fragments/layout :: scripts"></script>
</body>
</html>
