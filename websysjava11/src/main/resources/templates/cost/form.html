<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/layout :: head">
    <title>成本表单</title>
</head>
<body>
<div class="container-fluid">
    <div class="row">
        <nav th:replace="fragments/layout :: sidebar"></nav>
        
        <main role="main" class="col-md-10 ml-sm-auto px-4 main-content">
            <div class="pt-3 pb-2 mb-3">
                <h1 class="h2">
                    <i class="fa fa-calculator mr-2 text-info"></i>
                    <span th:text="${costRecord.id} ? '编辑' : '新增'">新增</span>成本记录
                </h1>
            </div>
            
            <div class="card shadow mb-4">
                <div class="card-body">
                    <form th:action="@{/cost/save}" th:object="${costRecord}" method="post">
                        <input type="hidden" th:field="*{id}" />
                        
                        <div class="row">
                            <div class="col-md-4">
                                <div class="form-group">
                                    <label>成本单号</label>
                                    <input type="text" th:value="${costNo}" class="form-control" readonly />
                                </div>
                            </div>
                            <div class="col-md-4">
                                <div class="form-group">
                                    <label>成本类别 <span class="text-danger">*</span></label>
                                    <select th:field="*{category}" class="form-control" required>
                                        <option th:each="cat : ${categories}" 
                                                th:value="${cat.name}" 
                                                th:text="${cat.description}">类别</option>
                                    </select>
                                </div>
                            </div>
                            <div class="col-md-4">
                                <div class="form-group">
                                    <label>费用日期 <span class="text-danger">*</span></label>
                                    <input type="date" th:field="*{expenseDate}" class="form-control" required />
                                </div>
                            </div>
                        </div>
                        
                        <div class="row">
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label>费用名称 <span class="text-danger">*</span></label>
                                    <input type="text" th:field="*{expenseName}" class="form-control" required />
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label>关联品种</label>
                                    <select th:field="*{variety.id}" class="form-control">
                                        <option value="">无</option>
                                        <option th:each="v : ${varieties}" 
                                                th:value="${v.id}" 
                                                th:text="${v.varietyCode + ' - ' + v.varietyName}">品种</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                        
                        <div class="row">
                            <div class="col-md-3">
                                <div class="form-group">
                                    <label>数量</label>
                                    <input type="number" step="0.01" th:field="*{quantity}" class="form-control" />
                                </div>
                            </div>
                            <div class="col-md-3">
                                <div class="form-group">
                                    <label>单位</label>
                                    <input type="text" th:field="*{unit}" class="form-control" />
                                </div>
                            </div>
                            <div class="col-md-3">
                                <div class="form-group">
                                    <label>单价</label>
                                    <input type="number" step="0.01" th:field="*{unitPrice}" class="form-control" />
                                </div>
                            </div>
                            <div class="col-md-3">
                                <div class="form-group">
                                    <label>总金额 <span class="text-danger">*</span></label>
                                    <input type="number" step="0.01" th:field="*{totalAmount}" class="form-control" required />
                                </div>
                            </div>
                        </div>
                        
                        <div class="row">
                            <div class="col-md-4">
                                <div class="form-group">
                                    <label>供应商</label>
                                    <select th:field="*{supplier.id}" class="form-control">
                                        <option value="">无</option>
                                        <option th:each="s : ${suppliers}" 
                                                th:value="${s.id}" 
                                                th:text="${s.customerName}">供应商</option>
                                    </select>
                                </div>
                            </div>
                            <div class="col-md-4">
                                <div class="form-group">
                                    <label>区域/地块</label>
                                    <input type="text" th:field="*{area}" class="form-control" />
                                </div>
                            </div>
                            <div class="col-md-4">
                                <div class="form-group">
                                    <label>经办人</label>
                                    <input type="text" th:field="*{handler}" class="form-control" />
                                </div>
                            </div>
                        </div>
                        
                        <div class="form-group">
                            <label>批次号</label>
                            <input type="text" th:field="*{batchNo}" class="form-control" />
                        </div>
                        
                        <div class="form-group">
                            <label>备注</label>
                            <textarea th:field="*{remark}" class="form-control" rows="2"></textarea>
                        </div>
                        
                        <div class="form-group">
                            <button type="submit" class="btn btn-primary">
                                <i class="fa fa-save mr-1"></i>保存
                            </button>
                            <a href="/cost" class="btn btn-secondary">
                                <i class="fa fa-times mr-1"></i>取消
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </main>
    </div>
</div>

<script th:replace="fragments/layout :: scripts"></script>
</body>
</html>
