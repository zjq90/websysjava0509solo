<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/layout :: head">
    <title>仪表盘</title>
</head>
<body>
<div class="container-fluid">
    <div class="row">
        <nav th:replace="fragments/layout :: sidebar"></nav>
        
        <main role="main" class="col-md-10 ml-sm-auto px-4 main-content">
            <div class="pt-3 pb-2 mb-3">
                <h1 class="h2"><i class="fa fa-dashboard mr-2 text-primary"></i>仪表盘</h1>
            </div>
            
            <div th:replace="fragments/layout :: messages"></div>
            
            <div class="row mb-4">
                <div class="col-xl-3 col-md-6 mb-3">
                    <div class="card card-stat card-stat-success">
                        <div class="card-body">
                            <div class="row no-gutters align-items-center">
                                <div class="col mr-2">
                                    <div class="text-xs font-weight-bold text-success text-uppercase mb-1">销售总额</div>
                                    <div class="h5 mb-0 font-weight-bold text-gray-800" th:text="'¥' + ${#numbers.formatDecimal(dashboard.totalSalesAmount, 1, 2)}">¥0.00</div>
                                </div>
                                <div class="col-auto">
                                    <i class="fa fa-shopping-cart fa-2x text-gray-300"></i>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                
                <div class="col-xl-3 col-md-6 mb-3">
                    <div class="card card-stat card-stat-warning">
                        <div class="card-body">
                            <div class="row no-gutters align-items-center">
                                <div class="col mr-2">
                                    <div class="text-xs font-weight-bold text-warning text-uppercase mb-1">采购总额</div>
                                    <div class="h5 mb-0 font-weight-bold text-gray-800" th:text="'¥' + ${#numbers.formatDecimal(dashboard.totalPurchaseAmount, 1, 2)}">¥0.00</div>
                                </div>
                                <div class="col-auto">
                                    <i class="fa fa-truck fa-2x text-gray-300"></i>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                
                <div class="col-xl-3 col-md-6 mb-3">
                    <div class="card card-stat card-stat-primary">
                        <div class="card-body">
                            <div class="row no-gutters align-items-center">
                                <div class="col mr-2">
                                    <div class="text-xs font-weight-bold text-primary text-uppercase mb-1">应收账款</div>
                                    <div class="h5 mb-0 font-weight-bold text-gray-800" th:text="'¥' + ${#numbers.formatDecimal(dashboard.totalReceivable, 1, 2)}">¥0.00</div>
                                </div>
                                <div class="col-auto">
                                    <i class="fa fa-money fa-2x text-gray-300"></i>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                
                <div class="col-xl-3 col-md-6 mb-3">
                    <div class="card card-stat card-stat-danger">
                        <div class="card-body">
                            <div class="row no-gutters align-items-center">
                                <div class="col mr-2">
                                    <div class="text-xs font-weight-bold text-danger text-uppercase mb-1">应付账款</div>
                                    <div class="h5 mb-0 font-weight-bold text-gray-800" th:text="'¥' + ${#numbers.formatDecimal(dashboard.totalPayable, 1, 2)}">¥0.00</div>
                                </div>
                                <div class="col-auto">
                                    <i class="fa fa-credit-card fa-2x text-gray-300"></i>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="row">
                <div class="col-lg-6 mb-4">
                    <div class="card shadow mb-4">
                        <div class="card-header py-3">
                            <h6 class="m-0 font-weight-bold text-primary"><i class="fa fa-bell mr-2"></i>待办事项</h6>
                        </div>
                        <div class="card-body">
                            <div class="list-group">
                                <a href="/order" class="list-group-item list-group-item-action d-flex justify-content-between align-items-center">
                                    <span><i class="fa fa-clock-o text-warning mr-2"></i>待审核订单</span>
                                    <span class="badge badge-warning badge-pill" th:text="${dashboard.pendingOrdersCount}">0</span>
                                </a>
                                <a href="/finance" class="list-group-item list-group-item-action d-flex justify-content-between align-items-center">
                                    <span><i class="fa fa-exclamation-triangle text-danger mr-2"></i>未结清账款</span>
                                    <span class="badge badge-danger badge-pill" th:text="${dashboard.unsettledFinanceCount}">0</span>
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
                
                <div class="col-lg-6 mb-4">
                    <div class="card shadow mb-4">
                        <div class="card-header py-3">
                            <h6 class="m-0 font-weight-bold text-primary"><i class="fa fa-pie-chart mr-2"></i>成本构成分析</h6>
                        </div>
                        <div class="card-body">
                            <div th:if="${#lists.isEmpty(dashboard.costSummary)}" class="text-center text-muted py-4">
                                暂无成本数据
                            </div>
                            <div th:if="${not #lists.isEmpty(dashboard.costSummary)}">
                                <div th:each="cost : ${dashboard.costSummary}" class="mb-3">
                                    <div class="d-flex justify-content-between mb-1">
                                        <span class="small" th:text="${cost.categoryName}">类别</span>
                                        <span class="small text-muted" th:text="${cost.percentage + '%'}">0%</span>
                                    </div>
                                    <div class="progress">
                                        <div class="progress-bar" 
                                             th:classappend="${costStat.index} == 0 ? 'bg-primary' : 
                                                          ${costStat.index} == 1 ? 'bg-success' : 
                                                          ${costStat.index} == 2 ? 'bg-info' : 
                                                          ${costStat.index} == 3 ? 'bg-warning' : 'bg-secondary'"
                                             th:style="'width:' + ${cost.percentage} + '%'"
                                             role="progressbar">
                                        </div>
                                    </div>
                                    <div class="text-right small mt-1 text-muted" th:text="'¥' + ${#numbers.formatDecimal(cost.totalAmount, 1, 2)}">¥0.00</div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="row">
                <div class="col-lg-12">
                    <div class="card shadow mb-4">
                        <div class="card-header py-3">
                            <h6 class="m-0 font-weight-bold text-primary"><i class="fa fa-rocket mr-2"></i>快捷操作</h6>
                        </div>
                        <div class="card-body">
                            <div class="row">
                                <div class="col-md-2 mb-3">
                                    <a href="/variety/add" class="btn btn-outline-primary btn-block">
                                        <i class="fa fa-seedling fa-2x mb-2 d-block"></i>
                                        新增品种
                                    </a>
                                </div>
                                <div class="col-md-2 mb-3">
                                    <a href="/order/add?type=SALES" class="btn btn-outline-success btn-block">
                                        <i class="fa fa-shopping-cart fa-2x mb-2 d-block"></i>
                                        销售订单
                                    </a>
                                </div>
                                <div class="col-md-2 mb-3">
                                    <a href="/order/add?type=PURCHASE" class="btn btn-outline-warning btn-block">
                                        <i class="fa fa-truck fa-2x mb-2 d-block"></i>
                                        采购订单
                                    </a>
                                </div>
                                <div class="col-md-2 mb-3">
                                    <a href="/cost/add" class="btn btn-outline-info btn-block">
                                        <i class="fa fa-calculator fa-2x mb-2 d-block"></i>
                                        成本记录
                                    </a>
                                </div>
                                <div class="col-md-2 mb-3">
                                    <a href="/profit" class="btn btn-outline-dark btn-block">
                                        <i class="fa fa-bar-chart fa-2x mb-2 d-block"></i>
                                        利润分析
                                    </a>
                                </div>
                                <div class="col-md-2 mb-3">
                                    <a href="/test" class="btn btn-outline-secondary btn-block">
                                        <i class="fa fa-flask fa-2x mb-2 d-block"></i>
                                        测试功能
                                    </a>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>

<script th:replace="fragments/layout :: scripts"></script>
</body>
</html>
