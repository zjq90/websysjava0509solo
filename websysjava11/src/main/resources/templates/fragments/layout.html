<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title} + ' - 农业财务与成本管理系统'">农业财务与成本管理系统</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css">
    <style>
        .sidebar {
            min-height: 100vh;
            background: linear-gradient(180deg, #1e3c72 0%, #2a5298 100%);
        }
        .sidebar .nav-link {
            color: rgba(255,255,255,0.8);
            padding: 12px 20px;
            border-radius: 0;
        }
        .sidebar .nav-link:hover,
        .sidebar .nav-link.active {
            background: rgba(255,255,255,0.15);
            color: #fff;
        }
        .sidebar .nav-link i {
            width: 24px;
        }
        .main-content {
            background: #f8f9fa;
            min-height: 100vh;
        }
        .card-stat {
            border-left: 4px solid;
        }
        .card-stat-primary { border-left-color: #007bff; }
        .card-stat-success { border-left-color: #28a745; }
        .card-stat-warning { border-left-color: #ffc107; }
        .card-stat-danger { border-left-color: #dc3545; }
        .table-responsive {
            background: #fff;
            border-radius: 4px;
        }
        .status-badge {
            font-size: 12px;
            padding: 4px 8px;
        }
    </style>
</head>
<body>

<nav th:fragment="sidebar" class="sidebar col-md-2 d-md-block sidebar">
    <div class="text-center py-4">
        <h4 class="text-white font-weight-bold">
            <i class="fa fa-leaf mr-2"></i>农业管理
        </h4>
        <p class="text-white-50 small">财务与成本系统</p>
    </div>
    <ul class="nav flex-column">
        <li class="nav-item">
            <a class="nav-link" th:classappend="${active == 'dashboard'} ? 'active' : ''" th:href="@{/}">
                <i class="fa fa-dashboard"></i> 仪表盘
            </a>
        </li>
        <li class="nav-item mt-3">
            <small class="text-white-50 px-3">基础资料</small>
        </li>
        <li class="nav-item">
            <a class="nav-link" th:classappend="${active == 'variety'} ? 'active' : ''" th:href="@{/variety}">
                <i class="fa fa-seedling"></i> 品种管理
            </a>
        </li>
        <li class="nav-item">
            <a class="nav-link" th:classappend="${active == 'customer'} ? 'active' : ''" th:href="@{/customer}">
                <i class="fa fa-users"></i> 客户/供应商
            </a>
        </li>
        <li class="nav-item mt-3">
            <small class="text-white-50 px-3">进销存管理</small>
        </li>
        <li class="nav-item">
            <a class="nav-link" th:classappend="${active == 'order-sales'} ? 'active' : ''" th:href="@{/order/sales}">
                <i class="fa fa-shopping-cart"></i> 销售订单
            </a>
        </li>
        <li class="nav-item">
            <a class="nav-link" th:classappend="${active == 'order-purchase'} ? 'active' : ''" th:href="@{/order/purchase}">
                <i class="fa fa-truck"></i> 采购订单
            </a>
        </li>
        <li class="nav-item mt-3">
            <small class="text-white-50 px-3">财务管理</small>
        </li>
        <li class="nav-item">
            <a class="nav-link" th:classappend="${active == 'finance-receivable'} ? 'active' : ''" th:href="@{/finance/receivable}">
                <i class="fa fa-money"></i> 应收账款
            </a>
        </li>
        <li class="nav-item">
            <a class="nav-link" th:classappend="${active == 'finance-payable'} ? 'active' : ''" th:href="@{/finance/payable}">
                <i class="fa fa-credit-card"></i> 应付账款
            </a>
        </li>
        <li class="nav-item">
            <a class="nav-link" th:classappend="${active == 'cost'} ? 'active' : ''" th:href="@{/cost}">
                <i class="fa fa-calculator"></i> 成本核算
            </a>
        </li>
        <li class="nav-item mt-3">
            <small class="text-white-50 px-3">分析报表</small>
        </li>
        <li class="nav-item">
            <a class="nav-link" th:classappend="${active == 'profit'} ? 'active' : ''" th:href="@{/profit}">
                <i class="fa fa-bar-chart"></i> 利润分析
            </a>
        </li>
        <li class="nav-item mt-3">
            <small class="text-white-50 px-3">系统工具</small>
        </li>
        <li class="nav-item">
            <a class="nav-link" th:classappend="${active == 'test'} ? 'active' : ''" th:href="@{/test}">
                <i class="fa fa-flask"></i> 测试功能
            </a>
        </li>
    </ul>
</nav>

<div th:fragment="messages" class="mb-3">
    <div th:if="${success}" class="alert alert-success alert-dismissible fade show">
        <i class="fa fa-check-circle mr-2"></i><span th:text="${success}"></span>
        <button type="button" class="close" data-dismiss="alert">&times;</button>
    </div>
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show">
        <i class="fa fa-exclamation-circle mr-2"></i><span th:text="${error}"></span>
        <button type="button" class="close" data-dismiss="alert">&times;</button>
    </div>
</div>

<div th:fragment="pagination(baseUrl, currentPage, totalPages, totalItems, size)">
    <div class="d-flex justify-content-between align-items-center mt-3" th:if="${totalPages > 1}">
        <div class="text-muted small">
            共 <span th:text="${totalItems}">0</span> 条记录，第 
            <span th:text="${currentPage + 1}">1</span> / 
            <span th:text="${totalPages}">1</span> 页
        </div>
        <nav>
            <ul class="pagination pagination-sm mb-0">
                <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled' : ''">
                    <a class="page-link" th:href="@{${baseUrl}(page=0, size=${size})}">
                        <i class="fa fa-angle-double-left"></i>
                    </a>
                </li>
                <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled' : ''">
                    <a class="page-link" th:href="@{${baseUrl}(page=${currentPage - 1}, size=${size})}">
                        <i class="fa fa-angle-left"></i>
                    </a>
                </li>
                
                <li class="page-item" 
                    th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
                    th:if="${i == 0 or i == totalPages - 1 or (i >= currentPage - 2 and i <= currentPage + 2)}"
                    th:classappend="${i == currentPage} ? 'active' : ''">
                    <a class="page-link" th:href="@{${baseUrl}(page=${i}, size=${size})}" th:text="${i + 1}">1</a>
                </li>
                
                <li class="page-item" th:classappend="${currentPage >= totalPages - 1} ? 'disabled' : ''">
                    <a class="page-link" th:href="@{${baseUrl}(page=${currentPage + 1}, size=${size})}">
                        <i class="fa fa-angle-right"></i>
                    </a>
                </li>
                <li class="page-item" th:classappend="${currentPage >= totalPages - 1} ? 'disabled' : ''">
                    <a class="page-link" th:href="@{${baseUrl}(page=${totalPages - 1}, size=${size})}">
                        <i class="fa fa-angle-double-right"></i>
                    </a>
                </li>
            </ul>
        </nav>
    </div>
    <div class="d-flex justify-content-between align-items-center mt-3" th:if="${totalPages <= 1}">
        <div class="text-muted small">
            共 <span th:text="${totalItems}">0</span> 条记录
        </div>
    </div>
</div>

<script th:fragment="scripts" src="https://cdn.jsdelivr.net/npm/jquery@3.6.4/dist/jquery.min.js"></script>
<script th:fragment="scripts" src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
