<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/layout :: head">
    <title>财务账款表单</title>
</head>
<body>
<div class="container-fluid">
    <div class="row">
        <nav th:replace="fragments/layout :: sidebar"></nav>
        
        <main role="main" class="col-md-10 ml-sm-auto px-4 main-content">
            <div class="pt-3 pb-2 mb-3">
                <h1 class="h2">
                    <i class="fa" th:classappend="${finance.financeType == 'PAYABLE'} ? 'fa-credit-card text-danger' : 'fa-money text-primary'" mr-2></i>
                    新增<span th:text="${finance.financeType == 'PAYABLE'} ? '应付' : '应收'">应收</span>账款
                </h1>
            </div>
            
            <div class="card shadow mb-4">
                <div class="card-body">
                    <form th:action="@{/finance/save}" th:object="${finance}" method="post">
                        <input type="hidden" th:field="*{id}" />
                        <input type="hidden" th:field="*{financeType}" />
                        <input type="hidden" th:field="*{status}" />
                        
                        <div class="row">
                            <div class="col-md-4">
                                <div class="form-group">
                                    <label>账款编号</label>
                                    <input type="text" th:value="${financeNo}" class="form-control" readonly />
                                </div>
                            </div>
                            <div class="col-md-4">
                                <div class="form-group">
                                    <label>客户/供应商 <span class="text-danger">*</span></label>
                                    <select th:field="*{customer.id}" class="form-control" required>
                                        <option value="">请选择</option>
                                        <option th:each="c : ${customers}" 
                                                th:value="${c.id}" 
                                                th:text="${c.customerCode + ' - ' + c.customerName}">客户</option>
                                    </select>
                                </div>
                            </div>
                            <div class="col-md-4">
                                <div class="form-group">
                                    <label>账款日期 <span class="text-danger">*</span></label>
                                    <input type="date" th:field="*{financeDate}" class="form-control" required />
                                </div>
                            </div>
                        </div>
                        
                        <div class="row">
                            <div class="col-md-4">
                                <div class="form-group">
                                    <label>到期日期</label>
                                    <input type="date" th:field="*{dueDate}" class="form-control" />
                                </div>
                            </div>
                            <div class="col-md-4">
                                <div class="form-group">
                                    <label>总金额 <span class="text-danger">*</span></label>
                                    <input type="number" step="0.01" th:field="*{totalAmount}" class="form-control" required />
                                </div>
                            </div>
                            <div class="col-md-4">
                                <div class="form-group">
                                    <label>已收/已付金额</label>
                                    <input type="number" step="0.01" th:field="*{paidAmount}" class="form-control" />
                                </div>
                            </div>
                        </div>
                        
                        <div class="form-group">
                            <label>摘要</label>
                            <input type="text" th:field="*{summary}" class="form-control" />
                        </div>
                        
                        <div class="form-group">
                            <label>备注</label>
                            <textarea th:field="*{remark}" class="form-control" rows="2"></textarea>
                        </div>
                        
                        <div class="form-group">
                            <button type="submit" class="btn btn-primary">
                                <i class="fa fa-save mr-1"></i>保存
                            </button>
                            <a href="/finance" class="btn btn-secondary">
                                <i class="fa fa-times mr-1"></i>取消
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </main>
    </div>
</div>

<script th:replace="fragments/layout :: scripts"></script>
</body>
</html>
