<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/layout :: head">
    <title>收付款操作</title>
</head>
<body>
<div class="container-fluid">
    <div class="row">
        <nav th:replace="fragments/layout :: sidebar"></nav>
        
        <main role="main" class="col-md-10 ml-sm-auto px-4 main-content">
            <div class="pt-3 pb-2 mb-3">
                <h1 class="h2">
                    <i class="fa fa-money mr-2 text-success"></i>
                    <span th:text="${finance.financeType == 'RECEIVABLE'} ? '收款' : '付款'">收款</span>操作
                </h1>
            </div>
            
            <div class="row">
                <div class="col-lg-6 mx-auto">
                    <div class="card shadow mb-4">
                        <div class="card-header py-3">
                            <h6 class="m-0 font-weight-bold text-primary">账款信息</h6>
                        </div>
                        <div class="card-body">
                            <div class="row mb-2">
                                <div class="col-md-6"><strong>账款编号：</strong><span th:text="${finance.financeNo}">-</span></div>
                                <div class="col-md-6"><strong>客户/供应商：</strong><span th:text="${finance.customer.customerName}">-</span></div>
                            </div>
                            <div class="row">
                                <div class="col-md-6"><strong>总金额：</strong><span th:text="'¥' + ${#numbers.formatDecimal(finance.totalAmount, 1, 2)}">-</span></div>
                                <div class="col-md-6"><strong>剩余金额：</strong><span class="text-danger" th:text="'¥' + ${#numbers.formatDecimal(finance.remainingAmount, 1, 2)}">-</span></div>
                            </div>
                        </div>
                    </div>
                    
                    <div class="card shadow mb-4">
                        <div class="card-header py-3">
                            <h6 class="m-0 font-weight-bold text-primary">收付款信息</h6>
                        </div>
                        <div class="card-body">
                            <form th:action="@{/finance/payment/{id}(id=${finance.id})}" th:object="${payment}" method="post">
                                <div class="form-group">
                                    <label>收付款日期 <span class="text-danger">*</span></label>
                                    <input type="date" th:field="*{paymentDate}" class="form-control" required />
                                </div>
                                <div class="form-group">
                                    <label>金额 <span class="text-danger">*</span></label>
                                    <input type="number" step="0.01" th:field="*{amount}" class="form-control" required 
                                           th:max="${finance.remainingAmount}" />
                                    <small class="text-muted">最大可输入：<span th:text="${'¥' + #numbers.formatDecimal(finance.remainingAmount, 1, 2)}">¥0.00</span></small>
                                </div>
                                <div class="form-group">
                                    <label>支付方式 <span class="text-danger">*</span></label>
                                    <select th:field="*{paymentMethod}" class="form-control" required>
                                        <option value="CASH">现金</option>
                                        <option value="BANK">银行转账</option>
                                        <option value="CHECK">支票</option>
                                        <option value="OTHER">其他</option>
                                    </select>
                                </div>
                                <div class="row">
                                    <div class="col-md-6">
                                        <div class="form-group">
                                            <label>银行名称</label>
                                            <input type="text" th:field="*{bankName}" class="form-control" />
                                        </div>
                                    </div>
                                    <div class="col-md-6">
                                        <div class="form-group">
                                            <label>交易号/支票号</label>
                                            <input type="text" th:field="*{transactionNo}" class="form-control" />
                                        </div>
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label>经办人</label>
                                    <input type="text" th:field="*{handler}" class="form-control" />
                                </div>
                                <div class="form-group">
                                    <label>摘要</label>
                                    <input type="text" th:field="*{summary}" class="form-control" />
                                </div>
                                <div class="form-group">
                                    <button type="submit" class="btn btn-success btn-block">
                                        <i class="fa fa-check mr-1"></i>确认
                                        <span th:text="${finance.financeType == 'RECEIVABLE'} ? '收款' : '付款'">收款</span>
                                    </button>
                                    <a th:href="@{/finance/view/{id}(id=${finance.id})}" class="btn btn-secondary btn-block">
                                        <i class="fa fa-times mr-1"></i>取消
                                    </a>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>

<script th:replace="fragments/layout :: scripts"></script>
</body>
</html>
