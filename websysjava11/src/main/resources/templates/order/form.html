<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/layout :: head">
    <title>订单表单</title>
    <style>
        .item-row { margin-bottom: 10px; }
    </style>
</head>
<body>
<div class="container-fluid">
    <div class="row">
        <nav th:replace="fragments/layout :: sidebar"></nav>
        
        <main role="main" class="col-md-10 ml-sm-auto px-4 main-content">
            <div class="pt-3 pb-2 mb-3">
                <h1 class="h2">
                    <i class="fa" th:classappend="${order.orderType == 'PURCHASE'} ? 'fa-truck text-warning' : 'fa-shopping-cart text-success'" mr-2></i>
                    新增<span th:text="${order.orderType == 'PURCHASE'} ? '采购' : '销售'">销售</span>订单
                </h1>
            </div>
            
            <div class="card shadow mb-4">
                <div class="card-body">
                    <form th:action="@{/order/save}" th:object="${order}" method="post">
                        <input type="hidden" th:field="*{id}" />
                        <input type="hidden" th:field="*{orderType}" />
                        <input type="hidden" th:field="*{orderStatus}" />
                        
                        <div class="row">
                            <div class="col-md-4">
                                <div class="form-group">
                                    <label>订单编号</label>
                                    <input type="text" th:value="${orderNo}" class="form-control" readonly />
                                </div>
                            </div>
                            <div class="col-md-4">
                                <div class="form-group">
                                    <label>客户/供应商 <span class="text-danger">*</span></label>
                                    <select th:field="*{customer.id}" class="form-control" required>
                                        <option value="">请选择</option>
                                        <option th:each="c : ${customers}" 
                                                th:value="${c.id}" 
                                                th:text="${c.customerCode + ' - ' + c.customerName}">-</option>
                                    </select>
                                </div>
                            </div>
                            <div class="col-md-4">
                                <div class="form-group">
                                    <label>订单日期</label>
                                    <input type="date" th:field="*{orderDate}" class="form-control" />
                                </div>
                            </div>
                        </div>
                        
                        <div class="row">
                            <div class="col-md-4">
                                <div class="form-group">
                                    <label>发货/到货日期</label>
                                    <input type="date" th:field="*{deliveryDate}" class="form-control" />
                                </div>
                            </div>
                            <div class="col-md-4">
                                <div class="form-group">
                                    <label>折扣金额</label>
                                    <input type="number" step="0.01" th:field="*{discountAmount}" class="form-control" />
                                </div>
                            </div>
                            <div class="col-md-4">
                                <div class="form-group">
                                    <label>税额</label>
                                    <input type="number" step="0.01" th:field="*{taxAmount}" class="form-control" />
                                </div>
                            </div>
                        </div>
                        
                        <div class="form-group">
                            <label>制单人</label>
                            <input type="text" th:field="*{creator}" class="form-control" />
                        </div>
                        
                        <div class="form-group">
                            <label>备注</label>
                            <textarea th:field="*{remark}" class="form-control" rows="2"></textarea>
                        </div>
                        
                        <div class="alert alert-info">
                            <i class="fa fa-info-circle mr-1"></i>
                            提示：订单保存后将自动生成对应的<span th:text="${order.orderType == 'PURCHASE'} ? '应付' : '应收'">应收</span>账款
                        </div>
                        
                        <div class="form-group">
                            <button type="submit" class="btn btn-primary">
                                <i class="fa fa-save mr-1"></i>保存
                            </button>
                            <a href="/order" class="btn btn-secondary">
                                <i class="fa fa-times mr-1"></i>取消
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </main>
    </div>
</div>

<script th:replace="fragments/layout :: scripts"></script>
</body>
</html>
