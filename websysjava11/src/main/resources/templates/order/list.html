<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/layout :: head">
    <title>订单管理</title>
</head>
<body>
<div class="container-fluid">
    <div class="row">
        <nav th:replace="fragments/layout :: sidebar"></nav>
        
        <main role="main" class="col-md-10 ml-sm-auto px-4 main-content">
            <div class="pt-3 pb-2 mb-3 d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center">
                <h1 class="h2">
                    <i class="fa" th:classappend="${selectedType == 'PURCHASE'} ? 'fa-truck text-warning' : 'fa-shopping-cart text-success'" mr-2></i>
                    <span th:text="${selectedType == 'PURCHASE'} ? '采购订单' : '订单管理'">订单管理</span>
                </h1>
                <div class="btn-toolbar mb-2 mb-md-0">
                    <div class="btn-group mr-2">
                        <a href="/order/sales" class="btn btn-outline-secondary" th:classappend="${selectedType == 'SALES'} ? 'active' : ''">销售订单</a>
                        <a href="/order/purchase" class="btn btn-outline-secondary" th:classappend="${selectedType == 'PURCHASE'} ? 'active' : ''">采购订单</a>
                    </div>
                    <a th:href="@{/order/add(type=${selectedType != null} ? ${selectedType} : 'SALES')}" class="btn btn-primary">
                        <i class="fa fa-plus mr-1"></i>新增
                    </a>
                </div>
            </div>
            
            <div th:replace="fragments/layout :: messages"></div>
            
            <div class="card shadow mb-4">
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-striped table-hover">
                            <thead class="thead-light">
                                <tr>
                                    <th>订单编号</th>
                                    <th>类型</th>
                                    <th>客户/供应商</th>
                                    <th>订单日期</th>
                                    <th>总金额</th>
                                    <th>状态</th>
                                    <th>关联财务</th>
                                    <th>操作</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:if="${#lists.isEmpty(orders)}">
                                    <td colspan="8" class="text-center py-4 text-muted">暂无数据</td>
                                </tr>
                                <tr th:each="order : ${orders}">
                                    <td th:text="${order.orderNo}">XS20260501</td>
                                    <td>
                                        <span class="badge status-badge" 
                                              th:classappend="${order.orderType == 'SALES'} ? 'badge-success' : 'badge-warning'"
                                              th:text="${order.orderType == 'SALES'} ? '销售' : '采购'">销售</span>
                                    </td>
                                    <td th:text="${order.customer.customerName}">客户名称</td>
                                    <td th:text="${order.orderDate}">2026-05-01</td>
                                    <td th:text="'¥' + ${#numbers.formatDecimal(order.netAmount, 1, 2)}">¥0.00</td>
                                    <td>
                                        <span class="badge status-badge" 
                                              th:classappend="${order.orderStatus == 'PENDING'} ? 'badge-warning' : 
                                                              ${order.orderStatus == 'CONFIRMED'} ? 'badge-primary' : 
                                                              ${order.orderStatus == 'SHIPPED'} ? 'badge-info' : 
                                                              ${order.orderStatus == 'COMPLETED'} ? 'badge-success' : 'badge-secondary'"
                                              th:text="${order.orderStatus.description}">待审核</span>
                                    </td>
                                    <td>
                                        <span th:if="${order.finance != null}" class="badge badge-success">
                                            <i class="fa fa-check"></i> 已生成
                                        </span>
                                        <span th:if="${order.finance == null}" class="badge badge-secondary">
                                            <i class="fa fa-times"></i> 未生成
                                        </span>
                                    </td>
                                    <td>
                                        <a th:href="@{/order/view/{id}(id=${order.id})}" class="btn btn-sm btn-outline-info">
                                            <i class="fa fa-eye"></i>
                                        </a>
                                        <a th:href="@{/order/delete/{id}(id=${order.id})}" 
                                           class="btn btn-sm btn-outline-danger"
                                           onclick="return confirm('确定要删除吗？')">
                                            <i class="fa fa-trash"></i>
                                        </a>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                    <div th:if="${!isFiltered}" th:replace="fragments/layout :: pagination('/order', ${currentPage}, ${totalPages}, ${totalItems}, ${size})"></div>
                </div>
            </div>
        </main>
    </div>
</div>

<script th:replace="fragments/layout :: scripts"></script>
</body>
</html>
